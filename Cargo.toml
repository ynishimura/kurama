[workspace]
# `xtask` is the agent interface (`cargo xtask ...`); it is never installed.
members = ["xtask"]

[package]
name = "kurama"
version = "0.1.0"
# 2024, so rustdoc compiles every doctest into one binary instead of linking
# the 150MB rlib 23 times (`--merge-doctests auto`).
edition = "2024"
rust-version = "1.95.0"
authors = ["Yuji Nishimura"]
description = "Credential switcher and API client for the terminal: AWS roles with MFA from 1Password, OAuth and API-key sources, an OpenAPI explorer, and local data and database access"
license = "MIT"
repository = "https://github.com/ynishimura/kurama"
homepage = "https://github.com/ynishimura/kurama"
readme = "README.md"
keywords = ["aws", "credentials", "oauth", "openapi", "cli"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "kurama"
path = "src/main.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "time", "signal", "process", "io-util"] }
async-trait = "0.1.92"

# AWS SDK
aws-config = "1.12.0"
# Use the current HTTPS client without the legacy rustls / hyper 0.14 connector.
aws-sdk-sts = { version = "1.114.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-credential-types = "1.3.0"

# TUI framework
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"

# Configuration and serialization
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
serde_json = { version = "1.0.151", features = ["preserve_order"] }

# HTTP client
reqwest = { version = "0.13.5", features = ["json", "query"] }
url = "2.5.8"

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"

# CLI argument parsing and shell completion
clap = "4.6.6"
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Time handling
chrono = { version = "0.4.45", features = ["serde"] }

# Security - Memory zeroization
zeroize = { version = "1.9.0", features = ["derive"] }
unicode-width = "0.2.2"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
jaq-core = "3"
jaq-std = "3"
jaq-json = { version = "2", features = ["sync"] }
aws-sigv4 = "1.5.1"
aws-smithy-runtime-api = "1.16.0"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
libduckdb-sys = { version = "=1.10503.0", features = ["bundled", "parquet", "json"] }
aws-sdk-s3 = { version = "1.148.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
glob = "0.3.4"
tempfile = "3.27.0"
schemars = "1.2.2"
arrow = { version = "58", default-features = false, features = ["ffi"] }
flate2 = "1.1.10"
percent-encoding = "2.3.2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "mysql", "sqlite", "tls-rustls-aws-lc-rs"] }
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
aws-sdk-ssm = { version = "1.124.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.117.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
strum = { version = "0.28", features = ["derive"] }
toml_edit = "0.25.15"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4.2.0"
security-framework = "3.7.0"

[features]
default = []
# Test-only hooks used by tests/scenarios/ (file-backed session cache).
# Never enable for an installed binary.
test-fakes = []

[dev-dependencies]
aws-smithy-types = "1.6.3"
tokio = { version = "1.53.1", features = ["test-util"] }
# Testing
http = "1.5.0"
aws-smithy-http-client = { version = "1.4.0", features = ["test-util"] }
mockall = "0.15.0"
rstest = "0.27.0"
serial_test = "4.0.1"
wiremock = "0.6.5"
portable-pty = "0.9.0"
vt100 = "0.16.2"
font8x8 = "0.3.1"
png = "0.18.1"
shell-words = "1.1.1"
syn = { version = "2.0.119", features = ["full", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }

# `cargo xtask check` compiles the library with `--cfg dead_code_audit`, which
# makes its public modules crate-private (see `src/lib.rs`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dead_code_audit)"] }

[build-dependencies]
cc = "1.4.5"
sha2 = "0.11"

# Debug info is what made `target/` outgrow the sweep cap, and the cap then
# evicted the DuckDB build the next gate needed. Nothing here steps through a
# dependency, and a backtrace into kurama's own code needs line tables only.
[profile.dev]
debug = "line-tables-only"

# DuckDB is compiled from source by libduckdb-sys; under the default profile its
# C++ objects are 90% DWARF. The same is true of every other dependency.
[profile.dev.package."*"]
debug = false
