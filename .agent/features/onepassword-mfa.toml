[onepassword-mfa]
summary = "Fetch long-term keys and TOTP codes from the 1Password CLI (op), with a service account token from the keychain and a deadline so no run waits on a person who is not there"
entry = "src/adapters/auth/onepassword.rs"
files = [
  "src/domain/functions/onepassword.rs",
  "src/ports/mfa.rs",
  "src/adapters/auth/",
  "tests/fakes/op",
]
tests = ["onepassword"]
scenarios = []
depends_on = ["assume-role", "oauth", "session-cache", "config", "errors"]
notes = "tests/fakes/op stands in for the real CLI (KURAMA_FAKE_OP_MODE=not-signed-in simulates a signed-out CLI, =hang one that waits for a biometric answer; both cover every call but `--version`; =otp-fails fails only `item get --otp`, and the item JSON the fallback reads holds a different code); missing-item and missing-OTP-field failures are unit-tested with a mocked OnePasswordCli. The deadline is only armed without a terminal, so an interactive approval still takes as long as it takes. A scenario seeds the service account token through KURAMA_TEST_KEYCHAIN_SECRET_DIR (Scenario::with_service_account_token), which stands in for the real keychain"

[onepassword-mfa.real]
pending = "runs the real 1Password CLI; tests/fakes/op stands in"
