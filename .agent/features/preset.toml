[preset]
summary = "`kurama preset [--json]`: the bundled provider catalog (GitHub, Google, Linear, ...), listed without reading configuration; `kurama preset setup <ID> [--as NAME] [--auth-as NAME] [--set k=v]... [--dry-run | --offline] [--json]`: one preset expanded into [auth.*] / [api.*] TOML, reusing only a compatible [auth.*], checked with config.toml and appended through the config writer (an [api.*] already there is kept), then the file read back, the credential readiness, kurama's Claude Code Skill and one GET of the preset's example, each step reported with what to run next; --dry-run only plans and checks, --offline sends nothing"
entry = "src/shell/cli/commands/preset.rs"
docs = ["docs/development/flows/preset.md"]
files = [
  "src/shell/cli/commands/preset_setup.rs",
  "src/domain/types/preset.rs",
  "src/domain/functions/preset_render.rs",
  "src/domain/functions/preset_render_tests.rs",
  "src/shell/cli/commands/preset.rs",
  "tests/scenarios/preset.rs",
]
scenarios = [
  "preset_list_runs_without_reading_config",
  "preset_setup_dry_run_prints_the_steps_then_the_toml",
  "preset_setup_elevenlabs_puts_the_key_in_xi_api_key",
  "preset_setup_openai_sends_the_key_as_a_bearer_token",
  "preset_setup_slack_sends_the_bot_token_as_a_bearer_token",
  "preset_setup_contentful_sends_the_management_token_as_a_bearer_token",
  "preset_setup_fireworks_sends_the_key_as_a_bearer_token",
  "preset_setup_jira_sends_the_email_and_token_as_basic",
  "preset_setup_commands_shell_quote_dynamic_values",
  "preset_setup_zendesk_gets_a_client_credentials_token",
  "preset_setup_backlog_puts_the_key_in_the_api_key_parameter",
  "preset_setup_dry_run_missing_input_lists_the_keys_and_the_setup_steps",
  "preset_setup_missing_input_is_an_argument_error",
  "preset_setup_invalid_input_value_names_the_input",
  "preset_setup_with_a_broken_config_stays_config_invalid",
  "preset_unknown_id_exits_2_with_hint",
  "completion_preset_completes_ids_without_reading_config",
  "preset_setup_reuses_only_a_compatible_auth",
  "preset_setup_validates_the_fragment_with_existing_config",
  "preset_setup_as_renames_only_the_api_and_keeps_the_auth_name",
  "preset_setup_offline_writes_the_sections_and_status_lists_them",
  "preset_setup_reuses_an_existing_auth_and_warns_about_scopes",
  "preset_setup_keeps_an_existing_api_as_it_is",
  "preset_setup_missing_input_exits_2_lists_the_keys",
  "preset_setup_dry_run_writes_nothing",
  "preset_setup_dry_run_skips_every_step_after_configure",
  "preset_setup_refuses_a_literal_secret_exits_2",
  "preset_setup_keeps_the_existing_comments_and_order",
  "preset_setup_refuses_an_incompatible_existing_auth",
  "preset_setup_checks_auth_names_against_aws_profiles",
  "preset_setup_as_reuses_the_default_auth_without_renaming_it",
  "config_remove_api_keeps_a_shared_auth",
]
depends_on = ["config", "cli-entry", "errors", "oauth", "api-explorer", "secrets", "profile-loading", "tui", "agent-guide", "agent-policy", "api-client", "audit"]
notes = "The catalog's endpoints, scopes, headers and base URLs were taken from the providers' documentation on 2026-09-26; only Linear's personal API key header (`Authorization: <key>`, refused with `Bearer`) and, on 2026-10-10, Zendesk's client credentials grant (`/oauth/tokens`, then `/api/v2/users/me` on two accounts) were checked against the real service. Logging in and calling each provider is a manual check."

[preset.real]
not_applicable = "prints configuration from data compiled into the binary, checks it against local files and `preset add` appends it to config.toml; nothing it does reaches a provider, and the providers the data names are verified by hand"
