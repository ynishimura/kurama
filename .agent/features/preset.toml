[preset]
summary = "`kurama preset [--json]`: the bundled provider catalog (GitHub, Google, Linear), listed without reading configuration; `kurama preset show <ID> [--as NAME] [--auth-as NAME] [--set k=v]... [--open] [--json]`: one preset expanded into [auth.*] / [api.*] TOML on stdout and setup steps on stderr, reusing only a compatible [auth.*] and checked with config.toml through the config writer's append and validate, never saved; `kurama preset add <ID> [--as NAME] [--auth-as NAME] [--set k=v]... [--dry-run] [--json]`: the same TOML appended to config.toml through the config writer's save, with config add's JSON save result; a scope a reused auth lacks is a step and a warning naming the `kurama config set auth.<name>.scopes` that writes the whole list"
entry = "src/shell/cli/commands/preset.rs"
files = [
  "src/domain/types/preset.rs",
  "src/domain/functions/preset_render.rs",
  "src/domain/functions/preset_render_tests.rs",
  "src/shell/cli/commands/preset.rs",
  "src/shell/cli/commands/preset_add.rs",
  "tests/scenarios/preset.rs",
]
scenarios = [
  "preset_list_runs_without_reading_config",
  "preset_show_prints_the_toml_on_stdout_and_the_setup_on_stderr",
  "preset_show_elevenlabs_puts_the_key_in_xi_api_key",
  "preset_show_openai_sends_the_key_as_a_bearer_token",
  "preset_show_slack_sends_the_bot_token_as_a_bearer_token",
  "preset_show_contentful_sends_the_management_token_as_a_bearer_token",
  "preset_show_fireworks_sends_the_key_as_a_bearer_token",
  "preset_show_jira_sends_the_email_and_token_as_basic",
  "preset_setup_commands_shell_quote_dynamic_values",
  "preset_show_zendesk_sends_email_slash_token_as_basic",
  "preset_show_backlog_puts_the_key_in_the_api_key_parameter",
  "preset_show_open_without_a_terminal_prints_the_url_and_opens_nothing",
  "preset_show_missing_input_exits_2_lists_the_keys",
  "preset_show_missing_input_is_an_argument_error",
  "preset_show_invalid_input_value_names_the_input",
  "preset_show_with_a_broken_config_stays_config_invalid",
  "preset_unknown_id_exits_2_with_hint",
  "completion_preset_completes_ids_without_reading_config",
  "preset_show_reuses_only_a_compatible_auth",
  "preset_show_validates_the_fragment_with_existing_config",
  "preset_show_as_renames_only_the_api_and_keeps_the_auth_name",
  "preset_add_writes_the_sections_and_status_lists_them",
  "preset_add_reuses_an_existing_auth_and_warns_about_scopes",
  "preset_add_refuses_an_existing_name_exits_2",
  "preset_add_missing_input_exits_2_lists_the_keys",
  "preset_add_dry_run_writes_nothing",
  "preset_add_dry_run_reports_pending_steps",
  "preset_add_refuses_a_literal_secret_exits_2",
  "preset_add_keeps_the_existing_comments_and_order",
  "preset_add_refuses_an_incompatible_existing_auth",
  "preset_add_checks_auth_names_against_aws_profiles",
  "preset_add_as_reuses_the_default_auth_without_renaming_it",
  "config_remove_api_keeps_a_shared_auth",
]
depends_on = ["config", "cli-entry", "errors", "oauth", "api-explorer", "secrets", "profile-loading", "tui"]
notes = "The catalog's endpoints, scopes, headers and base URLs were taken from the providers' documentation on 2026-09-26; only Linear's personal API key header (`Authorization: <key>`, refused with `Bearer`) was checked against the real service. Logging in and calling each provider is a manual check."

[preset.real]
not_applicable = "prints configuration from data compiled into the binary, checks it against local files and `preset add` appends it to config.toml; nothing it does reaches a provider, and the providers the data names are verified by hand"
