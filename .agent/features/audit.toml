[audit]
summary = "`kurama audit [--since] [--json]`: the api, exec, db and data calls recorded in ~/.local/state/kurama/audit.jsonl, without a secret, a query string, a header or a body; `--watch` opens the activity monitor (src/shell/tui/activity/, feature tui) on them"
entry = "src/shell/audit.rs"
docs = ["docs/development/flows/agent-runs.md"]
files = [
  "src/shell/audit.rs",
  "src/shell/cli/commands/audit.rs",
  "src/adapters/audit_log.rs",
  "src/adapters/config/audit.rs",
  "src/domain/functions/audit.rs",
  "src/domain/types/audit.rs",
]
scenarios = [
  "audit_records_an_api_call_without_its_query_or_headers",
  "audit_lists_the_calls_as_json",
  "audit_write_failure_does_not_fail_the_command",
  "mcp_lists_the_tools_and_calls_an_api",
  "audit_watch_without_a_terminal_exits_2_with_hint",
  "tui_activity_shows_audit_entries_as_they_are_appended",
]
depends_on = ["config", "cli-entry", "errors"]
notes = "Recorded by default for a KURAMA_AGENT run only ([audit] enabled = true: every run, false: none). An exec entry is written before kurama replaces itself, so it has no exit code, and an exec that fails to start leaves none. db / data keep the SHA-256 of SQL written on the command line; a --file or --request statement leaves sql_sha256 empty. The harness holds every audit line of every scenario to a path without a query and to the fields AuditEntry names"

[audit.real]
not_applicable = "writes and reads a local file; the calls it records are the api-client, exec and database ones, verified there"
