[secrets]
summary = "Secret references in configuration: `op://` through the 1Password CLI, `aws-secrets://` and `aws-ssm://` through AWS with the role of an AWS profile, and a literal as itself; one `SecretResolver` for `[db.*]`, `[auth.*] client_secret` and `[auth.*] token` alike, with each secret read once per process"
entry = "src/domain/types/secret_ref.rs"
files = [
  "src/domain/types/secret_ref.rs",
  "src/ports/secret.rs",
  "src/adapters/auth/secret.rs",
  "src/adapters/aws/secret_store.rs",
  "src/adapters/secret_resolver.rs",
  "src/shell/aws_profile_credentials.rs",
]
tests = ["secret_ref", "aws_profile_credentials"]
depends_on = ["config", "errors", "assume-role", "onepassword-mfa", "profile-loading", "api-client", "cli-entry"]
scenarios = [
  "oauth_secrets_kind_real_exec_reads_onepassword_and_parameter_store",
  "oauth_secrets_kind_reads_two_fields_of_one_item_with_one_op_call",
  "oauth_secrets_kind_exec_sets_every_variable",
  "oauth_token_kind_sends_the_configured_header",
  "api_verbose_reports_each_secret_read",
]
notes = "The reference grammar is parsed once, at deserialization, so a misspelled scheme is CONFIG_INVALID with its line instead of a literal password nobody notices. AWS is reached through the fake endpoints KURAMA_TEST_SECRETSMANAGER_ENDPOINT and KURAMA_TEST_SSM_ENDPOINT (`--features test-fakes`), whose answers are built from the id they were asked for, so a scenario can say which secret a value came from. Not verified against real AWS: a real Secrets Manager secret, a real SecureString parameter, a customer-managed KMS key and the refusal a role without the action really gets."

[secrets.real]
cases = "ElevenLabs with the key read from 1Password and from Parameter Store (kurama-sandbox)"
