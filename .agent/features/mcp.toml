[mcp]
summary = "`kurama mcp`: an MCP server on stdio, or over Streamable HTTP with --listen, whose tools (ready, list_apis, list_operations, describe_operation, call_api, query_data, query_db, and with [obsidian] obsidian_search, obsidian_read, obsidian_files) run kurama's own JSON commands as an agent's, so the [agent] policy, the audit log and the error document are the command line's"
entry = "src/shell/cli/commands/mcp.rs"
files = [
  "src/shell/cli/commands/mcp.rs",
  "src/domain/functions/mcp.rs",
  "src/domain/functions/mcp_http.rs",
  "src/adapters/mcp_http.rs",
  "src/adapters/own_command.rs",
  "tests/scenarios/mcp.rs",
  "docs/agents/kurama/mcp.md",
  "src/shell/cli/commands/obsidian.rs",
  "src/domain/functions/obsidian.rs",
  "src/adapters/obsidian_cli.rs",
  "tests/fakes/obsidian",
  "tests/fixtures/obsidian-vault/",
  "docs/agents/kurama/obsidian.md",
]
scenarios = [
  "mcp_lists_the_tools_and_calls_an_api",
  "mcp_returns_the_error_document_when_a_person_has_to_act",
  "mcp_http_answers_tools_list_with_the_token",
  "mcp_http_accepts_the_token_with_and_without_the_bearer_prefix",
  "mcp_http_runs_call_api_as_an_agent_and_records_the_audit_entry",
  "mcp_http_refuses_a_missing_or_wrong_token_and_runs_nothing",
  "mcp_http_answers_401_before_revealing_the_path_or_method",
  "mcp_http_refuses_a_request_with_an_origin",
  "mcp_http_answers_a_notification_with_202",
  "mcp_http_refuses_a_body_that_is_not_one_json_rpc_message",
  "mcp_http_refuses_an_unknown_protocol_version",
  "mcp_http_refuses_a_body_over_the_limit",
  "mcp_http_refuses_to_listen_on_a_non_loopback_address",
  "mcp_http_refuses_a_literal_token",
  "mcp_http_reports_a_port_in_use_as_listen_failed",
  "mcp_http_token_never_appears_in_output_or_logs",
  "mcp_tools_setting_hides_and_refuses_unlisted_tools",
  "mcp_tools_setting_refuses_an_unknown_tool_name",
  "mcp_call_timeout_ends_the_call_and_serves_the_next",
  "mcp_http_serves_an_api_to_a_client_holding_the_token",
  "mcp_http_holds_calls_past_max_concurrent_calls_until_the_deadline",
  "mcp_http_requires_listen_and_token",
  "mcp_http_reports_an_unreadable_token",
  "mcp_config_set_edits_the_mcp_section_and_refuses_a_literal_token",
  "mcp_call_api_query_reaches_the_api_percent_encoded",
  "mcp_obsidian_search_returns_matches_from_allowed_folders_only",
  "mcp_obsidian_read_returns_a_note_and_records_the_audit_entry",
  "mcp_obsidian_read_refuses_a_path_outside_allow_paths",
  "mcp_obsidian_read_refuses_a_path_with_parent_segments",
  "mcp_obsidian_query_never_becomes_a_cli_subcommand",
  "mcp_obsidian_tools_are_absent_without_an_obsidian_section",
  "mcp_obsidian_reports_an_unavailable_cli",
  "mcp_obsidian_cuts_a_long_note_at_max_read_bytes",
  "mcp_obsidian_read_reports_a_note_the_cli_does_not_find",
  "mcp_obsidian_search_and_files_print_text_without_json",
  "mcp_obsidian_read_json_refusal_names_the_allowed_folders",
  "mcp_obsidian_files_reports_an_obsidian_that_is_not_running",
  "mcp_obsidian_without_a_subcommand_under_json_is_an_error_document",
  "mcp_obsidian_files_lists_one_folder",
  "mcp_obsidian_reports_an_obsidian_that_does_not_answer",
]
depends_on = ["config", "secrets", "api-explorer", "cli-entry", "api-client", "agent-policy", "audit", "database", "local-analytics", "agent-guide", "status", "errors"]
notes = "Each tool call is the binary run again (current_exe) with KURAMA_AGENT=1, stdin null or the request, stdout and stderr captured, killed after [mcp] call_timeout (600 seconds by default); over stdio the server reads the next line only after answering, one call at a time; over HTTP at most [mcp] max_concurrent_calls run at once and the wait for a slot counts toward call_timeout. --listen binds the loopback [mcp] listen, reads [mcp] token once (a reference, never a literal), and checks the token before anything else: 401, then Origin 403, path 404, method 405, Content-Type 415, MCP-Protocol-Version 400, body 413/400; JSON responses only, no session, no SSE. [mcp] tools hides and refuses the tools it leaves out, over both transports. Every agent value goes after `--` or glued with `=`, so none becomes an option such as --confirm, and MCP offers no --confirm: a call the policy refuses is made by a person on the command line. query_db refuses execute and query_data refuses export before anything runs. No exec tool, no TLS (Funnel or another front terminates it), no OAuth. `kurama obsidian search|read|files` reads the [obsidian] vault through the official Obsidian CLI (adapters/obsidian_cli.rs, through own_command): every argv is built in domain/functions/obsidian.rs (search:context, read, files only; a caller's value is one key=value element), a path is refused before the CLI runs when absolute, with `..` or a backslash, or outside allow_paths, and every answer is filtered to allow_paths again. The CLI exits 0 and prints its failures on stdout (`Error: ...`, `Vault not found.`). A CLI that reaches no Obsidian (`Unable to connect to main process`) is OBSIDIAN_UNAVAILABLE. The obsidian_* tools are listed only with [obsidian]. The real vault is needs-human: the CLI reaches Obsidian through $HOME/.obsidian-cli.sock, and the real layer runs under a sandbox HOME."

[mcp.real]
cases = "an MCP session over stdio (a GET answered, a POST refused by the [agent] policy, a SQLite read) and one over HTTP with `kurama mcp --listen` reading its token through the reference exported as KURAMA_REAL_MCP_TOKEN_REF while the client sends KURAMA_REAL_MCP_TOKEN (a GET answered, a POST refused, a request without the token refused with 401), both against the public Swagger Petstore v3, and the audit entries"
