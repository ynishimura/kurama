[profile-loading]
summary = "Parse ~/.aws/config into profiles and select one by name"
entry = "src/adapters/profile/manager.rs"
docs = ["docs/development/flows/cli.md"]
files = [
  "src/domain/types/profile.rs",
  "src/adapters/profile/",
]
tests = ["profile"]
scenarios = [
  "assume_role_iam_user_env_exports_its_long_term_keys",
  "status_reports_a_profile_without_role_as_an_iam_user",
]
depends_on = ["assume-role", "config"]

[profile-loading.real]
not_applicable = "reads local AWS configuration files the scenarios write for real"
