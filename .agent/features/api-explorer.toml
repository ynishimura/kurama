[api-explorer]
summary = "`kurama api <API> --ops | --describe <OP> | --schema [OP] | --skill | <OP> -P k=v | --refresh-spec` and the explorer TUI: OpenAPI 3.x / Swagger 2.0 descriptions, Google Discovery Documents or GraphQL introspection results (URL cached with ETag / Last-Modified under ~/.cache/kurama/openapi/, or a JSON / YAML file) normalized into operations with parameters, request skeletons, response shapes and scopes"
entry = "src/shell/cli/commands/api_spec.rs"
files = [
  "src/domain/types/api_spec.rs",
  "src/domain/types/json_shape.rs",
  "src/domain/types/limits.rs",
  "src/domain/functions/jq_completion.rs",
  "src/domain/functions/jq_completion_tests.rs",
  "src/adapters/jq.rs",
  "src/domain/functions/openapi.rs",
  "src/domain/functions/openapi_schema.rs",
  "src/domain/functions/openapi_tests.rs",
  "src/domain/functions/discovery.rs",
  "src/domain/functions/graphql.rs",
  "src/domain/functions/graphql_call.rs",
  "src/domain/functions/operation_command.rs",
  "src/domain/functions/operation_lookup.rs",
  "src/domain/functions/operation_request.rs",
  "src/domain/functions/spec_output.rs",
  "src/domain/functions/api_schema.rs",
  "src/domain/functions/api_skill.rs",
  "src/adapters/openapi/",
  "src/adapters/clipboard.rs",
  "src/adapters/editor.rs",
  "src/adapters/request_history.rs",
  "src/domain/types/request_history.rs",
  "src/shell/spec_loader.rs",
  "src/shell/cli/commands/api.rs",
  "src/shell/cli/commands/api_command.rs",
  "src/shell/cli/commands/api_spec.rs",
  "src/shell/tui/explorer/",
  "tests/fixtures/openapi/",
  "tests/fakes/pbcopy",
  "tests/fakes/xclip",
  "tests/fakes/editor",
]
tests = ["api_spec", "openapi", "editor", "explorer"]
scenarios = [
  "tui_explorer_header_shows_the_token_time_left",
  "api_discovery_lists_operations_from_a_discovery_document",
  "api_discovery_describe_carries_scopes_and_the_response_schema",
  "api_discovery_operation_target_expands_reserved_path_parameters",
  "api_discovery_with_openapi_exits_2",
  "api_discovery_from_a_cached_document_calls_nothing",
  "api_graphql_lists_root_fields_as_operations",
  "api_graphql_describe_shows_arguments_and_the_return_type",
  "api_graphql_introspection_is_cached_and_completion_calls_nothing",
  "api_graphql_introspection_refused_exits_with_hint",
  "api_graphql_schema_file_is_read_without_a_request",
  "api_minimal_openapi_lists_and_calls_operations",
  "api_minimal_openapi_describe_without_responses",
  "api_schema_prints_one_json_document_from_a_local_description",
  "api_schema_for_one_operation_carries_its_parameters_and_bodies",
  "api_schema_from_a_cached_description_calls_nothing",
  "api_schema_reports_an_unsupported_construct_as_a_limitation",
  "api_schema_ref_chain_depth_is_bounded",
  "api_schema_without_openapi_exits_2_with_hint",
  "api_schema_real_public_description_is_a_usable_contract",
  "api_skill_generates_a_skill_from_a_local_description",
  "api_skill_reuses_the_schema_and_calls_nothing",
  "api_skill_keeps_control_characters_out_of_the_frontmatter",
  "api_skill_without_openapi_exits_2_with_hint",
  "api_skill_from_a_cached_url_calls_nothing",
  "api_skill_reports_an_unavailable_or_invalid_description",
  "completion_zsh_jq_keeps_an_unfinished_expression_open",
  "tui_explorer_jq_preview_limits_outputs_before_evaluation",
  "completion_jq_uses_response_schemas_without_io",
  "completion_jq_matches_a_bare_path_target",
  "completion_jq_without_a_target_is_silent",
  "completion_jq_matches_a_path_and_explicit_method_post",
  "completion_jq_declines_missing_or_unknown_schemas",
  "completion_jq_uses_the_json_response_envelope",
  "completion_zsh_jq_continues_paths_and_preserves_quoted_pipelines",
  "api_spec_expired_cache_revalidates_and_304_starts_the_next_interval",
  "api_spec_future_timestamp_is_revalidated",
  "api_spec_corrupt_metadata_is_fetched_again",
  "api_spec_a_recent_cached_copy_works_offline_without_a_warning",
  "api_spec_offline_uses_the_cached_copy_with_a_warning",
  "tui_explorer_lists_operations_search_and_detail",
  "tui_explorer_history_refills_the_form",
  "tui_explorer_history_keeps_no_secret",
  "tui_explorer_tree_copies_the_path_of_a_node",
  "tui_explorer_help_q_matches_its_quit_hint",
  "tui_explorer_shows_the_response_shape",
  "tui_explorer_no_color_preserves_selection_and_form_emphasis",
  "tui_explorer_dumb_terminal_exits_2_without_control_sequences",
  "tui_explorer_form_sends_the_request_and_filters_the_result_with_jq",
  "tui_explorer_jq_completes_from_the_response_and_previews",
  "tui_explorer_applying_jq_keeps_events_responsive",
  "tui_explorer_jq_disables_live_preview_for_an_oversized_response",
  "tui_explorer_edits_the_body_in_the_editor_and_copies_the_command",
  "tui_explorer_resize_keeps_the_selection_and_switches_panes",
  "tui_explorer_shows_a_failed_description_as_a_modal",
  "tui_explorer_shows_a_failed_call_as_a_modal",
  "tui_explorer_shows_a_rejected_call_with_its_status",
  "tui_explorer_prints_the_description_warnings_after_exit",
]
depends_on = ["api-client", "oauth", "config", "errors", "cli-entry", "tui", "assume-role", "shell-integration"]
notes = "URL loads reuse the cache for [openapi] revalidate_after seconds; 304 restarts the interval, zero always revalidates, --refresh-spec fetches unconditionally, -v names the source and timestamp. adapters/openapi/loader.rs owns offline file reads, home/cache paths and parse/normalization without HTTP or credentials; shell/spec_loader.rs orchestrates fetching and wraps errors. The description comes from tests/fixtures/openapi/ (OpenAPI 3.0 JSON, 3.1 YAML, Swagger 2.0) as a file or from the fake server's /spec/ endpoint, which answers 304 to the cached ETag and 503 when the scenario says the server is down; no real description (GitHub's) has been fetched by a scenario. Explorer: src/shell/tui/explorer/view_snapshot_tests.rs renders every fixture (src/shell/tui/explorer/testing.rs) at the four sizes against tests/tui_snapshots/explorer_*; the tui_explorer_* scenarios drive the real binary on a pseudo terminal with the fake clipboard (tests/fakes/pbcopy) and editor (tests/fakes/editor). The browser link (o) is unit-tested only"

[api-explorer.real]
cases = "the public Swagger Petstore v3 OpenAPI description, fetched and cached, read through --schema"
