# Version updates, once a week, one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # release.yml is generated by `dist generate`, and the release job fails
    # when it no longer matches what dist would write: the actions it uses
    # move with a cargo-dist upgrade, not here.
    ignore:
      - dependency-name: actions/attest
      - dependency-name: actions/checkout
      - dependency-name: actions/download-artifact
      - dependency-name: actions/upload-artifact
