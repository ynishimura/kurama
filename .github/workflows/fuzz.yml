# The cargo-fuzz targets under fuzz/, each for a few minutes, once a week and
# on demand (docs/development/fuzzing.md). A crash uploads the input that
# caused it; `cargo +nightly fuzz run <target> <file>` replays it locally.
name: Fuzz

on:
  schedule:
    - cron: '41 4 * * 3'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        type: number
        default: 300

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fuzz:
    name: cargo fuzz
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
      with:
        toolchain: nightly

    - name: Cache cargo dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/registry/src/
          ~/.cargo/bin/cargo-fuzz
          target/
        key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
        restore-keys: fuzz-${{ runner.os }}-

    - name: Install cargo-fuzz
      # The version mise.toml pins.
      run: command -v cargo-fuzz || cargo install --locked cargo-fuzz --version 0.13.2

    - name: Build the targets
      run: cargo +nightly fuzz build -O

    - name: Run each target
      env:
        SECONDS_PER_TARGET: ${{ inputs.seconds || 300 }}
      run: |
        for target in $(cargo +nightly fuzz list); do
          echo "::group::$target"
          cargo +nightly fuzz run -O "$target" -- -max_total_time="$SECONDS_PER_TARGET"
          echo "::endgroup::"
        done

    - name: Upload crashing inputs
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts/
