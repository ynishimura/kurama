# RustSec advisories against Cargo.lock. Dependabot raises no alert for most
# of them and updates direct dependencies only, so a vulnerable transitive
# crate (rustls, webpki-roots) stays until this fails. The weekly run catches
# an advisory published while nothing changes. Unmaintained crates are
# reported as warnings and do not fail the job.
name: Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
      with:
        toolchain: stable

    - name: Install cargo-audit
      run: cargo install --locked cargo-audit --version 0.22.2

    # fuzz/ is a crate outside the workspace with a lockfile of its own, which
    # a dependency update at the root does not touch; Scorecard scans it too.
    - name: Audit Cargo.lock
      run: |
        cargo audit
        cargo audit --file fuzz/Cargo.lock
