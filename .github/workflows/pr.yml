# The light checks every pull request and every push to main runs: formatting,
# clippy and the unit tests, on Ubuntu. The main ruleset requires both jobs, so
# a pull request shows them before anyone reads it. The full gate (scenarios,
# TUI, architecture rules, other platforms) stays in ci.yml, dispatched by a
# maintainer, and in the local pre-push hook. Like ci.yml it uses no secrets
# and a read-only token; a pull request from a fork gets no more than that.
name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
      with:
        toolchain: stable
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

  lint-and-test:
    name: clippy and unit tests
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
      with:
        toolchain: stable
        components: clippy

    # Its own key: ci.yml's cache holds the whole gate's target/, this one
    # only what clippy and the unit tests build.
    - name: Cache cargo dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          # The unpacked sources too: libduckdb-sys reruns its build (the
          # whole C++ engine) when duckdb.tar.gz there has a new mtime, which
          # every fresh unpack gives it.
          ~/.cargo/registry/src/
          ~/.cargo/git/db/
          target/
        key: pr-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        # A Cargo.lock change keeps the build of everything it did not touch
        # (DuckDB above all) instead of starting from nothing.
        restore-keys: pr-${{ runner.os }}-cargo-

    - name: Clippy
      run: cargo clippy --locked --workspace --all-targets --features test-fakes -- -D warnings

    - name: Unit tests
      run: |
        cargo test --locked --features test-fakes --lib
        cargo test --locked -p xtask --bin xtask
