# `cargo about generate about.hbs -o THIRD-PARTY-NOTICES` lists the license of
# every crate a release binary carries; the release build runs it
# (release-build-setup.yml). docs/development/licenses.md is the inventory.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MIT-0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "WTFPL",
  "Unlicense",
  "OpenSSL",
]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
