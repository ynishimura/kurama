# Release configuration for `dist` (cargo-dist): `dist generate` writes
# .github/workflows/release.yml from this file, and pushing a `v*` tag runs it.
# docs/development/releasing.md says what a release is made of and how to cut one.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
# The prebuilt archives, a shell installer, and a Homebrew formula in the tap.
installers = ["shell", "homebrew"]
tap = "ynishimura/homebrew-tap"
publish-jobs = ["homebrew"]
# The four targets `build.rs` has a DuckDB httpfs extension for; any other
# target stops the build with a message naming it.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
# Only a pushed `v*` tag starts the release workflow: a pull request does not
# (pull requests run .github/workflows/pr.yml, not a release build).
pr-run-mode = "skip"
install-path = "CARGO_HOME"
install-updater = false
# The license texts of every crate and native component a binary carries,
# generated by the build setup steps before the archives are made.
include = ["THIRD-PARTY-NOTICES"]
github-build-setup = "../release-build-setup.yml"
# Each archive gets a build provenance attestation, so a download can be
# checked with `gh attestation verify <file> --repo ynishimura/kurama`.
github-attestations = true
# The actions release.yml uses, pinned to the commits of the tags dist 0.33.0
# names (checkout v6.1.0, download-artifact v8.0.1, upload-artifact v7.0.1,
# attest v4.2.2): a tag can be moved, a commit cannot. Re-resolve them with a
# cargo-dist upgrade, which is when the tags change.
github-action-commits = { "actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803", "actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", "actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a", "actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" }
