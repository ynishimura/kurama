# Release configuration for `dist` (cargo-dist): `dist generate` writes
# .github/workflows/release.yml from this file, and pushing a `v*` tag runs it.
# docs/development/releasing.md says what a release is made of and how to cut one.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
# The prebuilt archives, a shell installer, and a Homebrew formula in the tap.
installers = ["shell", "homebrew"]
tap = "ynishimura/homebrew-tap"
publish-jobs = ["homebrew"]
# The four targets `build.rs` has a DuckDB httpfs extension for; any other
# target stops the build with a message naming it.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
# Only a pushed `v*` tag starts the release workflow: a pull request does not
# (CI is manual dispatch only; see .github/workflows/ci.yml).
pr-run-mode = "skip"
install-path = "CARGO_HOME"
install-updater = false
# The license texts of every crate and native component a binary carries,
# generated by the build setup steps before the archives are made.
include = ["THIRD-PARTY-NOTICES"]
github-build-setup = "../release-build-setup.yml"
