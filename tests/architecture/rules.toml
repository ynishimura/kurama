# The architecture rules, one table per rule: what `cargo xtask
# architecture-audit` reports on and holds to the tests and the list in
# `tests/architecture/main.rs`.
#
# id                  ARCH-NNN, never reused: a removed rule leaves its number
#                     unused rather than handing it to a different rule.
# summary             one line: what the rule keeps.
# method              "syntax" when its checks read the Rust syntax
#                     (tests/architecture/syntax.rs), "text" (the default)
#                     when they scan text.
# limits              for a syntax rule: what the reading cannot see.
# checks              the tests that detect a violation, `<file>::<test>`.
# docs                documents that publish the rule to a person.
# exemptions          the lists in the test source that allow what the rule
#                     would otherwise refuse, `<file>::<CONST>`.
# violating_fixtures  tests that feed the detector a violation and expect it
#                     to be refused, `<file>::<test>`.
# passing_fixtures    tests that feed the detector allowed code and expect it
#                     to pass, `<file>::<test>`.
#
# Every `#[test]` under `tests/architecture/` is named by exactly one rule,
# as a check or as a fixture.

[[rule]]
id = "ARCH-001"
summary = "src/domain and src/workflows are pure: no I/O, no clock, no logging, no dependency on adapters or the shell"
method = "syntax"
limits = "names are not resolved: super:: and self:: stay relative, a glob import is the path it names, a macro body is read as tokens, and a path built by a macro from pieces is not seen"
checks = ["tests/architecture/layers.rs::domain_and_workflows_do_no_io_and_read_no_clock"]
violating_fixtures = ["tests/architecture/layers.rs::a_forbidden_import_nested_aliased_or_split_is_found"]
passing_fixtures = ["tests/architecture/layers.rs::a_forbidden_path_in_a_comment_a_string_or_test_code_is_not_found"]
docs = ["AGENTS.md", "docs/development/fp-architecture.md"]
exemptions = []

