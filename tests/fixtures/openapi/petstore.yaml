openapi: 3.1.0
info:
  title: Petstore YAML
  version: "2.0"
paths:
  /pets:
    get:
      operationId: pets/list
      summary: List pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          schema:
            type: [integer, "null"]
            default: 20
      responses:
        200:
          description: ok
    post:
      operationId: pets/create
      summary: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  examples: [rex]
      responses:
        201:
          description: created
  /pets/{petId}:
    get:
      operationId: pets/get
      summary: Get a pet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: ok
