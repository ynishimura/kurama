# A preview asked for an ETag the object no longer has fails as a change,
# exit 4, before a byte is read; it never shows the new bytes under the old
# name.
id = "s3_if_match_detects_an_object_that_changed"
feature = "s3-explorer"

[combination]
command = "s3"
source = "aws-profile"
role = "assume-role"
s3_op = "preview"
s3_response = "changed"

[input]
args = ["s3", "assets", "s3://browse-objects/data/report.json", "--preview", "--if-match", "\"0000000000000000\"", "--json"]
then_run = [["s3", "assets", "s3://browse-objects/data/report.json", "--preview", "--if-match", "0000000000000000"]]
config = """
[s3.assets]
aws_profile = "dev"
"""

[expect]
error = { code = "S3_REJECTED", exit = 4 }
hint = "run --head for the current ETag, or drop --if-match to read the object as it is now"
stdout_lines = 0
op_calls = 0
no_files_written = true
api_calls = { count = 1, sigv4 = { service = "s3", region = "ap-northeast-1" }, calls = [{ method = "HEAD", path = "/browse-objects/data/report.json" }] }

[[expect.runs]]
run = 0
exit_code = 4
sts_actions = ["AssumeRole"]
stderr_json = { "/error/code" = "S3_REJECTED", "/error/message" = { contains = "changed" } }
