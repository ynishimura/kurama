# The hand-off file `KURAMA_ENV_SCRIPT` names already exists and anyone can
# read it. `env` writes the token there anyway, so the file has to be private
# by then: the harness checks the mode after the run, as it does for every
# scenario with a hand-off file.
id = "export_handoff_file_permissions_are_private_before_secrets_are_written"
feature = "export-output"

[combination]
command = "env"
source = "oauth"
handoff = "existing-world-readable"

[input]
args = ["env", "github"]
stored_tokens = [{ source = "github", access_token = "{stored_access_token}", expires_in = 3600 }]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"
"""

[fakes]
existing_env_script_mode = 0o644

[expect]
exit_code = 0
sts_actions = []
stdout = { equals = "" }
env_script_exports = ["GITHUB_TOKEN", "KURAMA_AUTH"]
