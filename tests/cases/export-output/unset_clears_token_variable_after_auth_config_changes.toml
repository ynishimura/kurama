# The shell holds a token an earlier `env` exported into OLD_GITHUB_TOKEN,
# and the configuration has since changed: no source names that variable any
# more. `env` records the variable it exports into (`KURAMA_AUTH_VAR`), and
# both `env` and `unset` clear the one the shell recorded, so the old token
# does not stay behind for every later child process.
id = "unset_clears_token_variable_after_auth_config_changes"
feature = "export-output"

[combination]
command = "unset"
source = "oauth"
auth_config = "changed-since-env"

[input]
args = ["env", "github"]
then_run = [["unset"]]
env = { KURAMA_AUTH = "old-github", KURAMA_AUTH_VAR = "OLD_GITHUB_TOKEN" }
stored_tokens = [{ source = "github", access_token = "{stored_access_token}", expires_in = 3600 }]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"
"""

[expect]
exit_code = 0
sts_actions = []

[[expect.runs]]
run = 0
exit_code = 0
stdout = { lines_start_with = ["export ", "unset "], contains = ["unset OLD_GITHUB_TOKEN", "unset GITHUB_TOKEN", "export GITHUB_TOKEN='{stored_access_token}'", "export KURAMA_AUTH='github'", "export KURAMA_AUTH_VAR='GITHUB_TOKEN'"] }

[[expect.runs]]
run = 1
exit_code = 0
stdout = { lines_start_with = ["unset "], contains = ["unset OLD_GITHUB_TOKEN", "unset GITHUB_TOKEN", "unset KURAMA_AUTH", "unset KURAMA_AUTH_VAR"] }
