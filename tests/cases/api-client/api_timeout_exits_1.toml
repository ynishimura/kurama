# A request that outlives --timeout is API_REQUEST_FAILED, exit 1, with the
# cause printed once in the error line.
id = "api_timeout_exits_1"
feature = "api-client"

[combination]
command = "api"
source = "oauth"
grant = "authorization_code"
token = "stored"
api_response = "slow"

[input]
stored_tokens = [{ source = "github", access_token = "stored-access-token", expires_in = 3600 }]
args = ["api", "github", "/slow", "--timeout", "1"]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"
"""

[fakes]
api = "slow"

[expect]
error = { code = "API_REQUEST_FAILED", exit = 1 }
stderr_contains = ["error[API_REQUEST_FAILED]: request failed: request timed out after 1s\n"]
