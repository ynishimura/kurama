# A stored token is sent as the bearer and the response body is printed as
# the server sent it: one JSON document, with no newline added.
id = "api_sends_the_bearer_token_and_prints_the_body"
feature = "api-client"

[combination]
command = "api"
source = "oauth"
grant = "authorization_code"
token = "stored"
output = "body"

[input]
stored_tokens = [{ source = "github", access_token = "stored-access-token", expires_in = 3600 }]
args = ["api", "github", "/user"]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"
"""

[expect]
exit_code = 0
token_grants = []
api_calls = { count = 1, authorization = "Bearer stored-access-token" }
stdout = { equals = "{\"path\":\"/api/user\",\"method\":\"GET\",\"authorization\":\"Bearer stored-access-token\",\"body\":\"\",\"login\":\"octocat\"}" }
