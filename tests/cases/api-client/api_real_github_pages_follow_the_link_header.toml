# --pages against a listing that pages with Link rel="next": GitHub's
# contributors of a busy repository, one per page, so page 2 exists and a
# third remains at the limit. Each page is its envelope on one line, and
# the stop report on stderr says limit with the URL of page 3.
id = "api_real_github_pages_follow_the_link_header"
feature = "api-client"

[combination]
command = "api"
source = "none"
pages = "link"
api_response = "ok"

[input]
args = ["api", "github-public", "/repos/rust-lang/rust/contributors?per_page=1", "--pages", "2", "--json", "--jq", ".status"]
config = """
[api.github-public]
base_url = "{server}/api"
headers = { "X-GitHub-Api-Version" = "2022-11-28" }
"""

[fakes]
api = "pages"

[expect]
exit_code = 0
stdout = { equals = "200\n200\n" }
stderr_json = { "/pages/fetched" = 2, "/pages/stopped" = "limit", "/pages/next" = { contains = "page=3" } }
api_calls = { count = 2 }
no_files_written = true

[real]
requires = []
config = """
[api.github-public]
base_url = "https://api.github.com"
headers = { "X-GitHub-Api-Version" = "2022-11-28" }
"""

[real.combination]
target = "github"

[real.expect]
exit_code = 0
stdout = { equals = "200\n200\n" }
stderr_json = { "/pages/fetched" = 2, "/pages/stopped" = "limit", "/pages/next" = { contains = "https://api.github.com/" } }
