# One AssumeRole with the source key, then requests signed with the role key
# for the configured service in the profile's region; the POST body and the
# extra header are covered by the signature.
id = "api_sigv4_signs_with_the_aws_profile_credentials"
feature = "api-client"

[combination]
command = "api"
auth = "aws-profile"
role = "assume-role"
service = "configured"
region = "profile"
api_response = "ok"

[input]
args = ["api", "apigw", "/items?page=2", "--jq", ".path"]
then_run = [["api", "apigw", "POST /items", "-d", "{\"name\":\"x\"}", "-H", "X-Trace: 1", "-v", "--jq", ".body"]]
config = """
[api.apigw]
base_url = "{server}/api"
aws_profile = "dev"
service = "execute-api"
[auth.apigw]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "unused"
client_secret = "op://Agent/Service/client_secret"
"""

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
oauth_paths = []
op_calls = 0
stderr_contains = [
  "# Signing with AWS profile 'dev' for execute-api in ap-northeast-1",
  "Credential=<access-key-id>/",
  "Signature=****",
]
stdout = "plain-text"
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 0
sts_calls = [{ action = "AssumeRole", signing_access_key = "AKIASOURCEKEY000001" }]
oauth_paths = []
op_calls = 0
api_calls = { count = 1, sigv4 = { service = "execute-api", region = "ap-northeast-1" }, calls = [{ path = "/api/items?page=2", signing_access_key = "ASIARESULTKEY000001" }] }
stdout = { equals = "/api/items\n" }

[[expect.runs]]
run = 1
stdout = { equals = "{\"name\":\"x\"}\n" }
api_calls = { count = 1, sigv4 = { service = "execute-api", region = "ap-northeast-1" }, calls = [{ method = "POST", body = "{\"name\":\"x\"}", headers = { "x-trace" = "1" }, signed_headers_include = ["x-trace", "content-type"] }] }
