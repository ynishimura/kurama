# A `kind = "token"` source with `username` sends HTTP Basic: the username
# and the credential as the password, base64 in Authorization (Jira's email
# and API token, Zendesk's `<email>/token`). The fake answers the parameter
# name it was asked for, so the header says which reference the password
# came from. -v masks the header; the dry run says the mode and reads nothing.
id = "api_token_basic_sends_the_username_and_the_credential"
feature = "api-client"

[combination]
command = "api"
source = "token"
secret = "aws-ssm"
placement = "basic"

[input]
args = ["api", "example", "/users/me", "-v"]
then_run = [["api", "example", "/users/me", "--dry-run", "--json"]]
config = """
[auth.example]
kind = "token"
token = "aws-ssm://dev/kurama/api-key"
username = "me@example.com/token"

[api.example]
base_url = "{server}/api"
"""

[fakes]
aws_secrets = "from-id"

[expect]
exit_code = 0
token_grants = []
secret_reads = [{ operation = "ssm:GetParameter", id = "/kurama/api-key", region = "ap-northeast-1" }]

[[expect.runs]]
run = 0
stderr_contains = ["> Authorization: Basic ****"]
stderr_excludes = ["parameter-of/kurama/api-key", "bWVAZXhhbXBsZS5jb20vdG9rZW46cGFyYW1ldGVyLW9mL2t1cmFtYS9hcGkta2V5"]
api_calls = { count = 1, authorization = "Basic bWVAZXhhbXBsZS5jb20vdG9rZW46cGFyYW1ldGVyLW9mL2t1cmFtYS9hcGkta2V5" }

[[expect.runs]]
run = 1
stdout_json = { "/auth/mode" = "basic", "/auth/kind" = "token", "/auth/header" = "Authorization" }
api_calls = { count = 0 }
