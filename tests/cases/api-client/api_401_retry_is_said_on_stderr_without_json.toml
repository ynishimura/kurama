# Without --json the 401 retry is said on stderr as a progress line.
id = "api_401_retry_is_said_on_stderr_without_json"
feature = "api-client"

[combination]
command = "api"
source = "oauth"
grant = "client_credentials"
token = "stale"
api_response = "unauthorized-once"

[input]
stored_tokens = [{ source = "svc", access_token = "stale-token", expires_in = 3600 }]
args = ["api", "svc", "/items"]
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["read"]

[api.svc]
description = "Service API"
base_url = "{server}/api"
"""

[fakes]
op = "enabled"
api = "unauthorized-once"

[expect]
exit_code = 0
token_grants = ["client_credentials"]
stderr_contains = ["# The API rejected the token (HTTP 401)"]
api_calls = { count = 2, calls = [{ authorization = "Bearer stale-token" }, { authorization = "Bearer fake-granted-access-token" }] }
stdout = { contains = ["octocat"] }
