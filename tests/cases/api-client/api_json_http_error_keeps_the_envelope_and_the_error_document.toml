# An HTTP status outside 2xx with --json: the envelope still goes to stdout,
# and stderr is one JSON error document, category remote, exit 4.
id = "api_json_http_error_keeps_the_envelope_and_the_error_document"
feature = "api-client"

[combination]
command = "api"
output = "json"
source = "oauth"
grant = "authorization_code"
token = "stored"
api_response = "not-found"

[input]
stored_tokens = [{ source = "github", access_token = "stored-access-token", expires_in = 3600 }]
args = ["api", "github", "/missing", "--json"]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"
"""

[fakes]
api = "not-found"

[expect]
exit_code = 4
stdout_json = { "/status" = 404, "/body/message" = "Not Found" }
stderr_lines = 1
stderr_json = { "/error/code" = "API_HTTP_ERROR", "/error/exit_code" = 4, "/error/category" = "remote", "/error/retry" = "never", "/error/message" = { contains = "HTTP 404 Not Found" }, "/error/next_actions/0/message" = { contains = "stdout envelope" } }
api_calls = { count = 1, authorization = "Bearer stored-access-token" }
