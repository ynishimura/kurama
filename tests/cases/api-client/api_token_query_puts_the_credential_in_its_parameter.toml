# A `kind = "token"` source with `query` sends the credential in that query
# parameter (Backlog's `apiKey`) and in no header, beside the parameters the
# target already has. The URL then carries the credential, so neither -v nor
# the dry run nor a failed connection may print it: -v and the dry run show
# `<token>`, and a connection error names the URL without its query.
id = "api_token_query_puts_the_credential_in_its_parameter"
feature = "api-client"

[combination]
command = "api"
source = "token"
secret = "aws-ssm"
placement = "query"

[input]
args = ["api", "example", "/users/myself?count=1", "-v"]
then_run = [
  ["api", "example", "/users/myself?count=1", "--dry-run", "--json"],
  ["api", "closed", "/users/myself"],
]
config = """
[auth.example]
kind = "token"
token = "aws-ssm://dev/kurama/api-key"
query = "apiKey"

[api.example]
base_url = "{server}/api"

[api.closed]
base_url = "http://127.0.0.1:1/api"
auth = "example"
"""

[fakes]
aws_secrets = "from-id"

[expect]
token_grants = []
secret_reads = [
  { operation = "ssm:GetParameter", id = "/kurama/api-key", region = "ap-northeast-1" },
  { operation = "ssm:GetParameter", id = "/kurama/api-key", region = "ap-northeast-1" },
]

[[expect.runs]]
run = 0
exit_code = 0
stderr_contains = ["/api/users/myself?count=1&apiKey=%3Ctoken%3E\n"]
stderr_excludes = ["parameter-of"]
api_calls = { count = 1, calls = [{ path = "/api/users/myself?count=1&apiKey=parameter-of%2Fkurama%2Fapi-key", no_authorization = true }] }

[[expect.runs]]
run = 1
exit_code = 0
stdout_json = { "/auth/mode" = "query", "/auth/kind" = "token", "/auth/query" = "apiKey" }
stdout = { contains = ["/api/users/myself?count=1&apiKey=%3Ctoken%3E\""] }
api_calls = { count = 0 }

[[expect.runs]]
run = 2
exit_code = 1
stderr_contains = ["http://127.0.0.1:1/api/users/myself"]
stderr_excludes = ["parameter-of", "apiKey="]
api_calls = { count = 0 }
