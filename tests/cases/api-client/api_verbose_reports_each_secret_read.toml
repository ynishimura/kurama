# -v says each time kurama went to a secret store, one line per read, with
# the store, the id and the region, or the 1Password item -- never the
# value. Two pages of a `kind = "token"` source resolve the reference twice
# and read it once: the second answer comes from the process, and says
# nothing. A dry run reads nothing, so it says nothing.
id = "api_verbose_reports_each_secret_read"
feature = "api-client"

[combination]
command = "api"
source = "token"
secret = "aws-ssm"
output = "verbose"

[input]
args = ["api", "example", "/items?pages=2", "--pages", "5", "-v"]
then_run = [
  ["api", "vault", "/items", "-v"],
  ["api", "example", "/items", "--dry-run", "-v"],
]
config = """
[auth.example]
kind = "token"
token = "aws-ssm://dev/kurama/api-key"
header = "xi-api-key"
format = "{token}"

[api.example]
base_url = "{server}/api"

[auth.vault]
kind = "token"
token = "op://Agent/Example/credential"
header = "xi-api-key"
format = "{token}"

[api.vault]
base_url = "{server}/api"
"""

[fakes]
op = "enabled"
aws_secrets = "from-id"
api = "pages"

[expect]
exit_code = 0
no_files_written = true
# Across the three runs: one Parameter Store read, in the first.
secret_reads = [{ operation = "ssm:GetParameter", id = "/kurama/api-key", region = "ap-northeast-1" }]

[[expect.runs]]
run = 0
api_calls = { count = 2 }
stderr_lines_containing = { "< secret read:" = 1, "< secret read: ssm:GetParameter /kurama/api-key (ap-northeast-1)" = 1 }
stderr_excludes = ["parameter-of/kurama/api-key"]

[[expect.runs]]
run = 1
op_reads = ["item get Example --format json --vault Agent"]
api_calls = { count = 1 }
stderr_lines_containing = { "< secret read:" = 1, "< secret read: op item get Example --vault Agent" = 1 }
stderr_excludes = ["{fake_client_secret}"]

[[expect.runs]]
run = 2
api_calls = { count = 0 }
stderr_lines_containing = { "< secret read:" = 0 }
