# Every page request goes through the path a single request takes: each
# carries the stored bearer token of the OAuth source, and each is signed
# with the role credentials of the aws_profile (one AssumeRole for all of
# them), with a signature over its own URL.
id = "api_pages_authenticate_each_request_with_bearer_and_sigv4"
feature = "api-client"

[combination]
command = "api"
pages = "link"
auth = "bearer-and-sigv4"

[input]
stored_tokens = [{ source = "github", access_token = "stored-access-token", expires_in = 3600 }]
args = ["api", "github", "/items", "--pages", "3", "--jq", ".page"]
then_run = [["api", "apigw", "/items?pages=2", "--pages", "3", "--jq", ".page"]]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"

[api.apigw]
base_url = "{server}/api"
aws_profile = "dev"
service = "execute-api"
"""

[fakes]
api = "pages"

[expect]
exit_code = 0

[[expect.runs]]
run = 0
stdout = { equals = "1\n2\n3\n" }
token_grants = []
api_calls = { count = 3, authorization = "Bearer stored-access-token", calls = [{ path = "/api/items" }, { path = "/api/items?page=2" }, { path = "/api/items?page=3" }] }

[[expect.runs]]
run = 1
stdout = { equals = "1\n2\n" }
sts_actions = ["AssumeRole"]
api_calls = { count = 2, sigv4 = { service = "execute-api", region = "ap-northeast-1" }, calls = [{ path = "/api/items?pages=2", signing_access_key = "ASIARESULTKEY000001" }, { path = "/api/items?pages=2&page=2", signing_access_key = "ASIARESULTKEY000001" }] }
