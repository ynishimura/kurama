# A body that cannot be written is API_OUTPUT_FAILED, exit 1, after the
# request: the line names the path and the cause, never the token or the
# Authorization header, and no file is left behind.
id = "api_output_to_an_unwritable_path_exits_1_without_a_secret"
feature = "api-client"

[combination]
command = "api"
source = "oauth"
grant = "authorization_code"
token = "stored"
output = "file"

[input]
stored_tokens = [{ source = "github", access_token = "stored-access-token", expires_in = 3600 }]
args = ["api", "github", "/user", "--output", "{home}/missing/body.json"]
then_run = [["api", "github", "/user", "-v", "--output", "{home}/missing/body.json"]]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"
"""

[expect]
error = { code = "API_OUTPUT_FAILED", exit = 1 }
hint = "name a file in a directory that exists and is writable, not a directory or a read-only file; nothing at the path was changed"
stdout = "empty"
stderr_contains = ["error[API_OUTPUT_FAILED]: cannot write the response body to ", "/missing/body.json: entity not found\n", "> Authorization: Bearer ****"]
stderr_excludes = ["stored-access-token"]
api_calls = { count = 1, authorization = "Bearer stored-access-token" }
token_grants = []
# The OAuth source's lock is the only file, and nothing lands beside the path.
files_written = ["home/.cache/kurama/locks/github.lock"]

[[expect.runs]]
run = 0
error = { code = "API_OUTPUT_FAILED", exit = 1 }
stderr_lines = 2
stderr_excludes = ["stored-access-token", "Authorization"]
