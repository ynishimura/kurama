# An HTTP error is exit 4 with an excerpt of the body; with --json the
# envelope is printed before the exit, without it stdout stays empty.
id = "api_http_error_exits_4_with_an_excerpt_and_the_json_envelope"
feature = "api-client"

[combination]
command = "api"
source = "oauth"
grant = "authorization_code"
token = "stored"
api_response = "not-found"

[input]
stored_tokens = [{ source = "github", access_token = "stored-access-token", expires_in = 3600 }]
args = ["api", "github", "/missing", "--json"]
then_run = [["api", "github", "/missing"]]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"
"""

[fakes]
api = "not-found"

[expect]
error = { code = "API_HTTP_ERROR", exit = 4 }
stderr_contains = ["HTTP 404 Not Found: {\"message\":\"Not Found\"}"]

[[expect.runs]]
run = 0
exit_code = 4
stderr_json = { "/error/code" = "API_HTTP_ERROR" }
stdout_json = { "/status" = 404, "/body/message" = "Not Found" }
