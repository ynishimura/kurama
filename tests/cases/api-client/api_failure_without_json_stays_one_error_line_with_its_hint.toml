# Without --json the same failure is still one error[CODE] line and a hint.
id = "api_failure_without_json_stays_one_error_line_with_its_hint"
feature = "api-client"

[combination]
command = "api"
output = "text"

[input]
args = ["api", "nope", "/user"]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"
"""

[expect]
error = { code = "API_NOT_FOUND", exit = 2 }
hint = "run `kurama status`"
stderr_lines_start_with = ["error[", "hint:"]
stderr_lines = 2
api_calls = { count = 0 }
