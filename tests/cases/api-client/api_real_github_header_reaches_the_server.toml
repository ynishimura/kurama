# A configured header reaches the server: the fake echoes it, and GitHub
# answers 400 to an `X-GitHub-Api-Version` it does not know, which is the one
# observable proof that the header was sent and not just logged. No
# credential is involved: the endpoint is public.
id = "api_real_github_header_reaches_the_server"
feature = "api-client"

[combination]
command = "api"
source = "none"
header = "configured"

[input]
args = ["api", "github-public", "/meta"]
config = """
[api.github-public]
base_url = "{server}/api"
headers = { "X-GitHub-Api-Version" = "1999-01-01" }
"""

[fakes]
api = "ok"

[expect]
exit_code = 0
sts_actions = []
token_grants = []
op_calls = 0
api_calls = { count = 1, headers = { "x-github-api-version" = "1999-01-01" } }
no_files_written = true

[real]
requires = []
config = """
[api.github-public]
base_url = "https://api.github.com"
headers = { "X-GitHub-Api-Version" = "1999-01-01" }
"""

[real.combination]
target = "github"

[real.expect]
error = { code = "API_HTTP_ERROR", exit = 4 }
stderr_contains = ["HTTP 400"]
