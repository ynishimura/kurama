# The plan masks every header that carries a credential: the bearer token,
# the header a kind = "token" source names, the SigV4 signature and session
# token, and the secret headers a caller passes with -H (the known names,
# Private-Token among them). The body is its
# size, never its bytes, and no secret reference or placeholder value
# reaches stdout or stderr.
id = "api_dry_run_json_masks_every_secret_header"
feature = "api-client"

[combination]
command = "api"
mode = "dry-run"
output = "json"
header = "secret"

[input]
args = ["api", "github", "/items", "-d", "{\"password\":\"hunter2\"}", "-H", "Cookie: session=cookie-secret", "-H", "X-Api-Key: key-secret", "-H", "Proxy-Authorization: Basic proxy-secret", "-H", "Authorization: Bearer caller-secret", "-H", "Private-Token: private-secret", "--dry-run", "--json"]
then_run = [
  ["api", "example", "/voices", "--dry-run", "--json"],
  ["api", "apigw", "/items", "--dry-run", "--json"],
]
config = """
[auth.github]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "gh-client"
client_secret = "op://Agent/GitHub/client_secret"
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"

[auth.example]
kind = "token"
token = "op://Agent/Example/credential"
header = "xi-api-key"
format = "{token}"

[api.example]
base_url = "{server}/api"

[api.apigw]
base_url = "{server}/api"
aws_profile = "dev"
service = "execute-api"
region = "ap-northeast-1"
"""

[expect]
exit_code = 0
api_calls = { count = 0 }
token_grants = []
sts_actions = []
op_calls = 0
stdout_excludes = ["<token>", "<session-token>", "<secret-access-key>", "op://", "hunter2", "cookie-secret", "key-secret", "proxy-secret", "caller-secret", "private-secret"]
stderr_empty = true

[[expect.runs]]
run = 0
exit_code = 0
stdout_json = { "/request/body" = { "bytes" = 22, "json" = true }, "/request/headers" = { has = { "name" = "Authorization", "value" = "Bearer ****", "masked" = true } }, "/request/headers/0" = { "name" = "Cookie", "value" = "****", "masked" = true }, "/request/headers/1" = { "name" = "X-Api-Key", "value" = "****", "masked" = true }, "/request/headers/2" = { "name" = "Proxy-Authorization", "value" = "****", "masked" = true }, "/request/headers/3" = { "name" = "Private-Token", "value" = "****", "masked" = true }, "/effects/2/effect" = "1password", "/effects/2/when" = "if_needed" }

[[expect.runs]]
run = 1
exit_code = 0
stdout_json = { "/auth" = { "mode" = "bearer", "source" = "example", "kind" = "token", "header" = "xi-api-key" }, "/request/headers" = { has = { "name" = "xi-api-key", "value" = "****", "masked" = true } }, "/effects/0/effect" = "1password", "/effects/0/when" = "always" }

[[expect.runs]]
run = 2
exit_code = 0
stdout_json = { "/auth/mode" = "sigv4", "/request/headers" = { has = { "name" = "x-amz-security-token", "value" = "****", "masked" = true } } }
stdout = { contains = ["Credential=<access-key-id>/", "/ap-northeast-1/execute-api/aws4_request", "Signature=****"] }
