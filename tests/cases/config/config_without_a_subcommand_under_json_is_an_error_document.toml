# `config` takes a subcommand. Asked for JSON, the missing one is the usage
# error document every subcommand with the JSON error contract prints, not
# clap's text.
id = "config_without_a_subcommand_under_json_is_an_error_document"
feature = "config"

[combination]
command = "config"
output = "json"

[input]
args = ["config", "--json"]

[expect]
json_error = { code = "ARGUMENT_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/hint" = "run `kurama config --help` to see its subcommands, and `kurama config <subcommand> --help` for their arguments" }
sts_actions = []
op_calls = 0
no_files_written = true
