# The file plus the input is checked whole before anything is written: a
# value of the wrong type, an API naming an auth nobody wrote, an
# aws_profile ~/.aws/config does not have, a literal secret -- a string or a
# number, refused by its key and never printed back, in text or in JSON --
# and input that is not TOML all fail with CONFIG_INVALID and leave the file
# as it was. A mistake in the input is named by its line in the input, and
# the hint says to fix the input, not the file.
id = "config_add_rejects_invalid_candidates_without_writing"
feature = "config"

[combination]
command = "config-add"
config = "rejected"
input = "file"

[input]
args = ["config", "add", "--file", "{home}/add/type.toml"]
then_run = [
  ["config", "add", "--file", "{home}/add/reference.toml"],
  ["config", "add", "--file", "{home}/add/aws-profile.toml"],
  ["config", "add", "--file", "{home}/add/literal.toml"],
  ["config", "add", "--file", "{home}/add/numeric-token.toml"],
  ["config", "add", "--file", "{home}/add/numeric-password.toml", "--json"],
  ["config", "add", "--file", "{home}/add/syntax.toml"],
]

[input.home_files]
"add/type.toml" = """
[api.typed]
base_url = "https://typed.example.com"
description = 42
"""
"add/reference.toml" = """
[api.orphan]
base_url = "https://orphan.example.com"
auth = "missing"
"""
"add/aws-profile.toml" = """
[api.signed]
base_url = "https://abc.execute-api.ap-northeast-1.amazonaws.com/prod"
aws_profile = "nope"
"""
"add/literal.toml" = """
[auth.machine]
kind = "oauth"
grant_type = "client_credentials"
token_url = "https://as.example.com/token"
client_id = "machine"
client_secret = "plain-text-client-secret"
"""
"add/numeric-token.toml" = """
[auth.numbers]
kind = "token"
token = 987654321
"""
"add/numeric-password.toml" = """
[db.numbers]
engine = "postgresql"
host = "db.example.com"
database = "app"
username = "reader"
password = 12345678
"""
"add/syntax.toml" = """
[auth.broken]
token = "op://Agent/broken/credential
"""

[expect]
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["the input line 2:"]
stderr_excludes = ["op://Agent/broken/credential"]
hint = "fix the input; the file was not changed"
stdout = "empty"
sts_actions = []
op_calls = 0
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["the input line 3:", "invalid type"]
stderr_excludes = ["config.toml line"]
hint = "fix the input; the file was not changed"

[[expect.runs]]
run = 1
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["[api.orphan]", "names no [auth.missing]"]
hint = "fix the input; the file was not changed"

[[expect.runs]]
run = 2
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["[api.signed] aws_profile = \"nope\" names no profile in"]
hint = "fix the input; the file was not changed"

[[expect.runs]]
run = 3
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["auth.machine.client_secret must be a secret reference", "the value is not shown"]
stderr_excludes = ["plain-text-client-secret"]

[[expect.runs]]
run = 4
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["auth.numbers.token must be a secret reference"]
stderr_excludes = ["987654321"]

[[expect.runs]]
run = 5
json_error = { code = "CONFIG_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = { contains = "db.numbers.password must be a secret reference" }, "/error/hint" = "fix the input; the file was not changed" }
stderr_excludes = ["12345678"]
