# Sources whose use would read 1Password, Secrets Manager or Parameter Store,
# run an OAuth grant (a browser or a client secret), assume a role and fetch
# a description: checking them does none of that. The URL's
# description is reported as not cached, unverified.
id = "config_check_reads_no_secret_store_keychain_sts_or_network"
feature = "config"

[combination]
command = "config-check"
output = "json"
config = "valid"

[input]
args = ["config", "check", "--json"]
config = """
[auth.svc]
kind = "token"
token = "op://Agent/svc/credential"

[auth.stored]
kind = "token"
token = "aws-secrets://dev/example/api-key"

[auth.browser]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "check-client"
client_secret = "op://Agent/browser/client_secret"

[auth.machine]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "check-machine"
client_secret = "aws-ssm://dev/example/client-secret"

[api.browser]
base_url = "{server}/api"

[api.svc]
base_url = "{server}/api"
openapi = "{server}/spec/petstore.json"

[api.signed]
base_url = "https://execute-api.ap-northeast-1.amazonaws.com/prod"
aws_profile = "dev"
"""

[expect]
exit_code = 0
stderr_empty = true
stdout_json = { "/valid" = true, "/openapi/0/api" = "svc", "/openapi/0/state" = "not_cached", "/aws_config/exists" = true }
sts_actions = []
op_calls = 0
token_grants = []
oauth_paths = []
open_calls = []
secret_reads = []
api_calls = { count = 0 }
spec_calls = { count = 0 }
no_files_written = true
