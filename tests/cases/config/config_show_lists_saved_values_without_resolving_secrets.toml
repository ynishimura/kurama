# `config show` prints what is saved -- comments and order kept, no default
# added -- even when the file would not load (an unknown key here). A literal
# secret already in the file is shown as <redacted>, in text and in JSON; a
# reference is shown as written and is not resolved.
id = "config_show_lists_saved_values_without_resolving_secrets"
feature = "config"

[combination]
command = "config-show"
output = "json"
config = "rejected"

[input]
args = ["config", "show"]
then_run = [["config", "show", "auth.legacy"], ["config", "show", "--json"]]
replace_config = """
# written by hand
[core]
log_level = "debug"
colour = "always"

[auth.legacy]
kind = "oauth"
grant_type = "client_credentials"
token_url = "https://as.example.com/token"
client_id = "legacy-client"
client_secret = "literal-client-secret-value" # kept as it was

[auth.svc]
kind = "token"
token = "op://Agent/svc/credential"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
stderr_empty = true
stdout_json = { "/path" = { contains = "/kurama-config.toml" }, "/key" = "<null>", "/value/core/colour" = "always", "/value/auth/legacy/client_secret" = "<redacted>", "/value/auth/legacy/client_id" = "legacy-client", "/value/auth/svc/token" = "op://Agent/svc/credential" }
stdout_excludes = ["literal-client-secret-value"]
sts_actions = []
op_calls = 0
secret_reads = []
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 0
stderr_empty = true
stdout = { starts_with = "# written by hand\n[core]\nlog_level = \"debug\"\ncolour = \"always\"\n", contains = ["client_secret = \"<redacted>\" # kept as it was", "token = \"op://Agent/svc/credential\""] }
stdout_excludes = ["literal-client-secret-value", "session_cache"]
op_calls = 0

[[expect.runs]]
run = 1
exit_code = 0
stderr_empty = true
stdout = { starts_with = "[auth.legacy]\nkind = \"oauth\"\n", contains = ["client_secret = \"<redacted>\""] }
stdout_excludes = ["literal-client-secret-value", "[auth.svc]"]
op_calls = 0
