# `config remove --json` is the save result with one change per section
# removed, in the order given; the sections are gone from the saved file and
# the others stay.
id = "config_remove_json_reports_removed_sections"
feature = "config"

[combination]
command = "config-remove"
output = "json"

[input]
args = ["config", "remove", "api.svc", "auth.svc", "--json"]
then_run = [["config", "list", "--json"]]
replace_config = """
[core]
log_level = "info"

[auth.svc]
kind = "token"
token = "op://Agent/svc/credential"

[api.svc]
base_url = "https://svc.example.com"
auth = "svc"

[api.plain]
base_url = "https://plain.example.com"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
stderr_empty = true
stdout_json = { "/sections" = [{ name = "core", keys = ["log_level"] }, { name = "api.plain", keys = ["base_url"] }] }
sts_actions = []
op_calls = 0
secret_reads = []
files_written = ["kurama-config.toml"]

[[expect.runs]]
run = 0
exit_code = 0
stderr_empty = true
stdout_json = { "" = { length = 5 }, "/path" = { contains = "/kurama-config.toml" }, "/changed" = true, "/applied" = true, "/changes" = [{ section = "api.svc", action = "remove" }, { section = "auth.svc", action = "remove" }], "/warnings" = [] }
