# An `[auth.*]` that is already wrong -- a token source with the OAuth-only
# `grant_type` -- and is named after an AWS profile gets one diagnostic, its
# own; a valid `[auth.*]` whose only problem is the collision still reports
# the collision.
id = "config_check_reports_one_problem_for_invalid_colliding_auth"
feature = "config"

[combination]
command = "config-check"
output = "json"
config = "rejected"

[input]
args = ["config", "check", "--json"]
replace_config = """
[auth.dev]
kind = "token"
token = "op://Agent/dev/credential"
grant_type = "client_credentials"

[auth.ops-mfa]
kind = "token"
token = "op://Agent/ops/credential"
"""

[expect]
json_error = { code = "CONFIG_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = { contains = "has 2 errors; stdout lists each" } }
stdout_json = { "/valid" = false, "/diagnostics" = { length = 2 }, "/diagnostics/0/section" = "auth.dev", "/diagnostics/0/line" = 1, "/diagnostics/0/message" = { contains = "grant_type" }, "/diagnostics/1/section" = "auth.ops-mfa", "/diagnostics/1/line" = 6, "/diagnostics/1/message" = { contains = "has the same name as the AWS profile 'ops-mfa'" } }
sts_actions = []
op_calls = 0
secret_reads = []
no_files_written = true
