# `config show --json` is the path, the key asked for and the saved value.
# Every key that holds a secret -- an auth's client_secret and token, a
# database's password -- is `<redacted>` when the file holds the secret
# itself, and a reference is shown as written: no 1Password, Secrets
# Manager, SSM or STS call resolves it.
id = "config_show_json_redacts_literal_secrets_without_resolving_references"
feature = "config"

[combination]
command = "config-show"
output = "json"
config = "valid"

[input]
args = ["config", "show", "--json"]
then_run = [["config", "show", "auth.legacy", "--json"]]
replace_config = """
[auth.legacy]
kind = "oauth"
grant_type = "client_credentials"
token_url = "https://as.example.com/token"
client_id = "legacy-client"
client_secret = "literal-client-secret-121"

[auth.svc]
kind = "token"
token = "literal-token-121"

[auth.ssm]
kind = "token"
token = "aws-ssm://dev/kurama/ssm-token"

[db.app]
engine = "postgres"
host = "db.example.com"
database = "app"
username = "aws-secrets://dev/app-db#username"
password = "literal-password-121"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
stderr_empty = true
stdout_json = { "" = { length = 3 }, "/path" = { contains = "/kurama-config.toml" }, "/key" = "auth.legacy", "/value" = { kind = "oauth", grant_type = "client_credentials", token_url = "https://as.example.com/token", client_id = "legacy-client", client_secret = "<redacted>" } }
stdout_excludes = ["literal-client-secret-121"]
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 0
stderr_empty = true
stdout_json = { "" = { length = 3 }, "/path" = { contains = "/kurama-config.toml" }, "/key" = "<null>", "/value/auth/legacy/client_secret" = "<redacted>", "/value/auth/svc/token" = "<redacted>", "/value/auth/ssm/token" = "aws-ssm://dev/kurama/ssm-token", "/value/db/app" = { engine = "postgres", host = "db.example.com", database = "app", username = "aws-secrets://dev/app-db#username", password = "<redacted>" } }
stdout_excludes = ["literal-client-secret-121", "literal-token-121", "literal-password-121"]
