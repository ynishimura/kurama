# `--dry-run` checks the edit and prints the lines it would change, with
# the unchanged lines around them, and writes nothing: the file keeps its
# bytes and its mtime. A literal secret the file already holds is shown as
# `<redacted>` in the diff, whether it is context or a removed line, and
# never printed; the JSON form says the edit was not applied.
id = "config_edit_dry_run_redacts_secrets_and_writes_nothing"
feature = "config"

[combination]
command = "config-set"
output = "dry-run"

[input]
args = ["config", "set", "auth.legacy.client_id", "\"new-id\"", "--dry-run"]
then_run = [
  ["config", "remove", "api.legacy", "auth.legacy", "--dry-run"],
  ["config", "unset", "core.log_level", "--dry-run", "--json"],
]
config = """
[core]
log_level = "debug"

[auth.legacy]
kind = "oauth"
grant_type = "client_credentials"
token_url = "https://as.example.com/token"
client_id = "legacy"
client_secret = "literal-secret-already-in-the-file"

[api.legacy]
base_url = "https://legacy.example.com"
"""

[expect]
exit_code = 0
stderr_empty = true
stdout_json = { "/changed" = true, "/applied" = false, "/changes/0/section" = "core", "/changes/0/action" = "unset", "/changes/0/key" = "core.log_level" }
stdout_excludes = ["literal-secret-already-in-the-file"]
sts_actions = []
op_calls = 0
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 0
stdout = { lines_start_with = ["@@ ", " ", "-", "+"], contains = [" grant_type = \"client_credentials\"\n token_url = \"https://as.example.com/token\"\n-client_id = \"legacy\"\n+client_id = \"new-id\"\n client_secret = \"<redacted>\"\n"] }
stdout_excludes = ["literal-secret-already-in-the-file"]
stderr_contains = ["# dry run: set auth.legacy.client_id in ", "; nothing was written"]
stderr_excludes = ["literal-secret-already-in-the-file"]

[[expect.runs]]
run = 1
exit_code = 0
stdout = { contains = ["-[auth.legacy]\n", "-client_secret = \"<redacted>\"\n", "-[api.legacy]\n"] }
stdout_excludes = ["literal-secret-already-in-the-file"]
stderr_contains = ["# dry run: removed [api.legacy], removed [auth.legacy] in "]
