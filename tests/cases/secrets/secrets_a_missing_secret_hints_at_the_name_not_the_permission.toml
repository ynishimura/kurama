# Secrets Manager answers ResourceNotFoundException for a secret that does not
# exist, and for one the role may not see. The code and the exit stay a
# refusal; the hint points at the name first, then at the permission.
id = "secrets_a_missing_secret_hints_at_the_name_not_the_permission"
feature = "secrets"

[combination]
command = "db"
secret = "aws-secrets"
store_response = "not-found"

[input]
args = ["db", "remote", "--tables", "--json"]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "aws-secrets://dev/app/dbb#username"
password = "aws-secrets://dev/app/dbb#password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "not-found"

[expect]
json_error = { code = "SECRET_REJECTED", exit = 4 }
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "secretsmanager:GetSecretValue", id = "app/dbb", region = "ap-northeast-1" }]
no_files_written = true
stderr_json = { "/error/hint" = "check the name in the reference; the role also needs secretsmanager:GetSecretValue, and kms:Decrypt when the secret uses a customer-managed key", "/error/message" = { contains = "ResourceNotFoundException" } }
