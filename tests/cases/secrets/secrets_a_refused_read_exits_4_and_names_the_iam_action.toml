# AWS says only that access was denied; the role and the action it is
# missing are what the person has to act on. The hint names the action of the
# store that refused, and not the other store's.
id = "secrets_a_refused_read_exits_4_and_names_the_iam_action"
feature = "secrets"

[combination]
command = "db"
secret = "aws-secrets"
store_response = "access-denied"

[input]
args = ["db", "remote", "--tables", "--json"]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "aws-secrets://dev/app/db#username"
password = "aws-secrets://dev/app/db#password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "access-denied"

[expect]
json_error = { code = "SECRET_REJECTED", exit = 4 }
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "secretsmanager:GetSecretValue", id = "app/db", region = "ap-northeast-1" }]
no_files_written = true
stderr_json = { "/error/hint" = "the role of the AWS profile in the reference needs secretsmanager:GetSecretValue, and kms:Decrypt when the secret uses a customer-managed key", "/error/message" = { contains = "aws-secrets://dev/app/db#username" } }
