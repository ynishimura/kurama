# The shape a managed RDS secret has: one document, two fields. Reading it
# twice would be two calls and two chances to catch a rotation half way. The
# server is not there, so the call ends the moment the secrets are read.
id = "secrets_one_managed_secret_answers_username_and_password_in_one_call"
feature = "secrets"

[combination]
command = "db"
secret = "aws-secrets"
fields = "two-of-one-document"

[input]
args = ["db", "remote", "--tables", "--json"]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "aws-secrets://dev/app/db#username"
password = "aws-secrets://dev/app/db#password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "from-id"

[expect]
json_error = { code = "DB_UNREACHABLE", exit = 1 }
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "secretsmanager:GetSecretValue", id = "app/db", region = "ap-northeast-1" }]
op_calls = 0
api_calls = { count = 0 }
no_files_written = true
