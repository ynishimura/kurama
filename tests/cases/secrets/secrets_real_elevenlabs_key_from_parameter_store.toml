# The same issued key, read from Parameter Store with the `kurama-sandbox` profile's
# role: the fake answers the parameter's name and the fake API echoes the
# header; the real read assumes the role (MFA from 1Password), decrypts the
# parameter and opens the same listing the 1Password copy does.
id = "secrets_real_elevenlabs_key_from_parameter_store"
feature = "secrets"

[combination]
command = "api"
source = "token"
secret = "aws-ssm"
header = "named"

[input]
args = ["api", "elevenlabs-ssm", "/v1/voices"]
config = """
[auth.elevenlabs-ssm]
kind = "token"
token = "aws-ssm://dev/kurama/elevenlabs/api-key"
header = "xi-api-key"
format = "{token}"

[api.elevenlabs-ssm]
base_url = "{server}/api"
"""

[fakes]
aws_secrets = "from-id"
api = "ok"

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
token_grants = []
op_calls = 0
secret_reads = [{ operation = "ssm:GetParameter", id = "/kurama/elevenlabs/api-key", region = "ap-northeast-1" }]
api_calls = { count = 1, headers = { "xi-api-key" = "parameter-of/kurama/elevenlabs/api-key" } }
stderr_excludes = ["parameter-of/kurama/elevenlabs/api-key"]
no_files_written = true

[real]
requires = ["profile:kurama-sandbox", "keychain:OP_SERVICE_ACCOUNT_TOKEN"]
config = """
[auth.elevenlabs-ssm]
kind = "token"
token = "aws-ssm://kurama-sandbox/kurama/elevenlabs/api-key"
header = "xi-api-key"
format = "{token}"

[api.elevenlabs-ssm]
base_url = "https://api.elevenlabs.io"
"""

[real.combination]
target = "elevenlabs"
mfa = "onepassword"

[real.expect]
exit_code = 0
stdout_json = { "/voices" = { min_length = 1 } }
