# The ARN says where the secret is and `?region=` says otherwise: taking
# either silently would read a secret from a region nobody asked for. The
# message names both regions.
id = "secrets_an_arn_and_a_region_that_disagree_are_refused_before_anything_is_read"
feature = "secrets"

[combination]
command = "db"
secret = "aws-secrets"
region = "arn-and-query-disagree"
config = "rejected"

[input]
args = ["db", "remote", "--tables", "--json"]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "aws-secrets://dev/arn:aws:secretsmanager:us-east-1:123456789012:secret:app/db-AbCdEf?region=eu-west-1#password"
tls = "disable"
"""

[fakes]
aws_secrets = "from-id"

[expect]
json_error = { code = "CONFIG_INVALID", exit = 2 }
sts_actions = []
secret_reads = []
no_files_written = true
stderr_contains = ["us-east-1", "eu-west-1"]
