# One field of a managed secret carried all the way to the authorization
# server. Every other Secrets Manager scenario ends in an error, so without
# this one no run ever observes a value that store answered, and `#username`
# and `#password` could be exchanged with the whole suite still green.
id = "secrets_a_managed_secret_field_reaches_the_token_request"
feature = "secrets"

[combination]
command = "token"
source = "oauth"
grant = "client_credentials"
secret = "aws-secrets"

[input]
args = ["token", "rds"]
config = """
[auth.rds]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "rds-client"
client_secret = "aws-secrets://dev/app/db#password"
scopes = ["read"]
"""

[fakes]
aws_secrets = "from-id"
token_store = true

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "secretsmanager:GetSecretValue", id = "app/db", region = "ap-northeast-1" }]
op_calls = 0
token_grants = ["client_credentials"]
oauth_params = [{ call = 0, params = { client_secret = "password-of-app/db" } }]
