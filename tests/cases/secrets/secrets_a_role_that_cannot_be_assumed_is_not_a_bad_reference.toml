# A role that could not be assumed is not a reference that is wrong. Exit 2
# is usage in this project, so reporting a refused role that way tells a
# person to fix their grammar and an agent that retrying cannot help. Nothing
# was read: the credentials to read with never arrived.
id = "secrets_a_role_that_cannot_be_assumed_is_not_a_bad_reference"
feature = "secrets"

[combination]
command = "db"
secret = "aws-secrets"
sts_response = "access-denied"

[input]
args = ["db", "remote", "--tables", "--json"]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "aws-secrets://dev/app/db#username"
password = "aws-secrets://dev/app/db#password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "from-id"
sts = { error = { code = "AccessDenied", message = "User is not authorized to perform: sts:AssumeRole" } }

[expect]
json_error = { code = "STS_ACCESS_DENIED", exit = 4 }
secret_reads = []
no_files_written = true
stderr_contains = ["could not be assumed"]
stderr_excludes = ["a secret reference is op://"]
