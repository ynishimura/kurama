# A bastion, an IAM token and a secret reference, all three on one AWS
# profile: a second AssumeRole would be a second TOTP for a profile that has
# MFA, and a third would be a third. The bastion is opened and closed, so the
# username was read behind it; the token is signed here and sent to the
# database only.
id = "secrets_a_tunnel_an_iam_token_and_a_reference_assume_the_role_once"
feature = "secrets"

[combination]
command = "db"
secret = "aws-ssm"
tunnel = "ssm"
db_auth = "iam"
role = "assumed-once"

[input]
args = ["db", "both", "--tables", "--json"]
config = """
[db.both]
engine = "postgresql"
host = "rds.internal.example.com"
database = "app"
username = "aws-ssm://dev/app/db-user"
tls = "verify-ca"
connect_timeout_secs = 2
[db.both.iam]
aws_profile = "dev"
[db.both.tunnel]
kind = "ssm"
aws_profile = "dev"
instance_name = "bastion"
"""

[fakes]
aws_secrets = "from-id"
tools = true

[expect]
json_error = { code = "DB_UNREACHABLE", exit = 1 }
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "ssm:GetParameter", id = "/app/db-user", region = "ap-northeast-1" }]
op_calls = 0
no_files_written = true
ssm_calls = ["DescribeInstanceInformation", "StartSession", "GetParameter", "TerminateSession"]
