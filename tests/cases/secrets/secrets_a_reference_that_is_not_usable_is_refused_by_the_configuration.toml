# A scheme one letter short of a real one used to become a literal password,
# which the database then refused for reasons nobody could read. The message
# names the schemes kurama reads, so the typo is visible.
id = "secrets_a_reference_that_is_not_usable_is_refused_by_the_configuration"
feature = "secrets"

[combination]
command = "status"
secret = "unknown-scheme"
config = "rejected"

[input]
args = ["status", "--kind", "db", "--json"]
then_run = [["db", "remote", "--tables", "--json"]]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "aws-secret://dev/app/db"
password = "aws-secrets://dev/app/db#password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "from-id"

[expect]
json_error = { code = "CONFIG_INVALID", exit = 2 }
sts_actions = []
secret_reads = []
op_calls = 0
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 2
stderr_contains = ["unknown secret reference scheme", "aws-secrets://", "aws-ssm://"]

[[expect.runs]]
run = 1
exit_code = 2
stderr_contains = ["unknown secret reference scheme", "aws-secrets://", "aws-ssm://"]
