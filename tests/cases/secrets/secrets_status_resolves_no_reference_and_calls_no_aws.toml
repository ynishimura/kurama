# `status` describes the configuration and resolves nothing: listing the
# databases must not assume a role or read a secret.
id = "secrets_status_resolves_no_reference_and_calls_no_aws"
feature = "secrets"

[combination]
command = "status"
secret = "aws-secrets"
resolution = "none"

[input]
args = ["status", "--kind", "db", "--json"]
then_run = [["status", "--json"], ["db", "remote", "--dry-run", "--json"]]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "aws-secrets://dev/app/db#username"
password = "aws-secrets://dev/app/db#password"
tls = "disable"
connect_timeout_secs = 2

[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "aws-ssm://dev/kurama/client-secret"
scopes = ["read"]
"""

[fakes]
aws_secrets = "from-id"

[expect]
exit_code = 0
sts_actions = []
secret_reads = []
op_calls = 0
no_files_written = true

[[expect.runs]]
run = 0
stdout_json = { "/0/name" = "remote", "/0/connection_status" = "unknown", "/0/database" = "app" }
