# One parameter name, one region, two AWS profiles: two roles that may be two
# accounts, so two secrets. The value the first role read is not the answer
# for the second; each profile assumes its own role and reads the parameter
# itself. The server is not there, so the call ends the moment both secrets
# are read.
id = "secrets_cache_isolated_by_aws_profile"
feature = "secrets"

[combination]
command = "db"
secret = "aws-ssm"
fields = "one-id-two-profiles"

[input]
args = ["db", "remote", "--tables", "--json"]
aws_config = """
[default]
region = us-east-1

[profile dev]
role_arn = arn:aws:iam::123456789012:role/Dev
source_profile = default
region = ap-northeast-1

[profile other]
role_arn = arn:aws:iam::210987654321:role/Other
source_profile = default
region = ap-northeast-1
"""
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "aws-ssm://dev/app/db"
password = "aws-ssm://other/app/db"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "from-id"

[expect]
json_error = { code = "DB_UNREACHABLE", exit = 1 }
sts_calls = [
  { action = "AssumeRole", role_arn = "arn:aws:iam::123456789012:role/Dev" },
  { action = "AssumeRole", role_arn = "arn:aws:iam::210987654321:role/Other" },
]
secret_reads = [
  { operation = "ssm:GetParameter", id = "/app/db", region = "ap-northeast-1" },
  { operation = "ssm:GetParameter", id = "/app/db", region = "ap-northeast-1" },
]
op_calls = 0
api_calls = { count = 0 }
no_files_written = true
