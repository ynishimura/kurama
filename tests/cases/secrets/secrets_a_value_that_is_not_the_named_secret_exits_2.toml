# A value that cannot be the secret the reference says it is: a key the
# document does not have, a `SecretString` that is not JSON, and bytes. All
# three are the configuration -- no retry makes any of them work -- and each
# says which one it was, because "invalid" alone sends nobody anywhere.
id = "secrets_a_value_that_is_not_the_named_secret_exits_2"
feature = "secrets"

[combination]
command = "db"
secret = "aws-secrets"
value = "not-the-named-secret"

[input]
args = ["db", "no-key", "--tables", "--json"]
then_run = [["db", "not-json", "--tables", "--json"], ["db", "bytes", "--tables", "--json"]]
config = """
[db.no-key]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "aws-secrets://dev/app/db#passphrase"
tls = "disable"
connect_timeout_secs = 2

[db.not-json]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "aws-secrets://dev/app/db-text#password"
tls = "disable"
connect_timeout_secs = 2

[db.bytes]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "aws-secrets://dev/app/db-binary#password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "from-id"

[expect]
json_error = { code = "SECRET_INVALID", exit = 2 }
secret_reads = [
  { operation = "secretsmanager:GetSecretValue", id = "app/db", region = "ap-northeast-1" },
  { operation = "secretsmanager:GetSecretValue", id = "app/db-text", region = "ap-northeast-1" },
  { operation = "secretsmanager:GetSecretValue", id = "app/db-binary", region = "ap-northeast-1" },
]
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 2
stderr_contains = ["no key passphrase"]

[[expect.runs]]
run = 1
exit_code = 2
stderr_contains = ["not JSON"]

[[expect.runs]]
run = 2
exit_code = 2
stderr_contains = ["SecretBinary"]
