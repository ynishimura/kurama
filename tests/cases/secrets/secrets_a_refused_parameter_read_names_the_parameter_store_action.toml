# The same refusal from the other store: the hint names Parameter Store's
# own action and not Secrets Manager's.
id = "secrets_a_refused_parameter_read_names_the_parameter_store_action"
feature = "secrets"

[combination]
command = "db"
secret = "aws-ssm"
store_response = "access-denied"

[input]
args = ["db", "param", "--tables", "--json"]
config = """
[db.param]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "aws-ssm://dev/app/db-password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "access-denied"

[expect]
json_error = { code = "SECRET_REJECTED", exit = 4 }
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "ssm:GetParameter", id = "/app/db-password", region = "ap-northeast-1" }]
no_files_written = true
stderr_json = { "/error/hint" = "the role of the AWS profile in the reference needs ssm:GetParameter, and kms:Decrypt for a SecureString" }
