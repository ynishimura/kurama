# A source whose client secret is a parameter. The token request carries the
# value, so this says the secret really reached the authorization server and
# came from the parameter the reference named. A configuration that names no
# op:// reference asks 1Password nothing.
id = "secrets_a_parameter_store_client_secret_reaches_the_token_request"
feature = "secrets"

[combination]
command = "token"
source = "oauth"
grant = "client_credentials"
secret = "aws-ssm"

[input]
args = ["token", "svc"]
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "aws-ssm://dev/kurama/client-secret"
scopes = ["read"]
"""

[fakes]
aws_secrets = "from-id"
token_store = true

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "ssm:GetParameter", id = "/kurama/client-secret", region = "ap-northeast-1" }]
op_calls = 0
token_grants = ["client_credentials"]
oauth_params = [{ call = 0, params = { client_secret = "parameter-of/kurama/client-secret" } }]
