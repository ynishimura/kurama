# Two fields of one 1Password item, the way a database user and its password
# are usually kept: one `op item get` answers both, so one CLI run and one
# biometric prompt, not one per field. The server is not there, so the call
# ends the moment both secrets are read; a field the item did not answer
# would end it earlier, as a secret error.
id = "secrets_two_fields_of_one_1password_item_use_one_read"
feature = "secrets"

[combination]
command = "db"
secret = "op"
fields = "two-of-one-item"

[input]
args = ["db", "remote", "--tables", "--json"]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "op://Agent/db/username"
password = "op://Agent/db/password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
op = "enabled"

[expect]
json_error = { code = "DB_UNREACHABLE", exit = 1 }
op_reads = ["item get db --format json --vault Agent"]
op_calls = 1
sts_actions = []
api_calls = { count = 0 }
no_files_written = true
