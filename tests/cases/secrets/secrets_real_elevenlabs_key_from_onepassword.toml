# An issued API key read from 1Password and presented in the header the
# source names: the fake `op` answers its one value and the fake API echoes
# the header; the real ElevenLabs answers a listing only that key opens.
# The same key is also in Parameter Store (the sibling case), so the two
# reference forms are compared on one service.
id = "secrets_real_elevenlabs_key_from_onepassword"
feature = "secrets"

[combination]
command = "api"
source = "token"
secret = "op"
header = "named"

[input]
args = ["api", "elevenlabs-op", "/v1/voices"]
config = """
[auth.elevenlabs-op]
kind = "token"
token = "op://Agent/ELEVENLABS_ADMIN_API_KEY/credential"
header = "xi-api-key"
format = "{token}"

[api.elevenlabs-op]
base_url = "{server}/api"
"""

[fakes]
op = "enabled"
api = "ok"

[expect]
exit_code = 0
sts_actions = []
token_grants = []
op_reads = ["item get ELEVENLABS_ADMIN_API_KEY --format json --vault Agent"]
api_calls = { count = 1, headers = { "xi-api-key" = "{fake_client_secret}" } }
stderr_excludes = ["{fake_client_secret}"]
no_files_written = true

[real]
requires = ["keychain:OP_SERVICE_ACCOUNT_TOKEN"]
config = """
[auth.elevenlabs-op]
kind = "token"
token = "op://Agent/ELEVENLABS_ADMIN_API_KEY/credential"
header = "xi-api-key"
format = "{token}"

[api.elevenlabs-op]
base_url = "https://api.elevenlabs.io"
"""

[real.combination]
target = "elevenlabs"

[real.expect]
exit_code = 0
stdout_json = { "/voices" = { min_length = 1 } }
