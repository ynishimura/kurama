# Neither of these can be resolved, and both are decided before a role is
# assumed: the AWS profile a reference names has to exist, and something has
# to say which region the secret is in.
id = "secrets_a_reference_no_aws_profile_can_place_exits_2"
feature = "secrets"

[combination]
command = "db"
secret = "aws-ssm"
region = "none"
config = "rejected"

[input]
args = ["db", "unknown-profile", "--tables", "--json"]
then_run = [["db", "no-region", "--tables", "--json"]]
aws_config = """
[default]

[profile dev]
role_arn = arn:aws:iam::123456789012:role/Dev
source_profile = default
"""
config = """
[db.unknown-profile]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "aws-ssm://nope/app/db-password"
tls = "disable"
connect_timeout_secs = 2

[db.no-region]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "aws-ssm://dev/app/db-password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "from-id"

[expect]
json_error = { code = "SECRET_INVALID", exit = 2 }
sts_actions = []
secret_reads = []
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 2
stderr_contains = ["nope"]

[[expect.runs]]
run = 1
exit_code = 2
stderr_contains = ["?region="]
