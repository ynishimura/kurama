# The region of the reference, not of the AWS profile. Both stores answer on
# one fake server, so the credential scope of the request is the only thing
# that says where kurama meant to read. Only the read moves: `?region=` is where
# the secret is, and it does not follow into AssumeRole, which is signed for
# the region of the source profile whose keys sign it.
id = "secrets_a_reference_names_the_region_it_is_read_in"
feature = "secrets"

[combination]
command = "db"
secret = "aws-secrets"
region = "query"

[input]
args = ["db", "far", "--tables", "--json"]
config = """
[db.far]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "aws-secrets://dev/app/db?region=us-west-2#password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "from-id"

[expect]
json_error = { code = "DB_UNREACHABLE", exit = 1 }
sts_actions = ["AssumeRole"]
sts_signing_region = "us-east-1"
secret_reads = [{ operation = "secretsmanager:GetSecretValue", id = "app/db", region = "us-west-2" }]
op_calls = 0
no_files_written = true
