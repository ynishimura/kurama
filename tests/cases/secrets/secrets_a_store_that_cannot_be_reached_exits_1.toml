# A store that cannot be reached is not a refusal: nothing answered, so
# there is no permission to fix and retrying can work. The fake is mounted and
# was never asked: the request went elsewhere.
id = "secrets_a_store_that_cannot_be_reached_exits_1"
feature = "secrets"

[combination]
command = "db"
secret = "aws-secrets"
store_response = "unreachable"

[input]
args = ["db", "remote", "--tables", "--json"]
env = { KURAMA_TEST_SECRETSMANAGER_ENDPOINT = "http://127.0.0.1:1" }
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "aws-secrets://dev/app/db#username"
password = "aws-secrets://dev/app/db#password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "from-id"

[expect]
json_error = { code = "SECRET_FAILED", exit = 1 }
sts_actions = ["AssumeRole"]
secret_reads = []
no_files_written = true
stderr_contains = ["GetSecretValue"]
