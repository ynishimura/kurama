# Parameter Store answers ParameterNotFound for a name that does not exist,
# and for one the role may not see. The code and the exit stay a refusal; the
# hint points at the name first, then at the permission.
id = "secrets_a_missing_parameter_hints_at_the_name_not_the_permission"
feature = "secrets"

[combination]
command = "db"
secret = "aws-ssm"
store_response = "not-found"

[input]
args = ["db", "param", "--tables", "--json"]
config = """
[db.param]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "aws-ssm://dev/app/db-pasword"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
aws_secrets = "not-found"

[expect]
json_error = { code = "SECRET_REJECTED", exit = 4 }
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "ssm:GetParameter", id = "/app/db-pasword", region = "ap-northeast-1" }]
no_files_written = true
stderr_json = { "/error/hint" = "check the name in the reference; the role also needs ssm:GetParameter, and kms:Decrypt for a SecureString", "/error/message" = { contains = "ParameterNotFound" } }
