# A parameter is read with WithDecryption=true: a SecureString read without
# it answers its ciphertext, which would pass for a token everywhere a fake
# answers anyway. The harness holds every Parameter Store read of every
# scenario to the flag; this case is the one whose point it is, and prints
# the value the parameter the reference named holds.
id = "secrets_parameter_store_requests_with_decryption"
feature = "secrets"

[combination]
command = "token"
source = "token"
secret = "aws-ssm"
decryption = "requested"

[input]
args = ["token", "example"]
config = """
[auth.example]
kind = "token"
token = "aws-ssm://dev/kurama/api-key"
"""

[fakes]
aws_secrets = "from-id"

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "ssm:GetParameter", id = "/kurama/api-key", region = "ap-northeast-1" }]
stdout = { equals = "parameter-of/kurama/api-key\n" }
op_calls = 0
no_files_written = true
