# With 1Password disabled, AssumeRole is signed with the keys of the selected
# profile's source_profile and for that profile's region, not with the default
# profile's: here the two hold different keys and regions.
id = "assume_role_without_onepassword_uses_selected_source_profile"
feature = "assume-role"

[combination]
command = "env"
source = "aws-profile"
role = "assume-role"
onepassword = "disabled"

[input]
args = ["env", "work-dev"]
aws_config = """
[default]
region = us-east-1

[profile work]
aws_access_key_id = AKIAWORKSOURCEKEY001
aws_secret_access_key = work-source-secret
region = eu-west-1

[profile work-dev]
role_arn = arn:aws:iam::210987654321:role/WorkDev
source_profile = work
region = ap-southeast-2
"""

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
sts_calls = [{ action = "AssumeRole", role_arn = "arn:aws:iam::210987654321:role/WorkDev", signing_access_key = "AKIAWORKSOURCEKEY001" }]
sts_signing_region = "eu-west-1"
stdout = { kind = "export-script", contains = ["export KURAMA_AWS='work-dev'"] }
no_files_written = true
