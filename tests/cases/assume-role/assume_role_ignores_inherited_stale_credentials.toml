# Inherited AWS_* variables are cleared before the SDK sees them: AssumeRole
# is still signed with the source profile's key, and the run says how many
# it cleared.
id = "assume_role_ignores_inherited_stale_credentials"
feature = "assume-role"

[combination]
command = "env"
source = "aws-profile"
role = "assume-role"
environment = "stale-aws-credentials"

[input]
args = ["env", "dev"]
env = { AWS_ACCESS_KEY_ID = "ASIASTALE", AWS_SECRET_ACCESS_KEY = "stale-secret", AWS_SESSION_TOKEN = "stale-token", AWS_PROFILE = "wrong-profile", AWS_DEFAULT_PROFILE = "wrong-default-profile", AWS_CREDENTIAL_EXPIRATION = "stale-expiration" }

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
sts_calls = [{ action = "AssumeRole", signing_access_key = "{source_access_key}" }]
stdout = "export-script"
stderr_contains = ["# Cleared 6 AWS environment variable(s)"]
no_files_written = true
