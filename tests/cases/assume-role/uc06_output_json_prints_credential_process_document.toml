# `env --json` prints exactly one credential_process document.
id = "uc06_output_json_prints_credential_process_document"
feature = "assume-role"

[combination]
command = "env"
source = "aws-profile"
role = "assume-role"
output = "json"

[input]
args = ["env", "dev", "--json"]

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
stdout = { line_count = 1 }
stdout_json = { "/Version" = 1, "/AccessKeyId" = "{result_access_key}", "/SessionToken" = "<string>", "/Expiration" = "2030-01-01T12:00:00Z" }
no_files_written = true
