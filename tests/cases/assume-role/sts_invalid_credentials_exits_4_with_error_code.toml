# A source profile whose key AWS does not know is exit 4.
id = "sts_invalid_credentials_exits_4_with_error_code"
feature = "assume-role"

[combination]
command = "env"
source = "aws-profile"
role = "assume-role"
sts_response = "invalid-credentials"

[input]
args = ["env", "dev"]

[fakes]
sts = { error = { code = "InvalidClientTokenId", message = "The security token included in the request is invalid." } }

[expect]
error = { code = "STS_INVALID_CREDENTIALS", exit = 4 }
sts_actions = ["AssumeRole"]
no_files_written = true
