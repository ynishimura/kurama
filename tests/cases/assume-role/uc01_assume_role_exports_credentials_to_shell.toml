# `env` on a profile with a role assumes it once, without MFA, signed with the
# source profile's long-term key, and prints the export script.
id = "uc01_assume_role_exports_credentials_to_shell"
feature = "assume-role"

[combination]
command = "env"
source = "aws-profile"
role = "assume-role"
mfa = "none"
output = "export-script"

[input]
args = ["env", "dev"]

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
sts_calls = [{ action = "AssumeRole", role_arn = "arn:aws:iam::123456789012:role/Dev", serial_number = "<none>", token_code = "<none>", signing_access_key = "{source_access_key}" }]
stdout = { kind = "export-script", contains = ["export AWS_ACCESS_KEY_ID='{result_access_key}'", "export KURAMA_AWS='dev'", "export AWS_REGION='ap-northeast-1'"] }
stderr_contains = ["# Profile 'dev' loaded successfully"]
no_files_written = true
