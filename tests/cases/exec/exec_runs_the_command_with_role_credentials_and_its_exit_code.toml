# `exec` runs the command with the role credentials in its environment,
# prints only its output, and exits with its exit code.
id = "exec_runs_the_command_with_role_credentials_and_its_exit_code"
feature = "exec"

[combination]
command = "exec"
source = "aws-profile"
role = "assume-role"

[input]
args = ["exec", "dev", "--", "/bin/sh", "-c", "[ -n \"$AWS_SESSION_TOKEN\" ] || exit 1; printf '%s %s\\n' \"$KURAMA_AWS\" \"$AWS_REGION\"; exit 7"]

[expect]
exit_code = 7
sts_actions = ["AssumeRole"]
op_calls = 0
stdout = { equals = "dev ap-northeast-1\n" }
no_files_written = true
