# The child `exec` starts gets every credential AssumeRole issued -- the
# access key id, the secret access key and the session token -- not the
# source profile's key.
id = "exec_child_receives_complete_assume_role_credentials"
feature = "exec"

[combination]
command = "exec"
source = "aws-profile"
role = "assume-role"

[input]
args = ["exec", "dev", "--", "/bin/sh", "-c", "printf '%s %s %s\\n' \"$AWS_ACCESS_KEY_ID\" \"$AWS_SECRET_ACCESS_KEY\" \"$AWS_SESSION_TOKEN\""]

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
op_calls = 0
stdout = { equals = "ASIARESULTKEY000001 result-secret-key result-session-token\n" }
no_files_written = true
