# A build the keychain refuses (every ad-hoc build is signed with a new hash)
# warns once per process, whichever entries it could not read -- here two MFA
# sessions and an OAuth token -- and names `cargo xtask install-signed`, but
# not the entries. What it could not read still counts as absent: `status`
# reports them unreadable, and `env` gets a new MFA session.
id = "session_cache_an_unreadable_keychain_warns_once_per_process"
feature = "session-cache"

[combination]
command = "status"
session_cache = "denied"

[input]
args = ["status"]
then_run = [["env", "ops-mfa"]]
aws_config = """
[default]
region = us-east-1

[profile ops-mfa]
role_arn = arn:aws:iam::123456789012:role/Ops
source_profile = default
mfa_serial = arn:aws:iam::123456789012:mfa/agent
region = ap-northeast-1

[profile audit-mfa]
role_arn = arn:aws:iam::123456789012:role/Audit
source_profile = default
mfa_serial = arn:aws:iam::123456789012:mfa/auditor
region = ap-northeast-1
"""
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"
"""

[fakes]
op = "enabled"
keychain_denied = -25293

[expect]
exit_code = 0
stdout = "export-script"
stderr_lines_containing = { "macOS denied this build access" = 1, "install-signed" = 1 }
sts_actions = ["GetSessionToken", "AssumeRole"]
files_written = ["session-cache.json"]

[[expect.runs]]
run = 0
exit_code = 0
sts_actions = []
stderr_lines_containing = { "macOS denied this build access" = 1, "install-signed" = 1, "mfa/" = 0, "github" = 0 }
stdout = { line_containing = [["ops-mfa", "unreadable"], ["audit-mfa", "unreadable"], ["github", "unreadable"]] }
