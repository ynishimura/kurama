# `status --ready` answers from what `status` reads -- the cached MFA session,
# the stored tokens, the references as written -- and calls nothing: no STS,
# token endpoint, API, AWS secret store or 1Password. A cached MFA session is
# ready until it ends, a valid or refreshable token is ready, a `kind =
# "token"` source is as ready as the profile its reference names, a client
# secret in 1Password without a service account will prompt, and an [api.*]
# or [db.*] is as ready as what it goes through. No reference is printed.
id = "status_ready_reports_each_source_without_calling_anything"
feature = "status"

[combination]
command = "status"
output = "json"
session_cache = "reused"

[input]
args = ["env", "ops-mfa"]
then_run = [["status", "--ready", "--json"], ["status", "--ready"]]
stored_tokens = [
  { source = "github", access_token = "{stored_access_token}", expires_in = 3600, refreshable = false },
  { source = "renewing", access_token = "{stored_access_token}", expires_in = -60, refreshable = true },
]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"

[auth.renewing]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "renew-client"

[auth.machine]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "machine-client"
client_secret = "op://Agent/machine-item/credential"

[auth.example]
kind = "token"
token = "aws-ssm://dev/kurama/api-key"
header = "xi-api-key"
format = "{token}"
env_var = "EXAMPLE_TOKEN"

[api.github]
base_url = "{server}/api"
auth = "github"

[api.signed]
base_url = "{server}/api"
aws_profile = "ops-mfa"

[db.local]
engine = "sqlite"
path = "/nonexistent/kurama-agent-ready.db"
"""

[fakes]
op = "enabled"
session_cache = true
token_store = true

[expect]
exit_code = 0
sts_actions = []
op_calls = 0
token_grants = []
oauth_paths = []
api_calls = { count = 0 }
secret_reads = []
stdout = { line_containing = [["aws", "ops-mfa", "ready", "MFA session valid for"], ["auth", "machine", "will_prompt"]] }
stdout_excludes = ["op://", "aws-ssm://", "Agent/machine-item", "{stored_access_token}"]

[[expect.runs]]
run = 0
sts_actions = ["GetSessionToken", "AssumeRole"]

[[expect.runs]]
run = 1
exit_code = 0
sts_actions = []
op_calls = 0
token_grants = []
oauth_paths = []
api_calls = { count = 0 }
stdout_excludes = ["op://", "aws-ssm://", "Agent/machine-item"]
stdout_json = { "/kind" = "status_ready", "/ready" = false, "/sources/0/kind" = "aws", "/sources/0/name" = "default", "/sources/0/state" = "ready", "/sources/1/name" = "dev", "/sources/1/state" = "ready", "/sources/2/name" = "ops-mfa", "/sources/2/state" = "ready", "/sources/2/expires_at" = "2030-01-01T12:00:00Z", "/sources/2/next_actions" = [], "/sources/3/kind" = "auth", "/sources/3/name" = "example", "/sources/3/state" = "ready", "/sources/4/name" = "github", "/sources/4/state" = "ready", "/sources/4/expires_at" = { contains = "T" }, "/sources/5/name" = "machine", "/sources/5/state" = "will_prompt", "/sources/5/reason" = { contains = "1Password" }, "/sources/6/name" = "renewing", "/sources/6/state" = "ready", "/sources/6/reason" = { contains = "refresh token" }, "/sources/7/kind" = "api", "/sources/7/name" = "github", "/sources/7/state" = "ready", "/sources/8/name" = "signed", "/sources/8/state" = "ready", "/sources/8/reason" = { contains = "through aws ops-mfa" }, "/sources/9/kind" = "db", "/sources/9/name" = "local", "/sources/9/state" = "ready", "/sources/10" = "<null>" }
