# `status --only aws` lists the AWS profiles and nothing else, and reads no
# credential to do it.
id = "status_only_aws_lists_the_aws_profiles_alone"
feature = "status"

[combination]
command = "status"
"status.only" = "aws"
source = "aws-profile"
output = "json"

[input]
args = ["status", "--only", "aws", "--json"]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"

[api.github]
base_url = "{server}/api"
auth = "github"
"""

[expect]
exit_code = 0
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
# The three profiles of the sandbox's ~/.aws/config, no auth or api row.
stdout_json = { "/0/name" = "default", "/0/kind" = "aws", "/1/name" = "dev", "/1/kind" = "aws", "/2/name" = "ops-mfa", "/2/kind" = "aws", "/3" = "<null>" }
no_files_written = true
