# The table, not `--json`: JSON mode keeps logs off stderr, and the debug
# lines are what show a read.
# `status --only data` prints no AWS or auth row, so it asks neither the MFA
# session cache nor the token store: with every keychain read refused, each
# read would name its entry at debug, and none is named.
id = "status_only_data_does_not_read_credential_stores"
feature = "status"

[combination]
command = "status"
"status.only" = "data"
session_cache = "not-read"
token = "not-read"

[input]
args = ["status", "--only", "data"]
env = { RUST_LOG = "kurama=debug" }
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"

[data.lake]
root_dir = "{repo}/tests/fixtures/data"
[[data.lake.sources]]
name = "ids"
path = "ids.csv"
"""

[fakes]
op = "enabled"
keychain_denied = -25293

[expect]
exit_code = 0
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
stdout = { line_containing = [["data", "lake", "not_checked"]], lines_start_with = ["  KIND", "  data"] }
stderr_lines_containing = { "keychain entry skipped" = 0, "macOS denied this build access" = 0 }
no_files_written = true
