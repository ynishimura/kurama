# `status --only data` lists the data workspaces and nothing else: no AWS
# profile, no auth source, and no input or credential is read.
id = "status_only_data_lists_the_workspaces_alone"
feature = "status"

[combination]
command = "status"
"status.only" = "data"
client = "data"
data_source = "workspace"
output = "json"

[input]
args = ["status", "--only", "data", "--json"]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"

[data.lake]
root_dir = "{repo}/tests/fixtures/data"
[[data.lake.sources]]
name = "ids"
path = "ids.csv"
"""

[expect]
exit_code = 0
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
stdout_json = { "/0/name" = "lake", "/0/kind" = "data", "/0/source_count" = 1, "/0/connection_status" = "not_checked", "/1" = "<null>" }
no_files_written = true
