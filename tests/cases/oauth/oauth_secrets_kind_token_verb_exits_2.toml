# A `kind = "secrets"` source has several values and no one credential:
# `token`, `console` and `--readonly` are refused before anything is read,
# and `login` has nothing to do.
id = "oauth_secrets_kind_token_verb_exits_2"
feature = "oauth"

[combination]
command = "token"
source = "secrets"
verb = "unsupported-for-kind"

[input]
args = ["token", "site"]
then_run = [["console", "site"], ["env", "site", "--readonly"], ["login", "site"]]
config = """
[auth.site]
kind = "secrets"
[auth.site.env]
SITE_PASS = "op://Agent/site/password"
"""

[fakes]
op = "enabled"

[expect]
op_calls = 0
sts_actions = []
token_grants = []
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "KIND_UNSUPPORTED", exit = 2 }
stderr_contains = ["kind secrets does not support token"]
stdout = { equals = "" }

[[expect.runs]]
run = 1
error = { code = "KIND_UNSUPPORTED", exit = 2 }
stderr_contains = ["kind secrets does not support console"]

[[expect.runs]]
run = 2
error = { code = "KIND_UNSUPPORTED", exit = 2 }
stderr_contains = ["kind secrets does not support --readonly"]

[[expect.runs]]
run = 3
exit_code = 0
stderr_contains = ["# Source 'site' uses secrets read on each use; there is nothing to log in to"]
