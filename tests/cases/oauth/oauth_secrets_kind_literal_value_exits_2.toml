# A value under `env` is a reference, never the secret: a literal would live
# in the configuration file and every backup of it. `config check` lists it
# with its line and `exec` refuses to start; neither prints the value.
id = "oauth_secrets_kind_literal_value_exits_2"
feature = "oauth"

[combination]
command = "config-check"
source = "secrets"
config = "rejected"

[input]
args = ["config", "check", "--json"]
then_run = [["exec", "site", "--", "/bin/sh", "-c", "echo child-ran"]]
replace_config = """
[auth.site]
kind = "secrets"
[auth.site.env]
SITE_USER = "op://Agent/site/username"
SITE_PASS = "hunter2-literal"
"""

[expect]
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_excludes = ["hunter2-literal"]
op_calls = 0
sts_actions = []
no_files_written = true

[[expect.runs]]
run = 0
json_error = { code = "CONFIG_INVALID", exit = 2 }
stdout_json = { "/valid" = false, "/diagnostics" = { length = 1 }, "/diagnostics/0/section" = "auth.site", "/diagnostics/0/message" = { contains = "env.SITE_PASS must be a secret reference" } }
stdout_excludes = ["hunter2-literal"]

[[expect.runs]]
run = 1
stdout = { equals = "" }
stderr_contains = ["[auth.site]", "env.SITE_PASS must be a secret reference", "op://"]
