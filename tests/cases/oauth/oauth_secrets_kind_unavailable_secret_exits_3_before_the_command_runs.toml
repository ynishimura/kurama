# 1Password is not signed in: the first reference that cannot be read fails
# the run with its SECRET_* code before the command starts, so no command
# ever runs with part of its environment.
id = "oauth_secrets_kind_unavailable_secret_exits_3_before_the_command_runs"
feature = "oauth"

[combination]
command = "exec"
source = "secrets"
secret = "op"
op = "not-signed-in"

[input]
args = ["exec", "site", "--", "/bin/sh", "-c", "echo child-ran"]
config = """
[auth.site]
kind = "secrets"
[auth.site.env]
SITE_USER = "op://Agent/site/username"
SITE_PASS = "op://Agent/site/password"
"""

[fakes]
op = "not-signed-in"

[expect]
error = { code = "SECRET_UNAVAILABLE", exit = 3 }
hint = "run `op signin`"
stdout = { equals = "" }
sts_actions = []
no_files_written = true
