# One `exec` of a `kind = "secrets"` source reads a reference of each store
# kurama knows: the ElevenLabs key from 1Password and the same key from
# Parameter Store (through the `kurama-sandbox` role). The command compares
# the two and prints only whether they match, so no value reaches stdout or
# a report. The fakes answer differently per store, so the fake run says
# `different`; the real run says `same`, which only two real reads of one
# key can.
id = "oauth_secrets_kind_real_exec_reads_onepassword_and_parameter_store"
feature = "oauth"

[combination]
command = "exec"
source = "secrets"
secret = "op"
stores = "op-and-aws-ssm"

[input]
args = ["exec", "keys", "--", "/bin/sh", "-c", "[ -n \"$KEY_OP\" ] && [ -n \"$KEY_SSM\" ] || exit 9; if [ \"$KEY_OP\" = \"$KEY_SSM\" ]; then echo same; else echo different; fi"]
config = """
[auth.keys]
kind = "secrets"
[auth.keys.env]
KEY_OP = "op://Agent/ELEVENLABS_ADMIN_API_KEY/credential"
KEY_SSM = "aws-ssm://dev/kurama/elevenlabs/api-key"
"""

[fakes]
op = "enabled"
aws_secrets = "from-id"

[expect]
exit_code = 0
stdout = { equals = "different\n" }
sts_actions = ["AssumeRole"]
secret_reads = [{ operation = "ssm:GetParameter", id = "/kurama/elevenlabs/api-key", region = "ap-northeast-1" }]
token_grants = []
no_files_written = true

[real]
requires = ["profile:kurama-sandbox", "keychain:OP_SERVICE_ACCOUNT_TOKEN"]
config = """
[auth.keys]
kind = "secrets"
[auth.keys.env]
KEY_OP = "op://Agent/ELEVENLABS_ADMIN_API_KEY/credential"
KEY_SSM = "aws-ssm://kurama-sandbox/kurama/elevenlabs/api-key"
"""

[real.combination]
target = "elevenlabs"
mfa = "onepassword"

[real.expect]
exit_code = 0
stdout = { equals = "same\n" }
