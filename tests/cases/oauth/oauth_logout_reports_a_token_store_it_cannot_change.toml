# Removing a token is what the user asked for, so failing it is an error.
id = "oauth_logout_reports_a_token_store_it_cannot_change"
feature = "oauth"

[combination]
command = "logout"
source = "oauth"
grant = "client_credentials"
token_store = "corrupt"

[input]
args = ["logout", "svc"]
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["read"]

[api.svc]
description = "Service API"
base_url = "{server}/api"
"""

[fakes]
op = "enabled"
corrupt_token_store = true

[expect]
error = { code = "TOKEN_STORE_ERROR", exit = 3 }
hint = "unlock the login keychain"
token_grants = []
