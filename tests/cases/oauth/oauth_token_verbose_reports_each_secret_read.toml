# -v on token, env and login says each time kurama went to a secret store,
# one line per read, the way `api -v` does -- never the value. Each run is its
# own process, so each reads once. Without -v nothing is said.
id = "oauth_token_verbose_reports_each_secret_read"
feature = "oauth"

[combination]
command = "token"
source = "token"
secret = "aws-ssm"
output = "verbose"

[input]
args = ["token", "example", "-v"]
then_run = [
  ["token", "vault", "--verbose"],
  ["env", "example", "-v"],
  ["login", "svc", "-v"],
  ["token", "example"],
]
config = """
[auth.example]
kind = "token"
token = "aws-ssm://dev/kurama/api-key"
header = "xi-api-key"

[auth.vault]
kind = "token"
token = "op://Agent/Example/credential"
header = "xi-api-key"

[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "aws-ssm://dev/kurama/client-secret"
scopes = ["read"]
"""

[fakes]
op = "enabled"
aws_secrets = "from-id"
token_store = true

[expect]
exit_code = 0
secret_reads = [
  { operation = "ssm:GetParameter", id = "/kurama/api-key", region = "ap-northeast-1" },
  { operation = "ssm:GetParameter", id = "/kurama/api-key", region = "ap-northeast-1" },
  { operation = "ssm:GetParameter", id = "/kurama/client-secret", region = "ap-northeast-1" },
  { operation = "ssm:GetParameter", id = "/kurama/api-key", region = "ap-northeast-1" },
]

[[expect.runs]]
run = 0
stdout = { equals = "parameter-of/kurama/api-key\n" }
stderr_lines_containing = { "< secret read:" = 1, "< secret read: ssm:GetParameter /kurama/api-key (ap-northeast-1)" = 1 }
stderr_excludes = ["parameter-of/kurama/api-key"]

[[expect.runs]]
run = 1
op_reads = ["item get Example --format json --vault Agent"]
stderr_lines_containing = { "< secret read:" = 1, "< secret read: op item get Example --vault Agent" = 1 }
stderr_excludes = ["{fake_client_secret}"]

[[expect.runs]]
run = 2
stdout = { contains = ["export KURAMA_TOKEN="] }
stderr_lines_containing = { "< secret read:" = 1, "< secret read: ssm:GetParameter /kurama/api-key (ap-northeast-1)" = 1 }
stderr_excludes = ["parameter-of/kurama/api-key"]

[[expect.runs]]
run = 3
token_grants = ["client_credentials"]
stderr_lines_containing = { "< secret read:" = 1, "< secret read: ssm:GetParameter /kurama/client-secret (ap-northeast-1)" = 1 }
stderr_excludes = ["parameter-of/kurama/client-secret"]

[[expect.runs]]
run = 4
stdout = { equals = "parameter-of/kurama/api-key\n" }
stderr_lines_containing = { "< secret read:" = 0 }
