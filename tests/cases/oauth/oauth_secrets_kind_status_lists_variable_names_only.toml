# `status` reports a `kind = "secrets"` source by its variable names and
# never reads a value: no 1Password call, no AWS call, and the row says the
# values were not checked.
id = "oauth_secrets_kind_status_lists_variable_names_only"
feature = "oauth"

[combination]
command = "status"
"status.only" = "auth"
source = "secrets"
resolution = "none"

[input]
args = ["status", "--only", "auth", "--json"]
then_run = [["status", "--only", "auth"]]
config = """
[auth.site]
kind = "secrets"
[auth.site.env]
SITE_USER = "op://Agent/site/username"
SITE_PASS = "aws-ssm://dev/site/pass"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
op_calls = 0
secret_reads = []
sts_actions = []
no_files_written = true
stdout_excludes = ["username-of-site", "fake-client-secret", "parameter-of"]

[[expect.runs]]
run = 0
stdout_json = { "/0/name" = "site", "/0/kind" = "auth", "/0/auth_kind" = "secrets", "/0/grant_type" = "<null>", "/0/header" = "<null>", "/0/env_var" = "<null>", "/0/env_vars/0" = "SITE_PASS", "/0/env_vars/1" = "SITE_USER", "/0/token" = "not_checked", "/0/needs_human" = false }

[[expect.runs]]
run = 1
stdout = { line_containing = [["site", "not_checked", "secrets env=SITE_PASS,SITE_USER"]] }
