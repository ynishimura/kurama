# token --json with no stored token and no terminal: exit 3 as one JSON error
# document whose retry waits for a person and whose hint names the login; an
# argument token does not take is ARGUMENT_INVALID, as JSON too.
id = "oauth_token_json_failure_asks_for_a_login_as_json"
feature = "oauth"

[combination]
command = "token"
output = "json"
source = "oauth"
grant = "authorization_code"
tty = "none"
token = "missing"

[input]
args = ["token", "github", "--json"]
then_run = [["token", "github", "--json", "--bogus"]]
env = { RUST_LOG = "trace" }
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"
"""

[expect]
json_error = { code = "ARGUMENT_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/category" = "usage", "/error/message" = "unknown argument --bogus; consult kurama token --help", "/error/hint" = "run `kurama token --help` to see the arguments it takes" }
oauth_paths = []
open_calls = []

[[expect.runs]]
run = 0
json_error = { code = "OAUTH_LOGIN_REQUIRED", exit = 3 }
stderr_lines = 1
stderr_json = { "/error/category" = "human", "/error/retry" = "after_human", "/error/hint" = "run `kurama login github` in a terminal" }
