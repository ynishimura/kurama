# A grant that needs a person, and no terminal: token, api and login all stop
# with exit code 3, empty stdout and no request, and the reason is printed once.
id = "oauth_without_terminal_exits_3_with_login_hint"
feature = "oauth"

[combination]
command = "token"
source = "oauth"
grant = "authorization_code"
tty = "none"
token = "missing"

[input]
args = ["token", "github"]
then_run = [["api", "github", "/user"], ["login", "github"]]
config = """
[auth.github]
kind = "oauth"
grant_type = "authorization_code"
auth_url = "{server}/oauth/authorize"
token_url = "{server}/oauth/token"
client_id = "gh-client"
scopes = ["repo"]
env_var = "GITHUB_TOKEN"

[api.github]
base_url = "{server}/api"
"""

[expect]
error = { code = "OAUTH_LOGIN_REQUIRED", exit = 3 }
hint = "run `kurama login github` in a terminal"
sts_actions = []
# Only the source lock is written; no token store, no secret.
files_written = ["home/.cache/kurama/locks/github.lock"]

[[expect.runs]]
run = 0
error = { code = "OAUTH_LOGIN_REQUIRED", exit = 3 }
oauth_paths = []
api_calls = { count = 0 }
open_calls = []
stderr_lines_start_with = ["error[", "hint:"]

[[expect.runs]]
run = 1
error = { code = "OAUTH_LOGIN_REQUIRED", exit = 3 }
oauth_paths = []
api_calls = { count = 0 }
open_calls = []
stderr_lines_start_with = ["error[", "hint:"]

[[expect.runs]]
run = 2
error = { code = "OAUTH_LOGIN_REQUIRED", exit = 3 }
oauth_paths = []
api_calls = { count = 0 }
open_calls = []
stderr_lines_start_with = ["error[", "hint:"]
