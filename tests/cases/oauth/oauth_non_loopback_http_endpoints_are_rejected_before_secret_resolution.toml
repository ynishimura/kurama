# Grant credentials never go over plain HTTP to a host that is not this
# machine: a remote http:// issuer or token_url is refused when the
# configuration is read, before the client secret is resolved or any request
# is sent. Loopback http:// stays allowed, which every other oauth scenario
# (the fake authorization server on 127.0.0.1) relies on.
id = "oauth_non_loopback_http_endpoints_are_rejected_before_secret_resolution"
feature = "oauth"

[combination]
command = "token"
source = "oauth"
config = "remote-http-endpoint"

[input]
args = ["config", "check", "--json"]
then_run = [["token", "remote-issuer"]]
config = """
[auth.remote-issuer]
kind = "oauth"
grant_type = "client_credentials"
issuer = "http://auth.example.com"
client_id = "issuer-client"
client_secret = "op://Agent/Issuer/client_secret"

[auth.remote-token]
kind = "oauth"
grant_type = "client_credentials"
token_url = "http://auth.example.com/oauth/token"
client_id = "token-client"
client_secret = "op://Agent/Token/client_secret"
"""

[fakes]
token_store = true

[expect]
op_calls = 0
token_grants = []
oauth_paths = []

[[expect.runs]]
run = 0
exit_code = 2
stdout_json = { "/valid" = false, "/diagnostics" = { length = 2 }, "/diagnostics/0/section" = "auth.remote-issuer", "/diagnostics/0/code" = "CONFIG_INVALID", "/diagnostics/0/message" = { contains = "issuer must be an https URL (http is allowed only for localhost or a loopback address), got 'http://auth.example.com'" }, "/diagnostics/1/section" = "auth.remote-token", "/diagnostics/1/code" = "CONFIG_INVALID", "/diagnostics/1/message" = { contains = "token_url must be an https URL (http is allowed only for localhost or a loopback address), got 'http://auth.example.com/oauth/token'" } }

[[expect.runs]]
run = 1
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["[auth.remote-issuer] issuer must be an https URL (http is allowed only for localhost or a loopback address), got 'http://auth.example.com'"]
