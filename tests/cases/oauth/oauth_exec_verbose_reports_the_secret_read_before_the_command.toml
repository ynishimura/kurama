# exec -v says the secret read on stderr and then replaces itself with the
# command, so the line is out before the command starts and the command's
# stdout is its own. Without -v nothing is said.
id = "oauth_exec_verbose_reports_the_secret_read_before_the_command"
feature = "oauth"

[combination]
command = "exec"
source = "token"
secret = "aws-ssm"
output = "verbose"

[input]
args = ["exec", "example", "-v", "--", "/bin/sh", "-c", "[ -n \"$KURAMA_TOKEN\" ] && echo child-ran"]
then_run = [
  ["exec", "example", "--", "/bin/sh", "-c", "[ -n \"$KURAMA_TOKEN\" ] && echo child-ran"],
]
config = """
[auth.example]
kind = "token"
token = "aws-ssm://dev/kurama/api-key"
header = "xi-api-key"
"""

[fakes]
aws_secrets = "from-id"

[expect]
exit_code = 0
no_files_written = true

[[expect.runs]]
run = 0
stdout = { equals = "child-ran\n" }
stderr_lines_containing = { "< secret read:" = 1, "< secret read: ssm:GetParameter /kurama/api-key (ap-northeast-1)" = 1 }
stderr_excludes = ["parameter-of/kurama/api-key"]

[[expect.runs]]
run = 1
stdout = { equals = "child-ran\n" }
stderr_lines_containing = { "< secret read:" = 0 }
