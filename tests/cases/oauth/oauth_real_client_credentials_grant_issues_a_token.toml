# A client_credentials grant needs no person: the client secret comes from
# 1Password, the token endpoint answers, and the API takes the bearer. The
# fake token endpoint and API see the grant and the header; the real side is
# the `[auth.kurama-real-oauth]` of the person's own configuration, a
# client_credentials source, whose real authorization server issues a token
# that is printed only as its fingerprint.
id = "oauth_real_client_credentials_grant_issues_a_token"
feature = "oauth"

[combination]
command = "api"
source = "oauth"
grant = "client_credentials"
secret = "op"

[input]
args = ["api", "svc", "/admin/apikey?size=1"]
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["openid"]

[api.svc]
base_url = "{server}/api"
"""

[fakes]
op = "enabled"
token_store = true
api = "ok"

[expect]
exit_code = 0
sts_actions = []
token_grants = ["client_credentials"]
op_reads = ["item get Service --format json --vault Agent"]
api_calls = { count = 1, authorization = "Bearer {granted_access_token}" }
files_written = ["home/.cache/kurama/locks/svc.lock", "token-store.json"]

[real]
requires = ["auth:kurama-real-oauth", "keychain:OP_SERVICE_ACCOUNT_TOKEN"]
args = ["token", "kurama-real-oauth", "--fingerprint"]

[real.combination]
target = "oauth-client-credentials"

[real.expect]
exit_code = 0
stdout = { starts_with = "sha256:" }
