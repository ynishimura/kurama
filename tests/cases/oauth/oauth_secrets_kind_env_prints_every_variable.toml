# `env` on a `kind = "secrets"` source: the export script clears every token
# variable, then exports each secret into its own variable, the source into
# KURAMA_AUTH and the variable names into KURAMA_AUTH_VAR; `--json` is
# refused, since no document carries them. The values are read from
# Parameter Store, whose fake answers after the parameter name.
id = "oauth_secrets_kind_env_prints_every_variable"
feature = "oauth"

[combination]
command = "env"
source = "secrets"
secret = "aws-ssm"

[input]
args = ["env", "site"]
then_run = [["env", "site", "--json"]]
config = """
[auth.site]
kind = "secrets"
[auth.site.env]
SITE_USER = "aws-ssm://dev/site/user"
SITE_PASS = "aws-ssm://dev/site/pass"
"""

[fakes]
aws_secrets = "from-id"

[expect]
op_calls = 0
# Every read is the export's: `--json` is refused before any.
secret_reads = [
  { operation = "ssm:GetParameter", id = "/site/pass", region = "ap-northeast-1" },
  { operation = "ssm:GetParameter", id = "/site/user", region = "ap-northeast-1" },
]
token_grants = []
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 0
stdout = { lines_start_with = ["export ", "unset "], contains = [
  "unset SITE_PASS",
  "unset SITE_USER",
  "unset KURAMA_AUTH_VAR",
  "export SITE_PASS='parameter-of/site/pass'",
  "export SITE_USER='parameter-of/site/user'",
  "export KURAMA_AUTH='site'",
  "export KURAMA_AUTH_VAR='SITE_PASS SITE_USER'",
] }
stderr_contains = ["# Secrets of 'site' exported into SITE_PASS SITE_USER"]

# --json is refused before any secret is read: the values are for `exec`.
[[expect.runs]]
run = 1
json_error = { code = "KIND_UNSUPPORTED", exit = 2 }
stderr_json = { "/error/message" = { contains = "kind secrets does not support env --json" } }
