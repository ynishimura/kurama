# Two fields of one 1Password item are one `op item get`, so one CLI run and
# one biometric prompt: the references go through the process's one secret
# resolver, which holds the item it read.
id = "oauth_secrets_kind_reads_two_fields_of_one_item_with_one_op_call"
feature = "oauth"

[combination]
command = "env"
source = "secrets"
secret = "op"
fields = "two-of-one-item"

[input]
args = ["env", "site"]
config = """
[auth.site]
kind = "secrets"
[auth.site.env]
SITE_USER = "op://Agent/site/username"
SITE_PASS = "op://Agent/site/password"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
op_reads = ["item get site --format json --vault Agent"]
op_calls = 1
sts_actions = []
no_files_written = true
stdout = { contains = ["export SITE_USER='username-of-site'", "export SITE_PASS='fake-client-secret'"] }
