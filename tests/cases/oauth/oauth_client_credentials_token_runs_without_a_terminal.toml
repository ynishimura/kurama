# A headless grant: the client secret comes from 1Password, the token is
# stored and reused, `status` reports it, and `login --force` grants again.
id = "oauth_client_credentials_token_runs_without_a_terminal"
feature = "oauth"

[combination]
command = "token"
source = "oauth"
grant = "client_credentials"
secret = "op"
tty = "none"

[input]
args = ["token", "svc"]
then_run = [["token", "svc", "--json"], ["status", "svc", "--json"], ["login", "svc", "--force"]]
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["read"]

[api.svc]
description = "Service API"
base_url = "{server}/api"
"""

[fakes]
op = "enabled"
token_store = true

[expect]
exit_code = 0
stdout = "plain-text"
token_grants = ["client_credentials"]
# Only the source lock and the test token store are written.
files_written = ["home/.cache/kurama/locks/svc.lock", "token-store.json"]

# The client secret from `op read` and the scopes reach the token endpoint;
# stdout is the bare access token.
[[expect.runs]]
run = 0
exit_code = 0
sts_actions = []
token_grants = ["client_credentials"]
op_reads = ["item get Service --format json --vault Agent"]
oauth_params = [{ call = 0, params = { client_id = "svc-client", client_secret = "{fake_client_secret}", scope = "read" } }]
stdout = { equals = "{granted_access_token}\n" }

# The stored token is reused without 1Password and printed as JSON.
[[expect.runs]]
run = 1
exit_code = 0
token_grants = []
op_calls = 0
stdout_json = { "/access_token" = "{granted_access_token}", "/token_type" = "bearer", "/expires_at" = "<string>" }

# status reports the auth source as logged in and the API with its state.
[[expect.runs]]
run = 2
token_grants = []
stdout_json = { "/0/kind" = "auth", "/0/name" = "svc", "/0/grant_type" = "client_credentials", "/0/logged_in" = true, "/0/needs_human" = false, "/1/kind" = "api", "/1/auth" = "svc", "/1/auth_status/token" = "valid", "/2" = "<null>" }

# login --force runs the grant again although the stored token is valid.
[[expect.runs]]
run = 3
exit_code = 0
token_grants = ["client_credentials"]
stdout = "empty"
stderr_contains = ["# Logged in: token for 'svc'"]
