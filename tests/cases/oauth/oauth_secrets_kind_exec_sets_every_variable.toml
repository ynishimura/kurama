# A `kind = "secrets"` source puts every configured secret into its own
# variable of the command `exec` runs: a login screen's username and
# password from one 1Password item, and the item's one-time password, which
# `op read` reads as an attribute. The fake answers each field after the
# item and the code after the item too, so the command's output says which
# reference each value came from. Nothing reaches a file, and -v names each
# read on stderr, never a value.
id = "oauth_secrets_kind_exec_sets_every_variable"
feature = "oauth"

[combination]
command = "exec"
source = "secrets"
secret = "op"

[input]
args = ["exec", "site", "--", "/bin/sh", "-c", "printf '%s|%s|%s|%s|%s\\n' \"$SITE_USER\" \"$SITE_PASS\" \"$SITE_OTP\" \"$KURAMA_AUTH\" \"$KURAMA_AUTH_VAR\""]
then_run = [
  ["exec", "site", "-v", "--", "/bin/sh", "-c", "echo child-ran"],
]
config = """
[auth.site]
kind = "secrets"
[auth.site.env]
SITE_USER = "op://Agent/site/username"
SITE_PASS = "op://Agent/site/password"
SITE_OTP = "op://Agent/site/one-time password?attribute=otp"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
sts_actions = []
token_grants = []
no_files_written = true

[[expect.runs]]
run = 0
stdout = { equals = "username-of-site|fake-client-secret|otp-of-site|site|SITE_OTP SITE_PASS SITE_USER\n" }
stderr_excludes = ["username-of-site", "fake-client-secret", "otp-of-site"]

[[expect.runs]]
run = 1
stdout = { equals = "child-ran\n" }
# Two reads, not three: the username and the password are one `op item get`.
stderr_lines_containing = { "< secret read:" = 2, "< secret read: op item get site --vault Agent" = 1, "< secret read: op read op://Agent/site/one-time password?attribute=otp" = 1 }
stderr_excludes = ["username-of-site", "fake-client-secret", "otp-of-site"]
