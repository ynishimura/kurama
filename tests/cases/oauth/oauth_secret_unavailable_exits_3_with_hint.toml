# 1Password is not signed in: a person has to act before the grant can run.
id = "oauth_secret_unavailable_exits_3_with_hint"
feature = "oauth"

[combination]
command = "token"
source = "oauth"
grant = "client_credentials"
secret = "op"
op = "not-signed-in"

[input]
args = ["token", "svc"]
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["read"]

[api.svc]
description = "Service API"
base_url = "{server}/api"
"""

[fakes]
op = "not-signed-in"
token_store = true

[expect]
error = { code = "SECRET_UNAVAILABLE", exit = 3 }
hint = "run `op signin`"
token_grants = []
