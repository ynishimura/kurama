# An `[api.*]` cannot authenticate with a `kind = "secrets"` source, whether
# it names the source in `auth` or shares its name: the values go to the
# environment of a command, so the request would leave without a credential.
# `config check` reports it when the file is read, before anything runs.
id = "oauth_secrets_kind_api_auth_exits_2"
feature = "oauth"

[combination]
command = "api"
source = "secrets"
config = "rejected"

[input]
args = ["api", "site", "/me"]
then_run = [["config", "check", "--json"]]
replace_config = """
[auth.site]
kind = "secrets"
[auth.site.env]
SITE_PASS = "op://Agent/site/password"

[api.site]
base_url = "https://site.example.com"
"""

[expect]
op_calls = 0
sts_actions = []
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["[auth.site] is kind = \"secrets\", which authenticates no request"]
api_calls = { count = 0 }

[[expect.runs]]
run = 1
json_error = { code = "CONFIG_INVALID", exit = 2 }
stdout_json = { "/valid" = false, "/diagnostics" = { length = 1 }, "/diagnostics/0/section" = "api.site", "/diagnostics/0/message" = { contains = "[auth.site] is kind = \"secrets\", which authenticates no request" } }
