# `unset` clears every variable a `kind = "secrets"` source exports, and the
# ones an earlier `env` recorded in KURAMA_AUTH_VAR that the configuration
# no longer names. Nothing is read to say which variables those are.
id = "oauth_secrets_kind_unset_lists_every_variable"
feature = "oauth"

[combination]
command = "unset"
source = "secrets"
auth_config = "changed-since-env"

[input]
args = ["unset"]
env = { KURAMA_AUTH = "site", KURAMA_AUTH_VAR = "OLD_USER OLD_PASS" }
config = """
[auth.site]
kind = "secrets"
[auth.site.env]
SITE_USER = "op://Agent/site/username"
SITE_PASS = "op://Agent/site/password"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
op_calls = 0
sts_actions = []
no_files_written = true
stdout = { lines_start_with = ["unset "], contains = [
  "unset SITE_PASS",
  "unset SITE_USER",
  "unset OLD_USER",
  "unset OLD_PASS",
  "unset KURAMA_AUTH",
  "unset KURAMA_AUTH_VAR",
] }
