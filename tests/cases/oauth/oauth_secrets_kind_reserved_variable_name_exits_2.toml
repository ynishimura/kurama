# A variable kurama sets itself (AWS_*, KURAMA_*), a name a shell cannot
# export, and an `env` table with nothing in it are each refused by
# `config check`, naming the section and the variable.
id = "oauth_secrets_kind_reserved_variable_name_exits_2"
feature = "oauth"

[combination]
command = "config-check"
source = "secrets"
config = "rejected"

[input]
args = ["config", "check", "--json"]
replace_config = """
[auth.aws]
kind = "secrets"
[auth.aws.env]
AWS_SECRET_ACCESS_KEY = "op://Agent/site/password"

[auth.own]
kind = "secrets"
[auth.own.env]
KURAMA_ENV_SCRIPT = "op://Agent/site/password"

[auth.lower]
kind = "secrets"
[auth.lower.env]
site_user = "op://Agent/site/username"

[auth.empty]
kind = "secrets"
[auth.empty.env]
"""

[expect]
json_error = { code = "CONFIG_INVALID", exit = 2 }
op_calls = 0
sts_actions = []
no_files_written = true
stdout_json = { "/valid" = false, "/diagnostics" = { length = 4 }, "/diagnostics/0/section" = "auth.aws", "/diagnostics/0/message" = { contains = "env.AWS_SECRET_ACCESS_KEY: variables starting with AWS_ are kurama's own" }, "/diagnostics/1/section" = "auth.own", "/diagnostics/1/message" = { contains = "env.KURAMA_ENV_SCRIPT: variables starting with KURAMA_ are kurama's own" }, "/diagnostics/2/section" = "auth.lower", "/diagnostics/2/message" = { contains = "env.site_user: a variable name is upper-case letters" }, "/diagnostics/3/section" = "auth.empty", "/diagnostics/3/message" = { contains = "env must name at least one variable" } }
