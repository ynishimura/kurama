# With a service account token both exported and in the keychain, `op` runs
# with the exported one: the fake echoes the token it got into the secret.
id = "onepassword_an_exported_token_wins_over_the_keychain"
feature = "onepassword-mfa"

[combination]
command = "token"
source = "oauth"
grant = "client_credentials"
secret = "op"
service_account = "environment-over-keychain"

[input]
args = ["token", "svc"]
service_account_keychain = "ops_from_the_keychain"
env = { OP_SERVICE_ACCOUNT_TOKEN = "ops_from_the_environment" }
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["read"]

[api.svc]
description = "Service API"
base_url = "{server}/api"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
token_grants = ["client_credentials"]
oauth_params = [{ call = 0, params = { client_secret = "fake-client-secret-for-ops_from_the_environment" } }]
