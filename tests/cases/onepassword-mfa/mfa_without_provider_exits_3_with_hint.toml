# MFA with no provider and no terminal cannot be answered: exit 3, no STS
# call, no `op` call.
id = "mfa_without_provider_exits_3_with_hint"
feature = "onepassword-mfa"

[combination]
command = "env"
source = "aws-profile"
mfa = "manual"
tty = "none"

[input]
args = ["env", "ops-mfa"]

[expect]
error = { code = "MFA_TOKEN_UNAVAILABLE", exit = 3 }
sts_actions = []
op_calls = 0
stderr_contains = ["Manual MFA token required for arn:aws:iam::123456789012:mfa/agent", "hint: enable [onepassword]"]
no_files_written = true
