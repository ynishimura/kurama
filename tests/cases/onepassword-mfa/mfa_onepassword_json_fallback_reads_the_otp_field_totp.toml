# When `op item get --otp` fails, the TOTP comes from the item's JSON, where
# 1Password keeps it the way the real CLI prints it: a field of `type = "OTP"`
# with no label, the `otpauth://` URI as its value and the current code in
# `totp`. The fake holds a different code there than `--otp` prints, so
# AssumeRole carrying it shows the fallback's answer is the one used, after
# one `--otp` attempt.
id = "mfa_onepassword_json_fallback_reads_the_otp_field_totp"
feature = "onepassword-mfa"

[combination]
command = "env"
source = "aws-profile"
mfa = "onepassword"
op = "otp-fails"

[input]
args = ["env", "ops-mfa"]

[fakes]
op = "otp-fails"

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
sts_calls = [{ action = "AssumeRole", serial_number = "arn:aws:iam::123456789012:mfa/agent", token_code = "{op_json_totp}", signing_access_key = "{op_access_key}" }]
op_calls_containing = { "--otp" = 1 }
stdout = "export-script"
no_files_written = true
