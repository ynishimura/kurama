# Nothing exported: the service account token `op` runs with can only have
# come from the keychain entry the config names.
id = "onepassword_service_account_token_comes_from_the_keychain"
feature = "onepassword-mfa"

[combination]
command = "token"
source = "oauth"
grant = "client_credentials"
secret = "op"
service_account = "keychain"

[input]
args = ["token", "svc"]
service_account_keychain = "ops_from_the_keychain"
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["read"]

[api.svc]
description = "Service API"
base_url = "{server}/api"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
token_grants = ["client_credentials"]
oauth_params = [{ call = 0, params = { client_secret = "fake-client-secret-for-ops_from_the_keychain" } }]
