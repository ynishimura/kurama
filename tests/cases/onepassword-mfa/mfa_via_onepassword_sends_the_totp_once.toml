# AssumeRole carries the MFA serial and the TOTP from 1Password, signed with
# the long-term key 1Password holds; 1Password is asked for the code once.
id = "mfa_via_onepassword_sends_the_totp_once"
feature = "onepassword-mfa"

[combination]
command = "env"
source = "aws-profile"
mfa = "onepassword"

[input]
args = ["env", "ops-mfa"]

[fakes]
op = "enabled"

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
sts_calls = [{ action = "AssumeRole", serial_number = "arn:aws:iam::123456789012:mfa/agent", token_code = "{op_totp}", signing_access_key = "{op_access_key}" }]
op_calls_containing = { "--otp" = 1 }
stdout = "export-script"
no_files_written = true
