# A named keychain entry that does not exist is said on stderr, and `op` runs
# without a token: the plain secret.
id = "onepassword_a_named_keychain_entry_that_is_absent_says_so_and_runs_on"
feature = "onepassword-mfa"

[combination]
command = "token"
source = "oauth"
grant = "client_credentials"
secret = "op"
service_account = "keychain-entry-absent"

[input]
args = ["token", "svc"]
service_account_keychain = "<absent>"
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["read"]

[api.svc]
description = "Service API"
base_url = "{server}/api"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
token_grants = ["client_credentials"]
stderr_contains = ["there is no such keychain entry"]
oauth_params = [{ call = 0, params = { client_secret = "{fake_client_secret}" } }]
