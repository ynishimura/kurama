# An exported but empty service account token is what a failed `security -w`
# in a shell profile leaves behind: `op` runs with the keychain entry instead,
# which the fake echoes into the secret.
id = "onepassword_empty_environment_token_falls_back_to_keychain"
feature = "onepassword-mfa"

[combination]
command = "token"
source = "oauth"
grant = "client_credentials"
secret = "op"
service_account = "empty-environment-falls-back-to-keychain"

[input]
args = ["token", "svc"]
service_account_keychain = "ops_from_the_keychain"
env = { OP_SERVICE_ACCOUNT_TOKEN = "" }
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["read"]

[api.svc]
description = "Service API"
base_url = "{server}/api"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
token_grants = ["client_credentials"]
oauth_params = [{ call = 0, params = { client_secret = "fake-client-secret-for-ops_from_the_keychain" } }]
