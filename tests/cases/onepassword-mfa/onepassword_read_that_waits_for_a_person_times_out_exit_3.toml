# An `op item get` of a secret that waits for a person is killed at the deadline: exit 3,
# the message whole (not wrapped in "could not run the 1Password CLI"), no
# token request, and only the source lock on disk.
id = "onepassword_read_that_waits_for_a_person_times_out_exit_3"
feature = "onepassword-mfa"

[combination]
command = "token"
source = "oauth"
grant = "client_credentials"
secret = "op"
op = "hangs"
tty = "none"

[input]
args = ["token", "svc"]
config = """
[auth.svc]
kind = "oauth"
grant_type = "client_credentials"
token_url = "{server}/oauth/token"
client_id = "svc-client"
client_secret = "op://Agent/Service/client_secret"
scopes = ["read"]

[api.svc]
description = "Service API"
base_url = "{server}/api"
"""

[fakes]
op = "hangs"

[expect]
error = { code = "SECRET_UNAVAILABLE", exit = 3 }
stderr_contains = ["for 'svc': op item get Service --format json --vault Agent gave up after 2s: nobody is at the terminal", "Export OP_SERVICE_ACCOUNT_TOKEN"]
op_calls = 1
token_grants = []
files_written = ["home/.cache/kurama/locks/svc.lock"]
