# An `op item get` that waits for a person is killed at the deadline, and the
# deadline is paid once: the JSON fallback never runs after a timeout.
id = "mfa_onepassword_that_waits_for_a_person_times_out_exit_3"
feature = "onepassword-mfa"

[combination]
command = "env"
source = "aws-profile"
mfa = "onepassword"
op = "hangs"

[input]
args = ["env", "ops-mfa"]

[fakes]
op = "hangs"

[expect]
error = { code = "MFA_PROVIDER_FAILED", exit = 3 }
stderr_contains = ["gave up after 2s"]
sts_actions = []
op_calls_containing = { "item get" = 1 }
