# The availability probe (`op --version`) goes through the same runner as a
# read, so a hanging probe cannot hang kurama: exit 3 before any STS call.
id = "onepassword_version_probe_that_waits_for_a_person_times_out_exit_3"
feature = "onepassword-mfa"

[combination]
command = "env"
source = "aws-profile"
mfa = "onepassword"
op = "version-hangs"

[input]
args = ["env", "ops-mfa"]

[fakes]
op = "version-hangs"

[expect]
error = { code = "MFA_TOKEN_UNAVAILABLE", exit = 3 }
sts_actions = []
