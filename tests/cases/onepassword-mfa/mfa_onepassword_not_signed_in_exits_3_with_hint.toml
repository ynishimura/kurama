# A 1Password CLI that is not signed in is exit 3 with the command to run.
id = "mfa_onepassword_not_signed_in_exits_3_with_hint"
feature = "onepassword-mfa"

[combination]
command = "env"
source = "aws-profile"
mfa = "onepassword"
op = "not-signed-in"

[input]
args = ["env", "ops-mfa"]

[fakes]
op = "not-signed-in"

[expect]
error = { code = "MFA_PROVIDER_FAILED", exit = 3 }
sts_actions = []
hint = "run `op signin`"
no_files_written = true
