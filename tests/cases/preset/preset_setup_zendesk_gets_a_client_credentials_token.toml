# Zendesk retires API tokens (no new ones from 2026-10-27, none work after
# 2027-04-30), so the preset is an OAuth client credentials grant against the
# account's own token endpoint, with the confidential client's secret in
# 1Password. No person authorizes that grant. The dry run resolves,
# contacts and writes nothing.
id = "preset_setup_zendesk_gets_a_client_credentials_token"
feature = "preset"

[combination]
command = "preset-setup"
output = "text"

[input]
args = ["preset", "setup", "zendesk", "--set", "client_id=kurama_cli", "--set", "client_secret=op://Agent/kurama-zendesk/client_secret", "--set", "subdomain=example", "--dry-run"]

[fakes]
op = "enabled"

[expect]
exit_code = 0
stdout = { starts_with = "# kurama preset setup zendesk ([api.zendesk])\nconfigure    planned       would add [auth.zendesk], [api.zendesk] to ", contains = ["kurama-config.toml:\n# kurama preset: zendesk (kurama ", "# setup: https://support.zendesk.com/hc/en-us/articles/4408845965210\n", "[auth.zendesk]\nkind = \"oauth\"\ngrant_type = \"client_credentials\"\ntoken_url = \"https://example.zendesk.com/oauth/tokens\"\nclient_id = \"kurama_cli\"\nclient_secret = \"op://Agent/kurama-zendesk/client_secret\"\nscopes = [\"read\"]\nenv_var = \"ZENDESK_ACCESS_TOKEN\"\n", "[api.zendesk]\ndescription = \"Zendesk Support API\"\nbase_url = \"https://example.zendesk.com\"\nauth = \"zendesk\"\nopenapi = \"https://developer.zendesk.com/zendesk/oas.yaml\"\n"] }
stderr_empty = true
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true
