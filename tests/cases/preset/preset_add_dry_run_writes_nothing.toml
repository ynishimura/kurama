# `--dry-run` prints the TOML `preset show` prints and says nothing was
# written; the file keeps its bytes and its mtime (the harness compares
# both). The JSON form is the save result with `applied` false.
id = "preset_add_dry_run_writes_nothing"
feature = "preset"

[combination]
command = "preset-add"
output = "dry-run"

[input]
args = ["preset", "add", "linear", "--set", "secret=op://Agent/kurama-linear/credential", "--dry-run"]
then_run = [["preset", "add", "linear", "--set", "secret=op://Agent/kurama-linear/credential", "--dry-run", "--json"]]
config = """
# mine
[core]
log_level = "info"
"""

[expect]
exit_code = 0
stderr_empty = true
stdout_json = { "/changed" = true, "/applied" = false, "/changes/0/section" = "auth.linear", "/changes/1/section" = "api.linear", "/changes" = { length = 2 } }
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 0
stdout = { starts_with = "# kurama preset: linear (kurama ", contains = ["[auth.linear]\nkind = \"token\"\ntoken = \"op://Agent/kurama-linear/credential\"\n", "[api.linear]\ndescription = \"Linear GraphQL API\"\nbase_url = \"https://api.linear.app\"\nauth = \"linear\"\n"] }
stderr_contains = ["# dry run: [auth.linear], [api.linear] would be added to ", "nothing was written", "#   1. Append the sections to ", "#        kurama preset add linear --set secret=op://Agent/kurama-linear/credential\n#   2. Call the API:"]
