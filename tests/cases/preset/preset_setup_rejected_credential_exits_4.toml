# Configured but not connected: the API refuses the credential, and the
# first read fails with the status and exit code a rejection has in
# `kurama api`, after the steps that did work are reported as done.
id = "preset_setup_rejected_credential_exits_4"
feature = "preset"

[combination]
command = "preset-setup"
preset = "github"
api_response = "unauthorized"
setup_stop = "first_read"

[input]
args = ["preset", "setup", "github"]
config = """
[auth.github]
kind = "token"
token = "aws-ssm://dev/kurama/github-token"

[api.github]
base_url = "{server}/api"
"""

[fakes]
aws_secrets = "from-id"
api = "unauthorized"

[expect]
error = { code = "API_HTTP_ERROR", exit = 4 }
stderr_contains = ["HTTP 401 Unauthorized"]
api_calls = { count = 1, calls = [{ method = "GET", path = "/api/user", authorization = "Bearer parameter-of/kurama/github-token" }] }
stdout = { contains = [
  "configure    done ",
  "credential   done ",
  "first_read   failed        GET /user failed: error[API_HTTP_ERROR]",
] }
