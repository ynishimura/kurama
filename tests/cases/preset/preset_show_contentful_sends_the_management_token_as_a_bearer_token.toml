# Contentful's Content Management API takes a personal access token as a
# Bearer token in Authorization, kurama's default. Nothing is resolved or
# contacted.
id = "preset_show_contentful_sends_the_management_token_as_a_bearer_token"
feature = "preset"

[combination]
command = "preset-show"
output = "text"

[input]
args = ["preset", "show", "contentful", "--set", "secret=op://Agent/kurama-contentful/credential"]

[fakes]
op = "enabled"

[expect]
exit_code = 0
stdout = { starts_with = "# kurama preset: contentful (kurama ", contains = ["[auth.contentful]\nkind = \"token\"\ntoken = \"op://Agent/kurama-contentful/credential\"\nenv_var = \"CONTENTFUL_MANAGEMENT_TOKEN\"\n", "[api.contentful]\ndescription = \"Contentful Content Management API\"\nbase_url = \"https://api.contentful.com\"\nauth = \"contentful\"\n"] }
stderr_contains = ["# Setup for contentful", "https://app.contentful.com/account/profile/cma_tokens", "--title kurama-contentful", "kurama api contentful /users/me"]
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true
