# `--as` names the [api.*] only: the auth keeps the preset's name and the API
# points at it, in the TOML and in the JSON alike.
id = "preset_setup_as_renames_only_the_api_and_keeps_the_auth_name"
feature = "preset"

[combination]
command = "preset-setup"
output = "json"

[input]
args = ["preset", "setup", "google-sheets", "--as", "sheets-work", "--set", "client_id=id-1", "--set", "client_secret=op://Agent/kurama-google/client_secret", "--dry-run"]
then_run = [["preset", "setup", "google-sheets", "--as", "sheets-work", "--set", "client_id=id-1", "--set", "client_secret=op://Agent/kurama-google/client_secret", "--dry-run", "--json"]]

[expect]
exit_code = 0
stderr_empty = true
stdout_json = { "/preset" = "google-sheets", "/api" = "sheets-work", "/auth/name" = "google", "/auth/action" = "add", "/toml" = { contains = ["# setup: https://console.cloud.google.com/apis/credentials\n", "[api.sheets-work]\n", "auth = \"google\"\n"] }, "/warnings" = { length = 0 } }
op_calls = 0
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 0
stdout = { starts_with = "# kurama preset setup google-sheets ([api.sheets-work])\nconfigure    planned       would add [auth.google], [api.sheets-work] to ", contains = ["[auth.google]\nkind = \"oauth\"\ngrant_type = \"authorization_code\"\nissuer = \"https://accounts.google.com\"\nclient_id = \"id-1\"\nclient_secret = \"op://Agent/kurama-google/client_secret\"\nscopes = [\"https://www.googleapis.com/auth/spreadsheets.readonly\"]\nredirect_port = 8080\n", "[api.sheets-work]\ndescription = \"Google Sheets API v4\"\nbase_url = \"https://sheets.googleapis.com\"\nauth = \"google\"\ndiscovery = \"https://sheets.googleapis.com/$discovery/rest?version=v4\"\n"] }
stdout_excludes = ["auth.sheets-work", "[api.google-sheets]"]
