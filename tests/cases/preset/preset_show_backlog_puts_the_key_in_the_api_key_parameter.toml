# Backlog takes its API key in the `apiKey` query parameter, on the space's
# own host (backlog.com or backlog.jp). Nothing is resolved or contacted.
id = "preset_show_backlog_puts_the_key_in_the_api_key_parameter"
feature = "preset"

[combination]
command = "preset-show"
output = "text"

[input]
args = ["preset", "show", "backlog", "--set", "secret=op://Agent/kurama-backlog/credential", "--set", "host=example.backlog.com"]

[fakes]
op = "enabled"

[expect]
exit_code = 0
stdout = { starts_with = "# kurama preset: backlog (kurama ", contains = ["[auth.backlog]\nkind = \"token\"\ntoken = \"op://Agent/kurama-backlog/credential\"\nquery = \"apiKey\"\nenv_var = \"BACKLOG_API_KEY\"\n", "[api.backlog]\ndescription = \"Backlog API\"\nbase_url = \"https://example.backlog.com/api/v2\"\nauth = \"backlog\"\n"] }
stderr_contains = ["# Setup for backlog", "https://support.nulab.com/hc/en-us/articles/8591094281113", "--title kurama-backlog", "kurama api backlog /users/myself"]
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true
