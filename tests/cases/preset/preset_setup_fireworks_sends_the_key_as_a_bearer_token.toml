# Fireworks AI serves an OpenAI-compatible API under /inference/v1 and takes
# its key as a Bearer token in Authorization, kurama's default. The dry run
# resolves, contacts and writes nothing.
id = "preset_setup_fireworks_sends_the_key_as_a_bearer_token"
feature = "preset"

[combination]
command = "preset-setup"
output = "text"

[input]
args = ["preset", "setup", "fireworks", "--set", "secret=op://Agent/kurama-fireworks/credential", "--dry-run"]

[fakes]
op = "enabled"

[expect]
exit_code = 0
stdout = { starts_with = "# kurama preset setup fireworks ([api.fireworks])\nconfigure    planned       would add [auth.fireworks], [api.fireworks] to ", contains = ["kurama-config.toml:\n# kurama preset: fireworks (kurama ", "# setup: https://app.fireworks.ai/settings/users/api-keys\n", "[auth.fireworks]\nkind = \"token\"\ntoken = \"op://Agent/kurama-fireworks/credential\"\nenv_var = \"FIREWORKS_API_KEY\"\n", "[api.fireworks]\ndescription = \"Fireworks AI inference API\"\nbase_url = \"https://api.fireworks.ai/inference/v1\"\nauth = \"fireworks\"\n"] }
stderr_empty = true
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true
