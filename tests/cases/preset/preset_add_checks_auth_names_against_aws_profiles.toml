# The auth and AWS profile names are one namespace, the API names are not:
# an API named like an AWS profile (`--as dev`) is added, while an auth the
# preset would add under an AWS profile's name is refused naming both, with
# --auth-as and no --as in the hint, and --as does not get past it. The check
# applies to the `--auth-as` name: `--auth-as dev` is refused, and another
# name is added.
id = "preset_add_checks_auth_names_against_aws_profiles"
feature = "preset"

[combination]
command = "preset-add"
auth = "aws-profile-name"

[input]
args = ["preset", "add", "github", "--as", "dev", "--set", "secret=op://Agent/kurama-github/credential"]
then_run = [
  ["preset", "add", "linear", "--set", "secret=op://Agent/kurama-linear/credential"],
  ["preset", "add", "linear", "--as", "linear-work", "--set", "secret=op://Agent/kurama-linear/credential", "--json"],
  ["preset", "add", "linear", "--auth-as", "dev", "--set", "secret=op://Agent/kurama-linear/credential"],
  ["preset", "add", "linear", "--auth-as", "linear-key", "--set", "secret=op://Agent/kurama-linear/credential"],
]
aws_config = """
[default]
region = us-east-1

[profile dev]
region = us-east-1

[profile linear]
region = us-east-1
"""

[expect]
exit_code = 0
stdout = "empty"
stderr_contains = ["# added [auth.linear-key], [api.linear] to "]
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
files_written = ["kurama-config.toml"]

[[expect.runs]]
run = 0
exit_code = 0
stdout = "empty"
stderr_contains = ["# added [auth.github], [api.dev] to "]

[[expect.runs]]
run = 1
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["[auth.linear] has the same name as the AWS profile 'linear'"]
hint = "give the auth another name with --auth-as <name>, or rename that AWS profile in ~/.aws/config; the file was not changed"
stderr_excludes = ["--as"]
stdout = "empty"

[[expect.runs]]
run = 2
json_error = { code = "CONFIG_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = "[auth.linear] has the same name as the AWS profile 'linear' in ~/.aws/config" }
stderr_excludes = ["--as "]
stdout = "empty"

[[expect.runs]]
run = 3
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["[auth.dev] has the same name as the AWS profile 'dev'"]
stdout = "empty"
