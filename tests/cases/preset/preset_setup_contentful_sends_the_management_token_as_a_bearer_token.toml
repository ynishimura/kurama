# Contentful's Content Management API takes a personal access token as a
# Bearer token in Authorization, kurama's default. The dry run resolves,
# contacts and writes nothing.
id = "preset_setup_contentful_sends_the_management_token_as_a_bearer_token"
feature = "preset"

[combination]
command = "preset-setup"
output = "text"

[input]
args = ["preset", "setup", "contentful", "--set", "secret=op://Agent/kurama-contentful/credential", "--dry-run"]

[fakes]
op = "enabled"

[expect]
exit_code = 0
stdout = { starts_with = "# kurama preset setup contentful ([api.contentful])\nconfigure    planned       would add [auth.contentful], [api.contentful] to ", contains = ["kurama-config.toml:\n# kurama preset: contentful (kurama ", "# setup: https://app.contentful.com/account/profile/cma_tokens\n", "[auth.contentful]\nkind = \"token\"\ntoken = \"op://Agent/kurama-contentful/credential\"\nenv_var = \"CONTENTFUL_MANAGEMENT_TOKEN\"\n", "[api.contentful]\ndescription = \"Contentful Content Management API\"\nbase_url = \"https://api.contentful.com\"\nauth = \"contentful\"\n"] }
stderr_empty = true
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true
