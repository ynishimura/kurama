# With the secret's reference, setup appends the sections, checks them,
# writes kurama's Skill for Claude Code and tries the first read. 1Password
# is not signed in, so the read stops before any request with the error a
# locked 1Password has everywhere in kurama: configured is shown apart from
# connected, and the hint says what to do.
id = "preset_setup_adds_the_sections_and_names_a_locked_1password"
feature = "preset"

[combination]
command = "preset-setup"
preset = "github"
op = "not-signed-in"
setup_stop = "first_read"

[input]
args = ["preset", "setup", "github", "--set", "secret=op://Agent/kurama-github/credential"]
config = """
[core]
log_level = "info"
"""

[fakes]
op = "not-signed-in"

[expect]
error = { code = "SECRET_UNAVAILABLE", exit = 3 }
hint = "run `op signin`"
api_calls = { count = 0 }
sts_actions = []
files_written = ["home/.claude/skills/kurama/SKILL.md", "kurama-config.toml"]
stdout = { contains = [
  "configure    done          added [auth.github], [api.github] to ",
  "check        done          config.toml loads; [api.github] uses [auth.github]",
  "credential   done ",
  "agent        done          wrote kurama's Skill for Claude Code: ",
  "first_read   failed        GET /user failed: error[SECRET_UNAVAILABLE]",
  "next: run `op signin`",
  "# not complete",
] }
