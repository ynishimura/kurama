# A secret input that is the value itself, not a reference, is refused by
# its key before anything else is judged -- even beside an [auth.linear] the
# preset would reuse, which is not blamed -- and the value is echoed
# nowhere, neither in the error nor in the report; the file is not touched.
id = "preset_setup_refuses_a_literal_secret_exits_2"
feature = "preset"

[combination]
command = "preset-setup"
input = "literal-secret"

[input]
args = ["preset", "setup", "linear", "--as", "l2", "--set", "secret=lin_api_literal987", "--offline"]
then_run = [["preset", "setup", "google-sheets", "--set", "client_id=id", "--set", "client_secret=GOCSPX-literal-987", "--offline", "--json"]]
config = """
[auth.linear]
kind = "token"
token = "op://Agent/kurama-linear/credential"
format = "{token}"
env_var = "LINEAR_API_KEY"
"""

[expect]
json_error = { code = "ARGUMENT_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = "--set client_secret must be a secret reference, not the value itself; the value is not shown" }
stderr_excludes = ["GOCSPX-literal-987"]
stdout_json = { "/steps/0/state" = "failed", "/steps/0/detail" = "error[ARGUMENT_INVALID]" }
stdout_excludes = ["GOCSPX-literal-987"]
op_calls = 0
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "ARGUMENT_INVALID", exit = 2, message = "--set secret must be a secret reference, not the value itself; the value is not shown" }
hint = "give op://<vault>/<item>/<field>, aws-secrets://<aws-profile>/<secret-id> or aws-ssm://<aws-profile>/<parameter-name>, or leave the secret out when the file's [auth.*] is reused; the file was not changed"
stderr_excludes = ["lin_api_literal987", "cannot be reused", "[auth.*] in the file"]
stdout = { contains = ["configure    failed        error[ARGUMENT_INVALID]\n"] }
stdout_excludes = ["lin_api_literal987", "cannot be reused"]
