# An input nobody gave, or one the preset does not take, is the arguments'
# mistake and not the file's: ARGUMENT_INVALID, in the text line and in the
# JSON error document, with the same exit code 2.
id = "preset_setup_missing_input_is_an_argument_error"
feature = "preset"

[combination]
command = "preset-setup"
input = "missing"

[input]
args = ["preset", "setup", "jira", "--set", "bogus=1", "--dry-run"]
then_run = [["preset", "setup", "jira", "--set", "secret=op://Agent/kurama-jira/credential", "--dry-run", "--json"]]

[expect]
json_error = { code = "ARGUMENT_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = "preset jira needs site, email; give each with --set <key>=<value>" }
stdout_json = { "/steps/0/state" = "needs_action", "/steps/0/detail" = "preset jira needs site, email" }
op_calls = 0
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "ARGUMENT_INVALID", exit = 2, message = "preset jira takes no input bogus; it takes secret, site, email" }
stdout = { contains = ["configure    failed        error[ARGUMENT_INVALID]\n"] }
