# An input the sections need and nobody gave is refused with every missing
# key, and no placeholder is printed as configuration. The setup steps still
# come first: they say how to get the inputs.
id = "preset_show_missing_input_exits_2_lists_the_keys"
feature = "preset"

[combination]
command = "preset-show"
input = "missing"

[input]
args = ["preset", "show", "google-sheets"]
then_run = [["preset", "show", "google-sheets", "--set", "client_id=abc", "--json"]]

[expect]
json_error = { code = "ARGUMENT_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = "preset google-sheets needs client_secret; give each with --set <key>=<value>", "/error/hint" = "`kurama preset --json` lists each preset's inputs and its setup page; without --json, `kurama preset show <ID>` prints the setup steps on stderr" }
stdout = "empty"
op_calls = 0
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "ARGUMENT_INVALID", exit = 2, message = "preset google-sheets needs client_id, client_secret; give each with --set <key>=<value>" }
hint = "`kurama preset --json` lists each preset's inputs and its setup page; without --json, `kurama preset show <ID>` prints the setup steps on stderr"
stderr_contains = ["# Setup for google-sheets", "Enable the Google Sheets API", "--set 'client_id=<client-id>' --set 'client_secret=op://<vault>/kurama-google/client_secret'"]
stdout = "empty"
