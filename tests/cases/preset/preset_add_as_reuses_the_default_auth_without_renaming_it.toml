# `--as` names the API only: `preset add google-sheets --as sheets-work`
# adds [api.sheets-work] with auth = "google", reuses the [auth.google] the
# file has, and adds no [auth.sheets-work]; the next steps call the API by
# its new name.
id = "preset_add_as_reuses_the_default_auth_without_renaming_it"
feature = "preset"

[combination]
command = "preset-add"
rename = "as"

[input]
args = ["preset", "add", "google-sheets", "--as", "sheets-work"]
then_run = [["config", "show", "api.sheets-work", "--json"], ["config", "list", "--json"]]
config = """
[auth.google]
kind = "oauth"
grant_type = "authorization_code"
issuer = "https://accounts.google.com"
client_id = "id-1"
client_secret = "op://Agent/kurama-google/client_secret"
scopes = ["https://www.googleapis.com/auth/spreadsheets.readonly"]
redirect_port = 8080

[api.google-sheets]
base_url = "https://sheets.googleapis.com/v4"
auth = "google"
"""

[expect]
exit_code = 0
stdout_json = { "/sections/2/name" = "auth.google", "/sections/3/name" = "api.google-sheets", "/sections/4/name" = "api.sheets-work", "/sections" = { length = 5 } }
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
files_written = ["kurama-config.toml"]

[[expect.runs]]
run = 0
exit_code = 0
stdout = "empty"
stderr_contains = ["# [auth.google] is already in the file; the API reuses it", "# added [api.sheets-work] to ", "kurama api sheets-work sheets.spreadsheets.get -P spreadsheetId=<spreadsheet-id>"]
stderr_excludes = ["auth.sheets-work", "# warning", "kurama login"]

[[expect.runs]]
run = 1
exit_code = 0
stdout_json = { "/key" = "api.sheets-work", "/value/auth" = "google", "/value/base_url" = "https://sheets.googleapis.com", "/value/discovery" = "https://sheets.googleapis.com/$discovery/rest?version=v4" }
