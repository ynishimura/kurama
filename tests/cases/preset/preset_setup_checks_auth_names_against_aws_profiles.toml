# The auth and AWS profile names are one namespace, the API names are not:
# an API named like an AWS profile (`--as dev`) is added, while an auth the
# preset would add under an AWS profile's name stops `configure` naming both,
# with --auth-as and no --as in the hint, and --as does not get past it. The
# check applies to the `--auth-as` name: `--auth-as dev` is refused, and
# another name is added.
id = "preset_setup_checks_auth_names_against_aws_profiles"
feature = "preset"

[combination]
command = "preset-setup"
auth = "aws-profile-name"

[input]
args = ["preset", "setup", "github", "--as", "dev", "--set", "secret=op://Agent/kurama-github/credential", "--offline"]
then_run = [
  ["preset", "setup", "linear", "--set", "secret=op://Agent/kurama-linear/credential", "--offline"],
  ["preset", "setup", "linear", "--as", "linear-work", "--set", "secret=op://Agent/kurama-linear/credential", "--offline", "--json"],
  ["preset", "setup", "linear", "--auth-as", "dev", "--set", "secret=op://Agent/kurama-linear/credential", "--offline"],
  ["preset", "setup", "linear", "--auth-as", "linear-key", "--set", "secret=op://Agent/kurama-linear/credential", "--offline"],
]
aws_config = """
[default]
region = us-east-1

[profile dev]
region = us-east-1

[profile linear]
region = us-east-1
"""

[expect]
exit_code = 0
stderr_empty = true
stdout = { contains = ["configure    done          added [auth.linear-key], [api.linear] to "] }
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
files_written = ["home/.claude/skills/kurama/SKILL.md", "kurama-config.toml"]

[[expect.runs]]
run = 0
exit_code = 0
stderr_empty = true
stdout = { contains = ["configure    done          added [auth.github], [api.dev] to "] }

[[expect.runs]]
run = 1
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["[auth.linear] has the same name as the AWS profile 'linear'"]
hint = "give the auth another name with --auth-as <name>, or rename that AWS profile in ~/.aws/config; the file was not changed"
stderr_excludes = ["--as"]
stdout = { contains = ["configure    failed        error[CONFIG_INVALID]", "agent        skipped       an earlier step stopped the run"] }
stdout_excludes = ["--as"]

[[expect.runs]]
run = 2
json_error = { code = "CONFIG_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = "[auth.linear] has the same name as the AWS profile 'linear' in ~/.aws/config" }
stderr_excludes = ["--as "]
stdout_json = { "/api" = "linear-work", "/steps/0/step" = "configure", "/steps/0/state" = "failed", "/steps/0/detail" = "error[CONFIG_INVALID]", "/toml" = "<null>" }

[[expect.runs]]
run = 3
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["[auth.dev] has the same name as the AWS profile 'dev'"]
stdout = { contains = ["configure    failed        error[CONFIG_INVALID]"] }
