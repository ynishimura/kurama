# Slack's Web API takes a bot token as a Bearer token in Authorization,
# kurama's default. Its published description was archived in 2021, so the
# preset names none. Nothing is resolved or contacted.
id = "preset_show_slack_sends_the_bot_token_as_a_bearer_token"
feature = "preset"

[combination]
command = "preset-show"
output = "text"

[input]
args = ["preset", "show", "slack", "--set", "secret=op://Agent/kurama-slack/credential"]

[fakes]
op = "enabled"

[expect]
exit_code = 0
stdout = { starts_with = "# kurama preset: slack (kurama ", contains = ["[auth.slack]\nkind = \"token\"\ntoken = \"op://Agent/kurama-slack/credential\"\nenv_var = \"SLACK_BOT_TOKEN\"\n", "[api.slack]\ndescription = \"Slack Web API\"\nbase_url = \"https://slack.com/api\"\nauth = \"slack\"\n"] }
stderr_contains = ["# Setup for slack", "https://api.slack.com/apps", "--title kurama-slack", "kurama api slack /auth.test"]
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true
