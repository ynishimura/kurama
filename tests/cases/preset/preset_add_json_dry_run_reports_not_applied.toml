# `preset add --dry-run --json` is the same document as the saved run with
# `applied` false and the append still first among the next steps, so the
# two cannot be mistaken for each other; the file is not touched, and
# `config list` still shows only what was there.
id = "preset_add_json_dry_run_reports_not_applied"
feature = "preset"

[combination]
command = "preset-add"
output = "dry-run"

[input]
args = ["preset", "add", "openai", "--set", "secret=op://Agent/kurama-openai/credential", "--dry-run", "--json"]
then_run = [["config", "list", "--json"]]
replace_config = """
[core]
log_level = "info"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
stderr_empty = true
stdout_json = { "/sections" = [{ name = "core", keys = ["log_level"] }] }
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
exit_code = 0
stderr_empty = true
stdout_json = { "" = { length = 6 }, "/path" = { contains = "/kurama-config.toml" }, "/changed" = true, "/applied" = false, "/changes" = [{ section = "auth.openai", action = "add" }, { section = "api.openai", action = "add" }], "/warnings" = [], "/next_steps" = { length = 2 }, "/next_steps/0" = { contains = ["Append the sections to ", "/kurama-config.toml:\nkurama preset add openai --set secret=op://Agent/kurama-openai/credential"] }, "/next_steps/1" = "Call the API:\nkurama api openai /models" }
