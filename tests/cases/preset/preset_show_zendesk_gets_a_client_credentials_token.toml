# Zendesk retires API tokens (no new ones from 2026-10-27, none work after
# 2027-04-30), so the preset is an OAuth client credentials grant against the
# account's own token endpoint, with the confidential client's secret in
# 1Password. No person authorizes that grant, so the next steps go straight
# from appending the sections to calling the API. Nothing is resolved or
# contacted.
id = "preset_show_zendesk_gets_a_client_credentials_token"
feature = "preset"

[combination]
command = "preset-show"
output = "text"

[input]
args = ["preset", "show", "zendesk", "--set", "client_id=kurama_cli", "--set", "client_secret=op://Agent/kurama-zendesk/client_secret", "--set", "subdomain=example"]

[fakes]
op = "enabled"

[expect]
exit_code = 0
stdout = { starts_with = "# kurama preset: zendesk (kurama ", contains = ["[auth.zendesk]\nkind = \"oauth\"\ngrant_type = \"client_credentials\"\ntoken_url = \"https://example.zendesk.com/oauth/tokens\"\nclient_id = \"kurama_cli\"\nclient_secret = \"op://Agent/kurama-zendesk/client_secret\"\nscopes = [\"read\"]\nenv_var = \"ZENDESK_ACCESS_TOKEN\"\n", "[api.zendesk]\ndescription = \"Zendesk Support API\"\nbase_url = \"https://example.zendesk.com\"\nauth = \"zendesk\"\nopenapi = \"https://developer.zendesk.com/zendesk/oas.yaml\"\n"] }
stderr_contains = ["# Setup for zendesk", "https://support.zendesk.com/hc/en-us/articles/4408845965210", "Confidential", "--title kurama-zendesk", "client_secret[password]=", "kurama api zendesk /api/v2/users/me"]
stderr_excludes = ["Authorize kurama", "kurama login"]
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true
