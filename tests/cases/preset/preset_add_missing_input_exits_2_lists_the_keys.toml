# An input the sections need and nobody gave is refused with every missing
# key; no placeholder is written as configuration and the file is not
# touched.
id = "preset_add_missing_input_exits_2_lists_the_keys"
feature = "preset"

[combination]
command = "preset-add"
input = "missing"

[input]
args = ["preset", "add", "google-sheets"]
then_run = [["preset", "add", "google-sheets", "--set", "client_id=abc", "--json"]]
config = """
[core]
log_level = "info"
"""

[expect]
json_error = { code = "ARGUMENT_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = "preset google-sheets needs client_secret; give each with --set <key>=<value>" }
stdout = "empty"
op_calls = 0
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "ARGUMENT_INVALID", exit = 2, message = "preset google-sheets needs client_id, client_secret; give each with --set <key>=<value>" }
hint = "`kurama preset --json` lists each preset's inputs and its setup page; without --json, `kurama preset show <ID>` prints the setup steps on stderr"
stderr_excludes = ["REPLACE_ME", "# added"]
stdout = "empty"
