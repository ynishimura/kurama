# The first read of `preset setup` is a request like `kurama api`'s: an
# agent's run is held to the [agent] policy before any credential is read,
# and is recorded in the audit log. Here the policy refuses the path, so no
# secret is read and nothing is sent.
id = "preset_setup_agent_run_is_held_to_the_agent_policy"
feature = "preset"

[combination]
command = "preset-setup"
preset = "github"
agent = "deny-paths"
setup_stop = "first_read"

[input]
args = ["preset", "setup", "github"]
env = { KURAMA_AGENT = "1" }
config = """
[agent]
deny_paths = ["/api/user"]

[auth.github]
kind = "token"
token = "aws-ssm://dev/kurama/github-token"

[api.github]
base_url = "{server}/api"
"""

[fakes]
aws_secrets = "from-id"
api = "ok"

[expect]
error = { code = "AGENT_POLICY_DENIED", exit = 3 }
api_calls = { count = 0 }
secret_reads = []
files_written = ["home/.claude/skills/kurama/SKILL.md", "home/.local/state/kurama/audit.jsonl"]
stdout = { contains = ["first_read   failed        GET /user failed: error[AGENT_POLICY_DENIED]"] }
