# The setup commands carry `--set` values and the vault as one shell word
# each: a value with `;` or a space, pasted into a shell, stays the value and
# runs nothing, and the `<vault>` placeholder is not a redirection. The
# commands are the `next` of a `configure` that still needs the secret; with
# it, the value is the TOML string as given. A vault name with a space is the
# unit test of the same name (the harness owns the `[onepassword]` section).
id = "preset_setup_commands_shell_quote_dynamic_values"
feature = "preset"

[combination]
command = "preset-setup"
output = "text"

[input]
args = ["preset", "setup", "jira", "--set", "site=example", "--set", "email=me; touch /tmp/pwned", "--dry-run"]
then_run = [["preset", "setup", "jira", "--set", "secret=op://Agent/kurama-jira/credential", "--set", "site=example", "--set", "email=me; touch /tmp/pwned", "--dry-run"]]

[expect]
exit_code = 0
stdout = { contains = ["username = \"me; touch /tmp/pwned\"\n"] }
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "ARGUMENT_INVALID", exit = 2 }
stdout = { contains = ["--vault '<vault>' --title kurama-jira ", "kurama preset setup jira --set 'secret=op://<vault>/kurama-jira/credential' --set site=example --set 'email=me; touch /tmp/pwned'\n"] }
