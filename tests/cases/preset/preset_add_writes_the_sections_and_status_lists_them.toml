# `preset add` appends the preset's auth and API to the file in one write:
# the text form says what it added and what is left to do, the JSON form is
# the save result `config add` prints, and `status` lists both sources and
# both APIs from the saved file. Only the config file is written, and
# nothing is resolved or contacted on the way.
id = "preset_add_writes_the_sections_and_status_lists_them"
feature = "preset"

[combination]
command = "preset-add"
output = "json"

[input]
args = ["preset", "add", "linear", "--set", "secret=op://Agent/kurama-linear/credential"]
then_run = [
  ["preset", "add", "github", "--set", "secret=op://Agent/kurama-github/credential", "--json"],
  ["status", "--only", "auth", "--json"],
  ["status", "--only", "api", "--json"],
]
config = """
[core]
log_level = "info"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
stdout_json = { "/0/name" = "github", "/0/kind" = "api", "/0/auth" = "github", "/0/base_url" = "https://api.github.com", "/1/name" = "linear", "/1/auth" = "linear", "/1/base_url" = "https://api.linear.app", "" = { length = 2 } }
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
files_written = ["kurama-config.toml"]

[[expect.runs]]
run = 0
exit_code = 0
stdout = "empty"
stderr_contains = ["# added [auth.linear], [api.linear] to ", "/kurama-config.toml", "# Next steps for linear", "kurama api linear /graphql"]
stderr_excludes = ["op item create", "kurama preset add"]

[[expect.runs]]
run = 1
exit_code = 0
stderr_empty = true
stdout_json = { "/changed" = true, "/applied" = true, "/changes/0/section" = "auth.github", "/changes/0/action" = "add", "/changes/1/section" = "api.github", "/changes/1/action" = "add", "/changes" = { length = 2 }, "/warnings" = { length = 0 }, "/path" = { contains = "/kurama-config.toml" }, "/next_steps" = { length = 1 }, "/next_steps/0" = { contains = "kurama api github /user" } }

[[expect.runs]]
run = 2
exit_code = 0
stdout_json = { "/0/name" = "github", "/0/kind" = "auth", "/0/auth_kind" = "token", "/0/env_var" = "GITHUB_TOKEN", "/1/name" = "linear", "/1/auth_kind" = "token", "/1/env_var" = "LINEAR_API_KEY", "" = { length = 2 } }
