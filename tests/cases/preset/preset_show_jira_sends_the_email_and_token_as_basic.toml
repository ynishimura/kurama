# Jira Cloud takes HTTP Basic with the account's email as the username and
# an API token as the password, on the site's own host. Nothing is resolved
# or contacted.
id = "preset_show_jira_sends_the_email_and_token_as_basic"
feature = "preset"

[combination]
command = "preset-show"
output = "text"

[input]
args = ["preset", "show", "jira", "--set", "secret=op://Agent/kurama-jira/credential", "--set", "site=example", "--set", "email=me@example.com"]

[fakes]
op = "enabled"

[expect]
exit_code = 0
stdout = { starts_with = "# kurama preset: jira (kurama ", contains = ["[auth.jira]\nkind = \"token\"\ntoken = \"op://Agent/kurama-jira/credential\"\nusername = \"me@example.com\"\nenv_var = \"JIRA_API_TOKEN\"\n", "[api.jira]\ndescription = \"Jira Cloud REST API\"\nbase_url = \"https://example.atlassian.net\"\nauth = \"jira\"\nopenapi = \"https://developer.atlassian.com/cloud/jira/platform/swagger-v3.v3.json\"\n"] }
stderr_contains = ["# Setup for jira", "https://id.atlassian.com/manage-profile/security/api-tokens", "--title kurama-jira", "kurama api jira /rest/api/3/myself"]
sts_actions = []
op_calls = 0
secret_reads = []
api_calls = { count = 0 }
no_files_written = true
