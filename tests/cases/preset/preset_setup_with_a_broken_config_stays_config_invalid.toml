# A config.toml that does not load is the file's problem whatever the
# arguments: CONFIG_INVALID, exit 2, and the hint, which the configure step
# repeats as its next action, points at the file.
id = "preset_setup_with_a_broken_config_stays_config_invalid"
feature = "preset"

[combination]
command = "preset-setup"
config = "invalid"

[input]
args = ["preset", "setup", "linear", "--set", "secret=op://Agent/kurama-linear/credential", "--dry-run"]
config = """
[api.broken]
base_url = 3
"""

[expect]
error = { code = "CONFIG_INVALID", exit = 2 }
stderr_contains = ["hint: fix ", "kurama-config.toml (KURAMA_CONFIG_PATH overrides the location)"]
stdout = { contains = ["configure    failed        error[CONFIG_INVALID]\n", "next: fix ", "check        skipped "] }
stdout_excludes = ["# would append"]
op_calls = 0
api_calls = { count = 0 }
no_files_written = true
