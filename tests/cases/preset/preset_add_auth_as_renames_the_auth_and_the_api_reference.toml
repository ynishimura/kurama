# `--auth-as` gets past an [auth.github] whose contract is not the preset's
# without touching it: `preset add github --as gh-pat --auth-as gh-pat` writes
# [auth.gh-pat] and [api.gh-pat] with auth = "gh-pat", keeps the preset's
# env_var, and the API then calls with the token that auth reads.
id = "preset_add_auth_as_renames_the_auth_and_the_api_reference"
feature = "preset"

[combination]
command = "preset-add"
rename = "auth-as"

[input]
args = ["preset", "add", "github", "--as", "gh-pat", "--auth-as", "gh-pat", "--set", "secret=op://Agent/kurama-github/credential"]
then_run = [
  ["config", "show", "auth.gh-pat", "--json"],
  ["config", "show", "api.gh-pat", "--json"],
  ["config", "show", "auth.github", "--json"],
  ["config", "set", "api.gh-pat.base_url", "\"{server}/api\""],
  ["api", "gh-pat", "/user"],
]
config = """
[auth.github]
kind = "oauth"
grant_type = "device_code"
token_url = "https://github.com/login/oauth/access_token"
device_auth_url = "https://github.com/login/device/code"
client_id = "Iv1.x"
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
api_calls = { count = 1, authorization = "Bearer {fake_client_secret}", calls = [{ method = "GET", path = "/api/user" }] }
sts_actions = []
token_grants = []
files_written = ["kurama-config.toml"]

[[expect.runs]]
run = 0
exit_code = 0
stdout = "empty"
stderr_contains = ["# added [auth.gh-pat], [api.gh-pat] to ", "kurama api gh-pat /user"]
stderr_excludes = ["[auth.github]", "reuses it"]

[[expect.runs]]
run = 1
exit_code = 0
stdout_json = { "/key" = "auth.gh-pat", "/value/kind" = "token", "/value/token" = "op://Agent/kurama-github/credential", "/value/env_var" = "GITHUB_TOKEN" }

[[expect.runs]]
run = 2
exit_code = 0
stdout_json = { "/key" = "api.gh-pat", "/value/auth" = "gh-pat", "/value/base_url" = "https://api.github.com" }

[[expect.runs]]
run = 3
exit_code = 0
stdout_json = { "/key" = "auth.github", "/value/kind" = "oauth", "/value/client_id" = "Iv1.x" }
