# An [api.*] name the file already has is refused before anything is
# written, with a hint that names --as; the same preset under another name
# with --as is added beside it.
id = "preset_add_refuses_an_existing_name_exits_2"
feature = "preset"

[combination]
command = "preset-add"
config = "rejected"

[input]
args = ["preset", "add", "linear", "--set", "secret=op://Agent/kurama-linear/credential"]
then_run = [["preset", "add", "linear", "--set", "secret=op://Agent/kurama-linear/credential", "--json"]]
config = """
[api.linear]
base_url = "https://old.example.com"
"""

[expect]
json_error = { code = "ARGUMENT_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = { contains = "[api.linear] is already in " }, "/error/hint" = "give the new API another name with --as <name>" }
stdout = "empty"
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "ARGUMENT_INVALID", exit = 2 }
stderr_contains = ["[api.linear] is already in ", "/kurama-config.toml"]
hint = "give the new API another name with --as <name>"
stderr_excludes = ["# added", "# Next steps"]
stdout = "empty"
