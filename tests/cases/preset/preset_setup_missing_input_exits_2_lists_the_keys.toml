# An input the sections need and nobody gave stops `configure` with every
# missing key; no placeholder is written as configuration, the file is not
# touched and no later step runs, so no Skill is written either.
id = "preset_setup_missing_input_exits_2_lists_the_keys"
feature = "preset"

[combination]
command = "preset-setup"
input = "missing"

[input]
args = ["preset", "setup", "google-sheets", "--offline"]
then_run = [["preset", "setup", "google-sheets", "--set", "client_id=abc", "--offline", "--json"]]
config = """
[core]
log_level = "info"
"""

[expect]
json_error = { code = "ARGUMENT_INVALID", exit = 2 }
stderr_lines = 1
stderr_json = { "/error/message" = "preset google-sheets needs client_secret; give each with --set <key>=<value>" }
stdout_json = { "/steps/0/state" = "needs_action", "/steps/0/detail" = "preset google-sheets needs client_secret", "/steps/3/step" = "agent", "/steps/3/state" = "skipped", "/toml" = "<null>" }
op_calls = 0
api_calls = { count = 0 }
no_files_written = true

[[expect.runs]]
run = 0
error = { code = "ARGUMENT_INVALID", exit = 2, message = "preset google-sheets needs client_id, client_secret; give each with --set <key>=<value>" }
hint = "`kurama preset --json` lists each preset's inputs and its setup page; the `next` of `kurama preset setup <ID>`'s configure step says how to make the missing ones"
stdout = { contains = ["configure    needs_action  preset google-sheets needs client_id, client_secret\n", "agent        skipped       an earlier step stopped the run\n"] }
stdout_excludes = ["REPLACE_ME", "[auth.google]\n", "added"]
