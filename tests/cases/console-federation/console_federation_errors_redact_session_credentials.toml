# The federation endpoint answers 200 with a body that is not JSON. The
# request URL carries the role credentials in its `Session` parameter, so
# the decode error is reported without it: FEDERATION_FAILED and the reason
# stay, the access key, secret key and session token do not reach stderr.
id = "console_federation_errors_redact_session_credentials"
feature = "console-federation"

[combination]
command = "console"
source = "aws-profile"
role = "assume-role"
federation = "invalid-response"

[input]
args = ["console", "dev"]

[fakes]
browser = true
federation_invalid_json = true

[expect]
error = { code = "FEDERATION_FAILED", exit = 4 }
sts_actions = ["AssumeRole"]
federation_calls = [{ action = "getSigninToken", session_access_key = "{result_access_key}" }]
open_calls = []
stderr_contains = ["Invalid response: error decoding response body"]
stderr_excludes = ["{result_access_key}", "{result_secret_key}", "{result_session_token}", "getSigninToken"]
no_files_written = true
