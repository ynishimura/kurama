# The federation endpoint cannot be reached. The request URL carries the
# role credentials in its `Session` parameter, so the send error is reported
# without it: FEDERATION_FAILED and the reason stay, the access key, secret
# key and session token do not reach stderr.
id = "console_federation_unreachable_endpoint_redacts_session_credentials"
feature = "console-federation"

[combination]
command = "console"
source = "aws-profile"
role = "assume-role"
federation = "unreachable"

[input]
args = ["console", "dev"]
env = { KURAMA_FEDERATION_ENDPOINT = "http://127.0.0.1:9/federation" }

[fakes]
browser = true

[expect]
error = { code = "FEDERATION_FAILED", exit = 4 }
sts_actions = ["AssumeRole"]
open_calls = []
stderr_contains = ["Network error: error sending request"]
stderr_excludes = ["{result_access_key}", "{result_secret_key}", "{result_session_token}", "getSigninToken"]
no_files_written = true
