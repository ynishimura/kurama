# A profile without role_arn has no role to assume: exit 2, no STS call.
id = "profile_loading_without_role_arn_exits_2_with_error_code"
feature = "profile-loading"

[combination]
command = "env"
source = "aws-profile"
profile = "no-role-arn"

[input]
args = ["env", "default"]

[expect]
error = { code = "PROFILE_INVALID", exit = 2 }
sts_actions = []
stderr_contains = ["Role ARN not found in profile"]
no_files_written = true
