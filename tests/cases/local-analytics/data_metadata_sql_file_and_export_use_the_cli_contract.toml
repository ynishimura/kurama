# Metadata, projection, summary, explain, a SQL file, a request file and an
# export all speak the one CLI contract; the export is the only file
# published, is readable as an input, and a second export to the same path
# is refused and leaves it readable.
id = "data_metadata_sql_file_and_export_use_the_cli_contract"
feature = "local-analytics"

[combination]
command = "data"
client = "data"
data_op = "export"
data_source = "workspace"
format = "csv"

[input]
args = ["data", "local", "--tables", "--json"]
config = """
[data.local]
root_dir = "{repo}/tests/fixtures/data"
[[data.local.sources]]
name = "data"
path = "orders.csv"
types = { customer_id = "VARCHAR", amount = "DECIMAL(18,2)" }
"""
home_files = { "query.sql" = "SELECT sum(amount) AS total FROM data", "request.json" = '{"operation":"query","args":{"sql":"SELECT sum(amount) AS total FROM data"}}' }
then_run = [
  ["data", "local", "--describe", "data", "--json"],
  ["data", "local", "--preview", "data", "--columns", "customer_id", "--json"],
  ["data", "local", "--summary", "data", "--json"],
  ["data", "local", "--file", "{home}/query.sql", "--explain", "--json"],
  ["data", "local", "--request", "{home}/request.json", "--json"],
  ["data", "local", "--file", "{home}/query.sql", "--export", "{home}/export.parquet", "--json"],
  ["data", "--from", "{home}/export.parquet", "--query", "SELECT total FROM data", "--json"],
  ["data", "local", "--file", "{home}/query.sql", "--export", "{home}/export.parquet", "--json"],
  ["data", "--from", "{home}/export.parquet", "--query", "SELECT total FROM data", "--json"],
]

[expect]
exit_code = 0
stderr_empty = true
stdout_json = { "/rows" = [["33.00"]] }
sts_actions = []
op_calls = 0
files_written = ["home/export.parquet"]

[[expect.runs]]
run = 0
exit_code = 0
stderr_empty = true
stdout_json = { "/rows" = [["data"]] }

[[expect.runs]]
run = 1
exit_code = 0
stderr_empty = true
stdout_json = { "/rows/0/0" = "customer_id", "/rows/1/1" = "DECIMAL(18,2)" }

[[expect.runs]]
run = 2
exit_code = 0
stderr_empty = true
stdout_json = { "/columns" = { length = 1 }, "/rows/0/0" = "001" }

[[expect.runs]]
run = 3
exit_code = 0
stderr_empty = true
stdout_json = { "/row_count" = 3, "/columns/0/name" = "column_name", "/columns/1/name" = "column_type", "/rows/1/0" = "amount", "/rows/1/1" = "DECIMAL(18,2)", "/rows/1/2" = "2.25", "/rows/1/3" = "20.50" }

[[expect.runs]]
run = 4
exit_code = 0
stderr_empty = true
stdout_json = { "/operation" = "explain", "/rows" = { min_length = 1 } }

[[expect.runs]]
run = 5
exit_code = 0
stderr_empty = true
stdout_json = { "/rows" = [["33.00"]] }

[[expect.runs]]
run = 6
exit_code = 0
stderr_empty = true
stdout_json = { "/export/bytes" = 274 }

[[expect.runs]]
run = 7
exit_code = 0
stderr_empty = true
stdout_json = { "/rows" = [["33.00"]] }

[[expect.runs]]
run = 8
json_error = { code = "DATA_INVALID", exit = 2 }
