# A dry run is static and status makes no connection claim: neither reads an
# input or a credential; both status commands align an unquoted workspace in
# the common table.
id = "data_dry_run_and_status_read_no_inputs_or_credentials"
feature = "local-analytics"

[combination]
command = "status"
"status.kind" = "data"
client = "data"
data_op = "dry-run"
data_source = "workspace"
format = "parquet"

[input]
args = ["data", "lake", "--dry-run", "--json"]
config = """
[s3.assets]
aws_profile = "dev"
region = "ap-northeast-1"
[data.lake]
root_dir = "{repo}/tests/fixtures/data"
s3_source = "assets"
[[data.lake.sources]]
name = "orders"
path = "s3://data-bucket/orders.parquet"
[[data.lake.sources]]
name = "customers"
path = "missing.csv"
types = {customer_id="VARCHAR"}
"""
then_run = [
  ["status", "--kind", "data", "--json"],
  ["status", "--kind", "data"],
  ["status"],
]

[expect]
exit_code = 0
sts_actions = []
op_calls = 0
oauth_paths = []
open_calls = []
api_calls = { count = 0 }
no_files_written = true
stdout = { line_words = [["data", "lake", "not_checked", "duckdb", "sources=2"]], aligned_under = [["PROFILE", "lake"], ["SESSION", "not_checked"], ["DETAIL", "duckdb"]] }

[[expect.runs]]
run = 0
exit_code = 0
sts_actions = []
op_calls = 0
oauth_paths = []
open_calls = []
api_calls = { count = 0 }
stdout_json = { "/dry_run" = true, "/engine" = "<null>", "/elapsed_ms" = "<null>" }

[[expect.runs]]
run = 1
exit_code = 0
sts_actions = []
op_calls = 0
oauth_paths = []
open_calls = []
api_calls = { count = 0 }
[expect.runs.stdout_json]
"/0/kind" = "data"
"/0/name" = "lake"
"/0/source_count" = 2
"/0/aws_profile" = "dev"
"/0/region" = "ap-northeast-1"
"/0/sources/0/path" = "s3://data-bucket/orders.parquet"
"/0/sources/1/path" = "missing.csv"
"/0/connection_status" = "not_checked"
"/0/auth_status" = "<null>"

[[expect.runs]]
run = 2
exit_code = 0
sts_actions = []
op_calls = 0
oauth_paths = []
open_calls = []
api_calls = { count = 0 }
stdout = { line_words = [["data", "lake", "not_checked", "duckdb", "sources=2"]], aligned_under = [["PROFILE", "lake"], ["SESSION", "not_checked"], ["DETAIL", "duckdb"]] }
