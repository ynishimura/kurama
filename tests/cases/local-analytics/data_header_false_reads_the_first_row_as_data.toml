# `--header false` makes the first CSV row data: the column is unnamed and
# the row count includes it, and the plan records the choice.
id = "data_header_false_reads_the_first_row_as_data"
feature = "local-analytics"

[combination]
command = "data"
client = "data"
data_op = "preview"
data_source = "local"
format = "csv"
"data.header" = "false"

[input]
args = ["data", "{repo}/tests/fixtures/data/ids.csv", "--header", "false", "--preview", "--max-rows", "200", "--json"]

[expect]
exit_code = 0
stdout_json = { "/columns/0/name" = "column0", "/row_count" = 121, "/rows/0/0" = "id", "/rows/1/0" = "0", "/meta/sources/0/header" = false }
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
no_files_written = true
