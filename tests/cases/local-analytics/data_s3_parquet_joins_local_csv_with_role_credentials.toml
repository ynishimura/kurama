# A workspace joins a Parquet object on S3 with a local CSV: complete exact
# aggregates, no LIST for a known key, a Range GET with only the role
# credentials, and no progress or log on JSON stderr.
id = "data_s3_parquet_joins_local_csv_with_role_credentials"
feature = "local-analytics"

[combination]
command = "data"
source = "aws-profile"
client = "data"
data_op = "query"
data_source = "workspace"
format = "parquet"
role = "assume-role"
region = "profile"

[input]
args = ["data", "lake", "--query", "SELECT c.region, sum(o.amount) AS sales FROM orders o JOIN customers c USING (customer_id) GROUP BY c.region ORDER BY c.region", "--json"]
env = { RUST_LOG = "trace" }
config = """
[s3.assets]
aws_profile = "dev"
[data.lake]
root_dir = "{repo}/tests/fixtures/data"
s3_source = "assets"
[[data.lake.sources]]
name = "orders"
path = "s3://data-bucket/orders.parquet"
[[data.lake.sources]]
name = "customers"
path = "customers.csv"
types = {customer_id="VARCHAR"}
"""

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
op_calls = 0
stdout_json = { "/rows" = [["East", "46.50"], ["West", "50.50"]], "/truncated" = false }
api_calls = { count = 5, sigv4 = { service = "s3", region = "ap-northeast-1" }, calls = [
  { method = "HEAD", path = "/data-bucket/orders.parquet" },
  { method = "HEAD", path = "/data-bucket/orders.parquet" },
  { method = "GET", path = "/data-bucket/orders.parquet", headers_include = ["range"] },
  { method = "HEAD", path = "/data-bucket/orders.parquet" },
  { method = "HEAD", path = "/data-bucket/orders.parquet" },
] }
stderr_empty = true
no_files_written = true
