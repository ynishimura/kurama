# A bucket in the profile's own Region is read where the profile signs: no
# correction, every request signed for that Region. The fake layer reads the
# fixture bucket's Parquet object; the throwaway layer reads the CSV twin from
# the bucket tests/s3/s3.yaml creates in the profile's Region.
id = "data_throwaway_s3_same_region_bucket_is_read"
feature = "local-analytics"

[combination]
command = "data"
source = "aws-profile"
client = "data"
data_op = "query"
data_source = "s3"
format = "parquet"
role = "assume-role"
region = "profile"

[input]
args = ["data", "--from", "s3://data-bucket/orders.parquet", "--aws-profile", "dev", "--query", "SELECT count(*) AS rows FROM data", "--json"]

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
op_calls = 0
stdout_json = { "/rows" = [["3"]], "/meta/region" = "ap-northeast-1" }
api_signed = { service = "s3", region = "ap-northeast-1" }
no_files_written = true

[throwaway]
stacks = ["s3-data"]
args = ["data", "--from", "s3://{s3_bucket_same_region}/orders.csv", "--aws-profile", "{throwaway_profile}", "--query", "SELECT count(*) AS rows FROM data", "--json"]

[throwaway.combination]
format = "csv"

[throwaway.expect]
exit_code = 0
stdout_json = { "/rows" = [["3"]], "/meta/region" = "{s3_same_region}" }
no_files_written = true
