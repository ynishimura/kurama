# A presigned-looking https URL is normalized to its object, read with the
# profile's role credentials in the profile's region, and its query string
# is nowhere in the output.
id = "data_https_input_uses_role_credentials_and_redacts_query"
feature = "local-analytics"

[combination]
command = "data"
source = "aws-profile"
client = "data"
data_op = "preview"
data_source = "https"
format = "jsonl"
role = "assume-role"
region = "profile"

[input]
args = ["data", "--request", "-", "--json"]
stdin = '{"operation":"preview","args":{"from":"https://data-bucket.s3.amazonaws.com/events.jsonl?AWSAccessKeyId=SYNTHETIC_KEY&Signature=SYNTHETIC_SIGNATURE&x-amz-security-token=SYNTHETIC_TOKEN","aws_profile":"dev"}}'

[expect]
exit_code = 0
sts_actions = ["AssumeRole"]
op_calls = 0
api_calls = { count = 5, sigv4 = { service = "s3", region = "ap-northeast-1" }, calls = [
  { path = "/data-bucket/events.jsonl" },
  { path = "/data-bucket/events.jsonl" },
  { path = "/data-bucket/events.jsonl" },
  { path = "/data-bucket/events.jsonl" },
  { path = "/data-bucket/events.jsonl" },
] }
stdout_json = { "/row_count" = 3, "/meta/sources/0/path" = "s3://data-bucket/events.jsonl" }
stdout_excludes = ["SYNTHETIC_"]
stderr_empty = true
no_files_written = true
