# A user that authenticates with IAM: `status` and a plan assume no role,
# and the read assumes the profile's role once, signs the token locally and
# sends it to nobody -- 1Password gives the source credentials and is asked
# for no password. The server is not there, so the read is unreachable.
id = "db_iam_signs_its_token_locally_and_reads_no_password"
feature = "database"

[combination]
command = "status"
client = "db"
"status.kind" = "db"
engine = "postgresql"
tls = "verify-ca"
auth = "iam"
db_op = "tables"

[input]
args = ["status", "--kind", "db", "--json"]
then_run = [
  ["db", "iam", "--dry-run", "--json"],
  ["db", "iam", "--tables", "--json"],
]
config = """
[db.iam]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "iam_reader"
tls = "verify-ca"
connect_timeout_secs = 2

[db.iam.iam]
aws_profile = "dev"
"""

[fakes]
op = "enabled"

[expect]
json_error = { code = "DB_UNREACHABLE", exit = 1 }
sts_actions = ["AssumeRole"]
api_calls = { count = 0 }
no_files_written = true
# The one item read is the access key of the AWS profile, and no secret.
op_reads = ["item get aws-agent --format json"]

[[expect.runs]]
run = 0
exit_code = 0
sts_actions = []
op_calls = 0

[[expect.runs]]
run = 1
exit_code = 0
sts_actions = []
op_calls = 0
stdout_json = { "/dry_run" = true }
