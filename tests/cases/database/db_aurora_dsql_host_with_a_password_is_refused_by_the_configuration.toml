# An Aurora DSQL host takes IAM only: a section that gives it a password is
# refused as `CONFIG_INVALID`, and the password is never read.
id = "db_aurora_dsql_host_with_a_password_is_refused_by_the_configuration"
feature = "database"

[combination]
command = "db"
client = "db"
engine = "postgresql"
auth = "password"
db_op = "tables"

[input]
args = ["db", "cluster", "--tables", "--json"]
config = """
[db.cluster]
engine = "postgresql"
host = "abcdefghijklmnopqrst.dsql.us-east-1.on.aws"
database = "postgres"
username = "admin"
password = "op://Agent/db/password"
"""

[fakes]
op = "enabled"

[expect]
json_error = { code = "CONFIG_INVALID", exit = 2 }
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
no_files_written = true
stderr_contains = ["[db.cluster] an Aurora DSQL host takes engine"]
