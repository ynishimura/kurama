# A server that does not answer is `DB_UNREACHABLE` once its password was
# read: a connection that never opened sent no statement, so a read may be
# retried, and there is no server error to report.
id = "db_server_that_does_not_answer_is_unreachable_after_its_secret_is_read"
feature = "database"

[combination]
command = "db"
client = "db"
engine = "postgresql"
tls = "disable"
auth = "password"
db_op = "tables"

[input]
args = ["db", "remote", "--tables", "--json"]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "op://Agent/db/password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
op = "enabled"

[expect]
json_error = { code = "DB_UNREACHABLE", exit = 1 }
sts_actions = []
op_calls = 1
api_calls = { count = 0 }
no_files_written = true
stderr_json = { "/error/retry" = "read_only_retry", "/error/category" = "tool", "/error/hint" = { contains = "no statement was sent" }, "/error/server" = "<null>" }
