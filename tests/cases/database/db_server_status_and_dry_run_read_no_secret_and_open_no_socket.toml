# A server database is listed by `status` and planned by `--dry-run` without
# its password being read or a socket opened: the server is not there, and
# nothing notices.
id = "db_server_status_and_dry_run_read_no_secret_and_open_no_socket"
feature = "database"

[combination]
command = "status"
client = "db"
"status.kind" = "db"
engine = "postgresql"
tls = "disable"
auth = "password"
db_op = "dry-run"

[input]
args = ["status", "--kind", "db", "--json"]
then_run = [["db", "remote", "--dry-run", "--json"]]
config = """
[db.remote]
engine = "postgresql"
host = "127.0.0.1"
port = 1
database = "app"
username = "reader"
password = "op://Agent/db/password"
tls = "disable"
connect_timeout_secs = 2
"""

[fakes]
op = "enabled"

[expect]
exit_code = 0
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
no_files_written = true
stdout_json = { "/dry_run" = true, "/meta/host" = "127.0.0.1:1", "/meta/engine/name" = "postgresql", "/meta/engine/server_version" = "<null>" }

[[expect.runs]]
run = 0
stdout_json = { "/0/name" = "remote", "/0/engine" = "postgresql", "/0/host" = "127.0.0.1:1", "/0/database" = "app", "/0/connection_status" = "unknown" }
