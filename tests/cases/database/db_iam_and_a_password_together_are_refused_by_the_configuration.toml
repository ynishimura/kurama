# Two ways to authenticate are a configuration nobody can mean: refused as
# `CONFIG_INVALID` before anything is read or contacted.
id = "db_iam_and_a_password_together_are_refused_by_the_configuration"
feature = "database"

[combination]
command = "db"
client = "db"
engine = "mysql"
auth = "iam"
db_op = "tables"

[input]
args = ["db", "iam", "--tables", "--json"]
config = """
[db.iam]
engine = "mysql"
host = "127.0.0.1"
database = "app"
username = "iam_reader"
password = "op://Agent/db/password"

[db.iam.iam]
aws_profile = "dev"
"""

[fakes]
op = "enabled"

[expect]
json_error = { code = "CONFIG_INVALID", exit = 2 }
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
no_files_written = true
stderr_contains = ["[db.iam] a server authenticates with password or with [iam], not both"]
