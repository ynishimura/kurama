# A database only a bastion can reach: `status` lists it and `--dry-run`
# plans it without contacting AWS or 1Password, and without a usable plugin
# there is no tunnel -- a database nobody can reach is not worth a password.
id = "db_tunnel_settings_are_checked_before_anything_is_contacted"
feature = "database"

[combination]
command = "status"
client = "db"
"status.kind" = "db"
engine = "mysql"
tls = "verify-ca"
auth = "password"
tunnel = "ssm"
db_op = "tables"

[input]
args = ["status", "--kind", "db", "--json"]
then_run = [
  ["db", "behind", "--dry-run", "--json"],
  ["db", "behind", "--tables", "--json"],
]
config = """
[db.behind]
engine = "mysql"
host = "rds.internal.example.com"
database = "app"
username = "reader"
password = "op://Agent/db/password"
tls = "verify-ca"
connect_timeout_secs = 2

[db.behind.tunnel]
kind = "ssm"
aws_profile = "dev"
instance_name = "bastion"
region = "ap-northeast-1"
"""

[fakes]
op = "enabled"

[expect]
json_error = { code = "DB_INVALID", exit = 2 }
sts_actions = []
op_calls = 0
api_calls = { count = 0 }
no_files_written = true
stderr_json = { "/error/code" = "DB_INVALID", "/error/message" = { contains = "session-manager-plugin" } }

[[expect.runs]]
run = 0
exit_code = 0
stdout_json = { "/0/name" = "behind", "/0/engine" = "mysql", "/0/connection_status" = "unknown" }

[[expect.runs]]
run = 1
exit_code = 0
stdout_json = { "/dry_run" = true, "/meta/host" = "rds.internal.example.com:3306", "/meta/tunnel" = "<null>" }
