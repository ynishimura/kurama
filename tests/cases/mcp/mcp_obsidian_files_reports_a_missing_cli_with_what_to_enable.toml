# A cli_path that names no program: OBSIDIAN_UNAVAILABLE (exit 3), and the
# hint says what a person enables or sets.
id = "mcp_obsidian_files_reports_a_missing_cli_with_what_to_enable"
feature = "mcp"

[combination]
command = "obsidian-files"
cli = "missing"

[input]
args = ["obsidian", "files"]
config = """
[obsidian]
vault = "brain"
allow_paths = ["Wiki/"]
cli_path = "{repo}/tests/fakes/no-such-obsidian"
"""

[expect]
exit_code = 3
error = { code = "OBSIDIAN_UNAVAILABLE", exit = 3 }
hint = "start Obsidian and enable Settings > General > Command line interface, or set [obsidian] cli_path to the CLI (/Applications/Obsidian.app/Contents/MacOS/obsidian)"
stdout_lines = 0
