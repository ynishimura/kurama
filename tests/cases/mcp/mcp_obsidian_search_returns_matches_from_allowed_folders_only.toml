# Without a path, obsidian_search runs search:context once per allowed folder.
# The fake CLI here ignores path= and answers from the whole vault, the way a
# CLI that misreads the folder would: the match in Private/ is dropped, and
# only the notes of Wiki/ and Daily/ reach the agent. `files` is filtered
# the same way when the CLI answers beyond the folder it was asked for.
id = "mcp_obsidian_search_returns_matches_from_allowed_folders_only"
feature = "mcp"

[combination]
command = "mcp"
transport = "stdio"
tool = "obsidian_search"

[input]
args = ["mcp"]
env = { KURAMA_FAKE_OBSIDIAN_MODE = "whole-vault" }
stdin = """
{"jsonrpc":"2.0","id":1,"method":"tools/list"}
{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"obsidian_search","arguments":{"query":"kurama"}}}
"""
then_run = [["obsidian", "files", "--json"]]
config = """
[obsidian]
vault = "brain"
allow_paths = ["Wiki/", "Daily/"]
cli_path = "{repo}/tests/fakes/obsidian"
"""

[expect]
exit_code = 0
files_written = ["home/.local/state/kurama/audit.jsonl"]

[[expect.runs]]
run = 0
stderr_empty = true
obsidian_calls = [
  "vault=brain\tsearch:context\tquery=kurama\tpath=Wiki\tlimit=20\tformat=json",
  "vault=brain\tsearch:context\tquery=kurama\tpath=Daily\tlimit=20\tformat=json",
]
stdout = { line_count = 2, line_containing = [
  ["\"id\":1", "\"name\":\"obsidian_search\"", "\"name\":\"obsidian_read\"", "\"name\":\"obsidian_files\""],
  ["\"id\":2", "\"isError\":false", "\"path\":\"Wiki/kurama.md\"", "\"line\":3", "kurama reads the vault through the Obsidian CLI.", "\"path\":\"Daily/2026-10-05.md\""],
] }
stdout_excludes = ["Private/", "never show this line"]

[[expect.runs]]
run = 1
stderr_empty = true
obsidian_calls = ["vault=brain\tfiles\tfolder=Wiki", "vault=brain\tfiles\tfolder=Daily"]
stdout = { contains = ["\"Wiki/kurama.md\"", "\"Daily/2026-10-05.md\""] }
stdout_excludes = ["Private/"]
